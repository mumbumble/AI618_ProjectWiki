<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>위키 설정 · ProjectWiki</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #1e1e1e; --panel: #262626; --rail: #202020; --line: #363636;
    --text: #dedede; --muted: #a3a3a3; --accent: #b49af4; --chip: #333136;
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  header {
    display: flex; align-items: center; gap: 10px; height: 43px; padding: 0 16px;
    background: var(--rail); border-bottom: 1px solid var(--line);
  }
  .brand { color: var(--accent); font-size: 22px; }
  .wordmark { font-weight: 600; letter-spacing: .2px; }
  .location { margin-left: 4px; padding-left: 14px; border-left: 1px solid #484848; color: var(--muted); font-size: 12px; }
  main {
    width: min(1112px, calc(100% - 80px)); margin: clamp(38px, 7vh, 78px) auto;
    display: grid; grid-template-columns: minmax(240px, .84fr) minmax(0, 1.32fr);
    align-items: start; gap: clamp(32px, 5vw, 80px);
  }
  .intro { padding-top: 20px; }
  h1 { margin: 0; color: #f1eff4; font-size: clamp(34px, 3.6vw, 52px); line-height: 1.26; letter-spacing: -.055em; }
  .intro p { max-width: 34ch; margin: 18px 0 0; color: #b8b5bc; font-size: 15px; line-height: 1.8; word-break: keep-all; }
  .inventory { margin-top: 22px; border-block: 1px solid var(--line); }
  .inventory summary { padding: 12px 0; cursor: pointer; overflow-wrap: anywhere; }
  .inventory ul { list-style: none; padding: 0 12px; max-height: 38vh; overflow: auto; color: var(--muted); }
  .inventory li { padding: 3px 0; overflow-wrap: anywhere; }
  form { min-width: 0; background: var(--panel); border: 1px solid #403e42; border-radius: 12px; }
  .question { min-width: 0; margin: 0 26px; padding: 22px 0; }
  .question + .question { border-top: 1px solid var(--line); }
  .pair { margin: 12px 16px; min-width: 0; border: 1px solid #4a434f; border-radius: 8px; container-type: inline-size; }
  .pair > summary { display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 14px; font-weight: 600; cursor: pointer; list-style: none; word-break: keep-all; overflow-wrap: anywhere; }
  .pair > summary::-webkit-details-marker { display: none; }
  .pair > summary::after { content: ""; width: 7px; height: 7px; flex: none; border: solid var(--accent);
    border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .pair[open] > summary { color: #d9c6ff; }
  .pair[open] > summary::after { transform: rotate(225deg); }
  .pair-content { padding: 0 14px 14px; }
  [data-stage="purpose"] .pairs-only, [data-stage="pairs"] .purpose-only { display: none; }
  .sources { display: grid; grid-template-columns: minmax(0, 1fr) 32px minmax(0, 1fr); align-items: center;
    padding: 14px 3px; background: radial-gradient(#454149 1px, transparent 1px) 0 0/14px 14px; }
  .file-node { min-width: 0; background: #2c2931; border: 1px solid #685e74; padding: 12px; border-radius: 9px; }
  .file-node, .intro p { overflow-wrap: anywhere; }
  .file-node small { display: block; color: #b9b0c2; }
  .file-node p { margin: 6px 0 0; color: #d6d0dc; font-size: 13px; }
  .pair-link { position: relative; border-top: 2px dashed #a799b8; }
  .direction { display: none; }
  .pair:has([value=edge_confirm]:checked) .direction { display: grid; gap: 4px; margin: 12px 0 0; font-size: 13px; }
  .direction select { width: 100%; min-width: 0; padding: 8px; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
  .pair:has([value=edge_confirm]:checked):has(option[value=forward]:checked) { --tip: polygon(0 0,100% 50%,0 100%); --end: 0; }
  .pair:has([value=edge_confirm]:checked):has(option[value=reverse]:checked) { --tip: polygon(100% 0,0 50%,100% 100%); --start: 0; }
  .pair-link::after { content: ""; position: absolute; top: -6px; left: var(--start,auto); right: var(--end,auto);
    width: 8px; height: 9px; background: var(--accent); clip-path: var(--tip,inset(100%)); }
  .pair:has([value=edge_confirm]:checked) .pair-link { border-top: 3px solid var(--accent); }
  .pair:has([value=edge_confirm]:checked) .file-node { border-color: var(--accent); }
  .pair:has([value=edge_irrelevant]:checked) .pair-link { visibility: hidden; }
  .intro .notice { font-size: 13px; color: var(--muted); }
  .choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
  .choices label { display: flex; align-items: center; justify-content: center; gap: 4px; min-height: 42px;
    margin: 0; padding: 5px; white-space: nowrap; font-size: 13px; font-weight: 400; cursor: pointer;
    border-radius: 6px; background: var(--chip); border: 1px solid #49464c; }
  .choices label:has(:checked) { border-color: #9475d2; background: #493b65; }
  .choices input { accent-color: var(--accent); margin: 0; }
  @container (max-width: 550px) { .choices { grid-template-columns: 1fr; } }
  label { display: block; margin-bottom: 10px; color: #eeecf0; font-size: 16px; font-weight: 600; }
  label small { display: inline-block; margin-left: 6px; color: var(--muted); font-size: 12px; font-weight: 400; }
  textarea {
    display: block; width: 100%; min-height: 60px; padding: 9px 12px; resize: vertical;
    border: 1px solid #4a474d; border-radius: 6px; background: var(--bg); color: var(--text); font: inherit;
  }
  textarea::placeholder { color: #99959f; }
  textarea:focus { border-color: var(--accent); }
  :is(textarea, button, summary):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .examples { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  button { font: inherit; cursor: pointer; }
  .examples button {
    padding: 4px 10px; border: 1px solid #49464c; border-radius: 6px;
    background: var(--chip); color: #d3cfd7; font-size: 12px; line-height: 1.6;
  }
  .examples button:hover { background: #403b49; border-color: #746284; }
  .examples button[data-applied] { background: #493b65; color: #e1d3ff; border-color: #8062ba; }
  .examples button[data-applied]::before { content: "✓"; margin-right: 4px; }
  .actions {
    display: grid; grid-auto-columns: minmax(0, 1fr); grid-auto-flow: column; align-items: center; gap: 8px;
    padding: 16px 26px; border-top: 1px solid var(--line);
  }
  #status { margin: 0; grid-column: 1/-1; text-align: center; color: #ebe1ff; padding: 12px; background: #383042; border-radius: 6px; }
  #status:empty { display: none; }
  #status:not(:empty)::before { content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 8px;
    vertical-align: -2px; border: 2px solid #776984; border-top-color: #e7d6ff; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #status:not(:empty)::before { animation: none; } }
  form[data-busy] .actions:has(#status:not(:empty)) button { display: none; }
  button[type=submit] {
    padding: 9px 18px; border: 1px solid #9475d2; border-radius: 6px;
    background: #7658b9; color: #fff; font-weight: 600; white-space: nowrap;
  }
  button[type=submit].back { background: var(--chip); color: var(--text); border-color: #49464c; }
  button[type=submit]:hover { background: #8164c4; }
  button:disabled { opacity: .65; cursor: wait; }
  @media (max-width: 800px) {
    main { width: min(620px, calc(100% - 40px)); grid-template-columns: minmax(0, 1fr); gap: 25px; margin: 28px auto; }
    .intro { padding: 0; }
    .intro br { display: none; }
    .intro p { max-width: none; margin-top: 8px; }
  }
  @media (max-width: 500px) {
    .sources { grid-template-columns: 1fr; }
    .pair-link { justify-self: center; height: 20px; border-top: 0; border-left: 2px dashed #a799b8; }
    .pair:has([value=edge_confirm]:checked) .pair-link { border-top: 0; border-left: 3px solid var(--accent); }
    .pair-link::after { left: -5px; right: auto; top: var(--start,auto); bottom: var(--end,auto); transform: rotate(90deg); }
    main { width: calc(100% - 28px); }
    h1 { font-size: 30px; }
    .question { margin: 0 16px; padding: 18px 0; }
    textarea { font-size: 16px; }
    .examples button { min-height: 32px; }
    .actions { padding: 14px 16px; }
  }
</style>
</head>
<body data-stage="__STAGE__">
<header>
  <span class="brand" aria-hidden="true">◈</span>
  <span class="wordmark">ProjectWiki</span>
  <span class="location">위키 설정</span>
</header>
<main>
  <div class="intro">
    <h1 class="purpose-only">위키를 어디에<br> 쓰실 건가요?</h1>
    <p class="purpose-only">용도를 고르거나 직접 적어 주세요. 다음 화면에서 파일 내용을 보고 함께 두면 유용한 자료를 고를 수 있어요.</p>
    <h1 class="pairs-only">어떤 자료를<br> 함께 볼까요?</h1>
    <p class="pairs-only">위키 용도 · __DISPLAYPURPOSE__</p>
    <p class="pairs-only notice">__NOTICE__</p>
    <details class="inventory"><summary>__PROJECT__ · 입력 파일 __COUNT__개 보기</summary><ul>__FILES__</ul></details>
  </div>
  <form method="post" action="__ROUTE__" accept-charset="UTF-8">
    __PAIRS__
    <div class="purpose-only">
    <div class="question">
      <label for="purpose">이 위키를 어디에 쓰나요?</label>
      <textarea id="purpose" name="purpose" rows="2" maxlength="1000" placeholder="예: 다음 주 발표에서 프로젝트를 소개하고 싶어요.">__PURPOSE__</textarea>
      <div class="examples" data-for="purpose" role="group" aria-label="사용 목적 예시">
        <button type="button">발표 준비</button>
        <button type="button">팀원에게 인수인계</button>
        <button type="button">프로젝트 빠르게 이해하기</button>
      </div>
    </div>
    </div>
    <div class="actions">
      <p role="status" id="status"></p>
      <button type="submit" class="purpose-only" formaction="__ROUTE__/questions">용도에 맞는 연결 살펴보기</button>
      <button type="submit" class="pairs-only back" formaction="__ROUTE__/purpose">용도 수정</button>
      <button type="submit" class="pairs-only">첫 그래프 만들기</button>
    </div>
  </form>
</main>
<script>
  for (const group of document.querySelectorAll(".examples")) {
    const input = document.getElementById(group.dataset.for);
    const buttons = [...group.querySelectorAll("button")];
    const choices = buttons.map(button => button.textContent.trim());
    function markExamples() {
      const lines = input.value.trim().split("\n");
      for (const button of buttons) {
        button.toggleAttribute("data-applied", lines.includes(button.textContent.trim()));
      }
    }
    for (const button of buttons) {
      button.onclick = () => {
        const example = button.textContent.trim();
        const current = input.value.trim();
        if (!current || choices.includes(current)) {
          input.value = example;
        } else if (!current.split("\n").includes(example)) {
          input.value = (current + "\n" + example).slice(0, input.maxLength);
        }
        markExamples();
        input.focus();
      };
    }
    input.addEventListener("input", markExamples);
    markExamples();
  }
  const form = document.querySelector("form");
  const status = document.getElementById("status");
  form.onsubmit = event => {
    const target = event.submitter?.getAttribute("formaction") || "";
    if (form.dataset.busy) return false;
    status.textContent = target.endsWith("/questions") ? "잠시만 기다려 주세요. 파일 요약과 맞춤 질문을 준비하고 있어요."
      : target.endsWith("/purpose") ? "" : "첫 그래프를 만드는 중입니다.";
    form.dataset.busy = "true";
  };
  window.addEventListener("pageshow", event => {
    if (event.persisted) {
      delete form.dataset.busy;
      status.textContent = "";
    }
  });

</script>
</body>
</html>
