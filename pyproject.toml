[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "projectwiki"
version = "0.1.0"
description = "Local project folder -> evidence-grounded relation graph that the user can correct"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scikit-learn>=1.2",
  "pymupdf>=1.24",
  "torch>=2.6",
  "transformers>=4.44",
  "huggingface_hub",
  "anthropic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
projectwiki = "projectwiki.cli:main"

[tool.setuptools.packages.find]
include = ["projectwiki*"]

[tool.setuptools.package-data]
"projectwiki.srcs" = ["view_template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
