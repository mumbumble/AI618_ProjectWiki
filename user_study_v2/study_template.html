  const rs=els.map(x=>x.getBoundingClientRect()),r={left:Math.min(...rs.map(q=>q.left)),top:Math.min(...rs.map(q=>q.top)),right:Math.max(...rs.map(q=>q.right)),bottom:Math.max(...rs.map(q=>q.bottom))};r.width=r.right-r.left;r.height=r.bottom-r.top;const p=6;

  const L=r.left-p,T=r.top-p,R=r.right+p,B=r.bottom+p;
  [[0,0,W,T],[0,B,W,H-B],[0,T,L,B-T],[R,T,W-R,B-T],s.wait?[0,0,0,0]:[L,T,R-L,B-T]].forEach(([x,y,w,h],i)=>Object.assign(blk[i].style,{left:x+"px",top:y+"px",width:Math.max(0,w)+"px",height:Math.max(0,h)+"px"}));

   <p class="hint">이제 창을 닫으셔도 됩니다.</p></div></div>`};
 const send=()=>{wait();const t0=Date.now();
  sendResult().then(r=>setTimeout(()=>{LOG.sent=r;
   if(r=="ok"){forget();done("응답이 잘 저장되었습니다.");return}
   if(r=="off"){$("app").innerHTML=`<div class="page"><div class="paper endp"><h2>결과 파일을 저장해 주세요</h2><p class="lead2">이 페이지는 결과를 자동으로 보내지 않습니다. 아래 버튼으로 파일을 저장해서 안내받은 곳으로 보내 주세요.</p><button class="primary" id="save">결과 파일 저장</button></div></div>`;
    $("save").onclick=()=>{saveFile();LOG.sent="ok";forget();done("결과 파일을 저장했습니다. 안내받은 곳으로 보내 주시면 됩니다.")};return}
   persist();$("app").innerHTML=`<div class="page"><div class="paper endp"><h2>결과를 보내지 못했습니다</h2><p class="lead2">인터넷 연결을 확인하고 다시 보내 주세요. 계속 안 되면 파일로 저장해서 연구진에게 보내 주셔도 됩니다.</p>
    <div class="actions"><button class="primary" id="retry">다시 보내기</button><button class="ghost" id="sv">파일로 저장</button></div></div></div>`;
   $("retry").onclick=send;$("sv").onclick=()=>{saveFile();LOG.sent="ok";forget();done("결과 파일을 저장했습니다. 연구진에게 보내 주세요.")}},Math.max(0,900-(Date.now()-t0))))};
 send();
}

/* ---------- start ---------- */
(()=>{let saved=null;try{saved=JSON.parse(localStorage.getItem(SAVE_KEY)||"null")}catch(e){}
 if(saved&&saved.step>0&&saved.step<FLOW.length-1&&Date.now()-saved.at<7*864e5)resume(saved);else{LOG.steps.intro={t0:Date.now(),events:[]};render()}})();
</script>
