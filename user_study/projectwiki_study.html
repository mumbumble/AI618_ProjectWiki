| 5 | Cosine prototype head | 1.0분 |\n| 6 | 손실 함수와 학습 설정 | 1.0분 |\n| 7 | 주요 결과 (Figure 2, 메인 표) | 2.0분 |\n| 8 | Ablation | 1.5분 |\n| 9 | 한계와 향후 과제 | 1.0분 |\n| 10 | 마무리와 일정 | 0.5분 |\n\n## 3. 슬라이드별 내용\n\n### 슬라이드 1. 동기 (Motivation)\n- 식물 질병 진단을 위해 현장에서 찍은 leaf photo를 분류한다.\n- 데이터: leafdoc_fs, 18,420장, 54 클래스 (species x disease).\n- 분할: base 30 클래스 (train), val 12 클래스, novel 12 클래스 (test).\n- 새 질병이 나올 때마다 수백 장을 모으기 어렵다 -> 클래스당 1~5장으로 학습 가능한 few-shot 방식이 필요하다.\n\n### 슬라이드 2. ProtoClass 복습\n- Episodic training, 5-way episode.\n- Prototype = support 임베딩의 평균, query와의 거리로 분류.\n- 거리는 squared Euclidean distance.\n- 한계: 밝기와 조명 변화에 민감하고, 증강 장치가 없다.\n\n### 슬라이드 3. 전체 파이프라인 (Figure 1)\n- 위쪽 흐름: Leaf photo -> FFT -> FreqMix (low-band amplitude mix) -> iFFT -> ResNet-12 encoder -> Cosine prototype head -> Class scores.\n- 아래쪽 분기: clean view는 바로 encoder로 들어가고, Consistency loss (KL)가 clean 예측과 mixed 예측을 연결한다.\n- 강조: 새 모듈은 FreqMix와 consistency loss 두 개이고, 나머지 구조는 ProtoClass와 같다.\n\n### 슬라이드 4. FreqMix (주파수 영역 증강)\n- 각 채널에 2D FFT를 적용하고 amplitude A와 phase P로 나눈다.\n- 같은 episode의 두 이미지 a, b에서 low-frequency band만 섞는다.\n  - A_mix = (1 - M) * A_a + M * (lam * A_a + (1 - lam) * A_b)\n  - M 안쪽만 보간, 바깥은 A_a 유지.\n- Phase P_a는 그대로 두고 inverse FFT. 라벨은 이미지 a의 라벨을 따른다.\n- 하이퍼파라미터: beta = 0.1 (shifted spectrum 짧은 변의 10%를 덮는 중앙 정사각형), lam ~ Uniform(0.3, 0.7), 적용 확률 p = 0.5.\n- 학습 시에만, support와 query 이미지 모두에 적용.\n- 직관: low band는 잎 색과 조명 정보를 담고, 질병 텍스처는 고주파에 있어 보존된다.\n\n### 슬라이드 5. Cosine prototype head\n- Prototype p_c = 클래스 c support 임베딩을 L2 정규화한 뒤 평균.\n- Logit = s * cos(f_q, p_c), s는 학습 가능한 scale, 초기값 10.0.\n- Encoder: ResNet-12 (64-160-320-640 채널), 640차원 임베딩 (global average pooling).\n- 왜 cosine인가: 임베딩 norm의 영향을 줄이고, 거리 척도 차이를 scale 하나로 조정한다.\n\n### 슬라이드 6. 손실 함수와 학습 설정\n- 전체 손실: L = L_ce + 0.5 * L_cons (lambda_cons = 0.5).\n- L_ce: query set의 cosine logit에 대한 cross-entropy.\n- L_cons: clean query view (detach)와 FreqMix query view 사이의 KL divergence.\n- 학습: Adam, lr 0.001, weight decay 0.0005, cosine scheduler, 이미지 크기 84x84.\n- 에피소드: 5-way, 5-shot, query 15장/클래스, 40,000 episodes, seed 42.\n- 자원: RTX 4090 1장, 총 5시간 40분. 검증은 500 step마다.\n- 최고 체크포인트는 step 38,500 (최종 val 0.871).\n\n### 슬라이드 7. 주요 결과 (Figure 2 + 메인 표)\n- 그림: 1, 2, 5, 10 shot에 따른 정확도 곡선 (figures/accuracy_vs_shots.png).\n- 평가: 600 test episodes, 5-way, query 15장, 평균 정확도와 95% 신뢰구간 (ci95).\n\n| 방법 | 1-shot | 2-shot | 5-shot | 10-shot |\n|---|---|---|---|---|\n| Finetune | 52.3 | 61.8 | 72.5 | 79.1 |\n| ProtoClass | 60.4 | 70.2 | 80.9 | 85.0 |\n| FastAdapt | 64.8 | 73.5 | 83.6 | 87.2 |\n| LeafProto (ours) | 69.7 | 78.3 | 87.4 | 90.6 |\n\n- 핵심 수치: 5-shot 87.4% (FastAdapt 대비 +3.8p, ProtoClass 대비 +6.5p).\n- 모든 shot 수에서 LeafProto가 가장 높다. 10-shot에서 격차는 FastAdapt 대비 3.4p로 줄어든다.\n- 추론 비용: FastAdapt는 episode당 약 3.1배 느리다 (5-step ridge 내부 루프). LeafProto는 추가 inner loop가 없다.\n\n### 슬라이드 8. Ablation (5-shot 기준)\n\n| 설정 | 정확도 | 변화 |\n|---|---|---|\n| Full LeafProto | 87.4 | - |\n| w/o FreqMix | 84.0 | -3.4 |\n| Euclidean head (cosine 대신) | 85.2 | -2.2 |\n| w/o consistency loss (lambda_cons = 0) | 86.3 | -1.1 |\n| FreqMix full-spectrum (beta = 1.0) | 85.6 | -1.8 |\n\n- 메시지 1: FreqMix가 가장 큰 기여 요인이다.\n- 메시지 2: beta = 1.0 (전체 주파수 혼합)은 성능을 떨어뜨린다. 질병 텍스처가 섞이면 안 된다는 근거.\n- 메시지 3: cosine head와 consistency loss도 각각 독립적으로 기여한다.\n\n### 슬라이드 9. 한계와 향후 과제\n- 한계\n  - 데이터셋이 leafdoc_fs 하나뿐이다.\n  - 해상도 84x84로 작은 병반은 놓칠 수 있다.\n  - 종 간 전이 (cross-species transfer)는 확인하지 않았다.\n  - beta를 고정값 0.1로 두었다.\n- 향후 과제 (랩 아이디어 목록 기준)\n  - beta를 episode마다 학습하는 adaptive FreqMix.\n  - phase도 함께 섞기.\n  - 다중 스케일 prototype.\n  - 클래스별 학습 scale s.\n  - 종 간 전이, 모바일 배포용 ResNet-12 경량화.\n  - temperature를 둔 consistency loss.\n\n### 슬라이드 10. 마무리와 일정\n- 기여 3가지: (1) FreqMix 저주파 진폭 혼합, (2) cosine prototype head, (3) consistency loss.\n- 일정: 내부 검토 마감 2026-11-30, 워크숍 제출 AgriVision Workshop 2027, 2026-12-15.\n- 감사: 데이터 분할 (김서연), 베이스라인과 ablation (이두윤), 작성 (지민), 지도 (정민준 교수).\n\n## 4. 예상 질문 준비\n\n- Q. phase를 그대로 두는 이유는? -> 질병 패턴은 주로 고주파 텍스처에 있고, 위상은 형태 정보를 담아 유지하는 쪽이 안전하다. phase 혼합은 향후 과제.\n- Q. beta = 0.1은 어떻게 정했나? -> 고정 하이퍼파라미터로 두었고, beta = 1.0 ablation으로 전체 주파수 혼합의 손해를 확인했다.\n- Q. 신뢰구간이 겹치는 1-shot 비교는? -> 1-shot에서도 LeafProto 69.7 vs FastAdapt 64.8로 차이가 ci95 (약 0.9)보다 크다.\n- Q. ProtoClass 원논문 수치와 차이는? -> 원 벤치마크 수치와 직접 비교하지 않고, 같은 leafdoc_fs 분할에서 재실험한 값만 사용했다.\n- Q. 학습 시간과 추론 속도는? -> 학습 5시간 40분 (RTX 4090), 추론은 FastAdapt보다 빠르다 (약 3.1배 차이).\n"}, {"kind": "text", "ext": "html", "data": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>LeafProto: Few-Shot Plant Disease Classification with Frequency-Domain Mixing and a Cosine Prototype Head<\/title>\n<style>\nbody { font-family: Arial, Helvetica, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; color: #222; line-height: 1.55; }\nh1 { font-size: 1.8em; margin-bottom: 0.3em; }\n.authors { font-size: 1.05em; margin: 0; }\n.affil { color: #555; margin-top: 4px; }\n.links a { display: inline-block; margin-right: 12px; padding: 6px 14px; border: 1px solid #2e7d32; border-radius: 4px; color: #2e7d32; text-decoration: none; }\ntable { border-collapse: collapse; width: 100%; margin: 12px 0; }\nth, td { border: 1px solid #ccc; padding: 6px 10px; text-align: center; }\nth:first-child, td:first-child { text-align: left; }\ntr.ours td { font-weight: bold; background: #e8f5e9; }\nimg { max-width: 100%; border: 1px solid #eee; }\npre { background: #f5f5f5; padding: 12px; overflow-x: auto; font-size: 0.9em; }\n.caption { font-size: 0.9em; color: #555; }\n<\/style>\n<\/head>\n<body>\n\n<h1>LeafProto: Few-Shot Plant Disease Classification with Frequency-Domain Mixing and a Cosine Prototype Head<\/h1>\n<p class=\"authors\">Park Hyunwoo, Kim Seoyeon, Lee Doyun, Choi Jimin, Jung Minjun<\/p>\n<p class=\"affil\">Plant Vision Lab, Hanbit University<\/p>\n\n<div class=\"links\">\n  <a href=\"../paper/leafproto_draft_v2.pdf\">Paper (PDF)<\/a>\n  <a href=\"https://github.com/plant-vision-lab/leafproto\">Code<\/a>\n<\/div>\n\n<h2>Abstract<\/h2>\n<p>Diagnosing plant disease from field photos usually has only a handful of labeled examples per disease.\nWe present LeafProto, a few-shot classifier for leaf photos that extends the ProtoClass prototype network in three ways:\na cosine similarity head with a learnable scale, a frequency-domain augmentation called FreqMix that mixes low-frequency\nFourier amplitude between images while keeping phase, and a consistency loss that aligns predictions on clean and mixed views.\nOn leafdoc_fs, a 54-class dataset of 18,420 field photos, LeafProto reaches 87.4% 5-way 5-shot accuracy,\n3.8 points above FastAdapt and 6.5 points above ProtoClass. In our ablation, removing FreqMix causes the largest drop.<\/p>\n\n<h2>Overview<\/h2>\n<figure>\n  <img src=\"../figures/overview.png\" alt=\"LeafProto pipeline overview\">\n  <figcaption class=\"caption\">Overview of the LeafProto pipeline. A leaf photo is transformed by FFT, mixed in its low-frequency band by FreqMix, and returned by iFFT.\n  The ResNet-12 encoder and cosine prototype head produce class scores. A lower branch sends the clean view directly to the encoder,\n  and a consistency loss (KL) links the clean and mixed predictions.<\/figcaption>\n<\/figure>\n\n<h2>Method<\/h2>\n<ul>\n  <li><strong>FreqMix.<\/strong> Each 84x84 leaf image is transformed with a 2D FFT per channel and split into amplitude and phase.\n  Inside a centered square covering 10% of the shorter side of the shifted spectrum (beta = 0.1), the amplitude of one image is\n  interpolated with the amplitude of another image from the same episode, using lam drawn from Uniform(0.3, 0.7).\n  Phase is kept and the inverse FFT returns the mixed image, which keeps the label of the original. It is applied with probability 0.5 per image, in training only.<\/li>\n  <li><strong>Encoder.<\/strong> ResNet-12 with channels 64-160-320-640 and a 640-d embedding after global average pooling.<\/li>\n  <li><strong>Cosine prototype head.<\/strong> Each prototype is the mean of L2-normalized support embeddings of its class.\n  Query logits are s * cos(f_q, p_c), where the scale s is learnable and initialized to 10.0.<\/li>\n  <li><strong>Losses.<\/strong> The total loss is L = L_ce + lambda_cons * L_cons with lambda_cons = 0.5.\n  L_ce is cross-entropy over the query logits. L_cons is the KL divergence between the softmax predictions of the clean query view\n  (detached) and the FreqMix query view.<\/li>\n  <li><strong>Training.<\/strong> Episodic training with 5-way episodes and 15 queries per class, 40,000 episodes, Adam with learning rate 0.001\n  and weight decay 0.0005, a cosine learning-rate schedule, and seed 42. One RTX 4090 took 5 h 40 min.<\/li>\n<\/ul>\n\n<h2>Results<\/h2>\n<p>Accuracy (%) on the 12 novel test classes of leafdoc_fs, 5-way episodes, 15 queries per class. Mean &plusmn; 95% confidence interval over 600 test episodes.<\/p>\n<table>\n  <thead>\n    <tr><th>Method<\/th><th>1-shot<\/th><th>2-shot<\/th><th>5-shot<\/th><th>10-shot<\/th><\/tr>\n  <\/thead>\n  <tbody>\n    <tr><td>Finetune<\/td><td>52.3 &plusmn; 0.9<\/td><td>61.8 &plusmn; 0.8<\/td><td>72.5 &plusmn; 0.7<\/td><td>79.1 &plusmn; 0.6<\/td><\/tr>\n    <tr><td>ProtoClass<\/td><td>60.4 &plusmn; 0.9<\/td><td>70.2 &plusmn; 0.8<\/td><td>80.9 &plusmn; 0.6<\/td><td>85.0 &plusmn; 0.5<\/td><\/tr>\n    <tr><td>FastAdapt<\/td><td>64.8 &plusmn; 0.9<\/td><td>73.5 &plusmn; 0.8<\/td><td>83.6 &plusmn; 0.6<\/td><td>87.2 &plusmn; 0.5<\/td><\/tr>\n    <tr class=\"ours\"><td>LeafProto (ours)<\/td><td>69.7 &plusmn; 0.9<\/td><td>78.3 &plusmn; 0.7<\/td><td>87.4 &plusmn; 0.5<\/td><td>90.6 &plusmn; 0.4<\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<p><strong>Ablation (5-shot).<\/strong> Full LeafProto 87.4. Without FreqMix 84.0 (-3.4). Euclidean head instead of cosine 85.2 (-2.2).\nWithout consistency loss (lambda_cons = 0) 86.3 (-1.1). FreqMix over the full spectrum (beta = 1.0) 85.6 (-1.8).<\/p>\n\n<h2>Paper<\/h2>\n<p>Draft v2 of the paper is available as <a href=\"../paper/leafproto_draft_v2.pdf\">leafproto_draft_v2.pdf<\/a>.\nKnown limitations: one dataset, 84x84 resolution, no cross-species transfer, and a fixed beta.<\/p>\n\n<h2>Citation<\/h2>\n<pre>@misc{park2026leafproto,\n  title  = {LeafProto: Few-Shot Plant Disease Classification with Frequency-Domain Mixing and a Cosine Prototype Head},\n  author = {Park, Hyunwoo and Kim, Seoyeon and Lee, Doyun and Choi, Jimin and Jung, Minjun},\n  year   = {2026},\n  note   = {Draft, Plant Vision Lab, Hanbit University},\n  url    = {https://github.com/plant-vision-lab/leafproto}\n}<\/pre>\n\n<\/body>\n<\/html>\n"}, {"kind": "text", "ext": "yaml", "data": "# LeafProto base configuration\n# Default hyperparameters for episodic training on leafdoc_fs.\n# Experiment configs inherit from this file and override only what they change.\n# Owner: Park Hyunwoo (training code). Last edited 2026-10-02.\n\nseed: 42\n\ndata:\n  root: data/leafdoc_fs          # dataset folder with photos and metadata\n  image_size: 84                 # leaf photos resized to 84x84\n  num_workers: 4\n  splits:\n    train_classes: 30            # base classes used for meta-training\n    val_classes: 12              # used for model selection during training\n    test_classes: 12             # novel classes, only used in evaluation\n\nepisode:\n  n_way: 5\n  k_shot: 1\n  n_query: 15\n  batch_episodes: 1              # one episode per optimizer step\n\nmodel:\n  name: LeafProtoNet\n  encoder: resnet12\n  channels: [64, 160, 320, 640]\n  embed_dim: 640                 # after global average pooling\n\nhead:\n  type: cosine_prototype\n  scale_init: 10.0               # learnable scale s, initialised here\n\nfreqmix:\n  enabled: true\n  beta: 0.1                      # centered square band covering 10% of the shorter side\n  lam_min: 0.3                   # lam ~ Uniform(lam_min, lam_max)\n  lam_max: 0.7\n  p: 0.5                         # apply probability per image\n  apply_to: [support, query]\n  apply_phase: train_only        # FreqMix is off at evaluation time\n\nloss:\n  ce: true\n  lambda_cons: 0.5               # weight of KL consistency term\n\noptim:\n  name: adam\n  lr: 0.001\n  weight_decay: 0.0005\n  scheduler: cosine\n\ntrain:\n  episodes: 40000\n  eval_every: 500                # steps between validation runs\n  save_best: true\n  best_metric: val_acc\n  checkpoint_dir: checkpoints\n  log_dir: logs                  # log file name is built from the run date\n\neval:\n  test_episodes: 600\n  n_way: 5\n  n_query: 15\n  confidence: 0.95               # reported as ci95 over episodes\n  results_dir: results\n"}, {"kind": "text", "ext": "yaml", "data": "inherits: base.yaml\n\n# Main experiment: 5-way, 5-shot episodes on leafdoc_fs.\n# Every key not listed here comes from base.yaml.\n# Run with:\n#   python src/train.py --config configs/fewshot_5way.yaml\n\nn_way: 5            # same as base, listed so the episode setup is readable here\nk_shot: 5           # overrides base k_shot = 1\nn_query: 15         # same as base\nepisodes: 40000     # same as base; training length for the main run\n\n# Outputs\nlog_dir: logs                   # training log goes to logs/train_{YYYY-MM-DD}.log\nresults_csv: results/           # summary accuracy table is written into the results folder\ncheckpoint_dir: checkpoints     # best checkpoint is saved here (best.pt)\n\n# Evaluation protocol (used by src/evaluate.py)\neval:\n  test_episodes: 600        # 5-way test episodes\n  queries_per_class: 15\n  metric: accuracy_percent  # reported with 95% confidence interval over episodes\n  seed: 42\n\n# FreqMix settings are inherited from base.yaml\n# (beta 0.1, p 0.5, lambda_cons 0.5), so they are not repeated here.\n# Ablation runs change these values in their own runs, not in this file.\n"}, {"kind": "text", "ext": "log", "data": "[2026-10-08 09:12:03] config: configs/fewshot_5way.yaml\n[2026-10-08 09:12:03] inherited base settings applied; overrides: k_shot=5, episodes=40000, log_dir=logs, results_csv=results/main_results.csv\n[2026-10-08 09:12:03] seed 42 set (torch, numpy, random)\n[2026-10-08 09:12:04] device cuda:0 NVIDIA GeForce RTX 4090\n[2026-10-08 09:12:04] data: leafdoc_fs, 18420 leaf photos, 54 classes, split train 30 / val 12 / test 12, image_size 84\n[2026-10-08 09:12:05] episode: n_way 5, k_shot 5, n_query 15, batch 1 episode/step, num_workers 4\n[2026-10-08 09:12:05] model: LeafProtoNet, ResNet-12 channels 64-160-320-640, embedding dim 640, CosineProtoHead scale_init 10.0\n[2026-10-08 09:12:05] optimizer adam lr 0.001 weight_decay 0.0005, scheduler cosine\n[2026-10-08 09:12:05] FreqMix beta 0.1, lam ~ U(0.3, 0.7), p 0.5 (train only); lambda_cons 0.5\n[2026-10-08 09:12:05] eval_every 500 steps, total episodes 40000\n[2026-10-08 09:16:18] step 500 loss 1.214 val_acc 0.712 (new best, saved checkpoints/best.pt)\n[2026-10-08 09:20:33] step 1000 loss 1.087 val_acc 0.734 (new best, saved checkpoints/best.pt)\n[2026-10-08 09:29:03] step 2000 loss 0.963 val_acc 0.758 (new best, saved checkpoints/best.pt)\n[2026-10-08 09:54:33] step 5000 loss 0.702 val_acc 0.801 (new best, saved checkpoints/best.pt)\n[2026-10-08 10:37:03] step 10000 loss 0.611 val_acc 0.829 (new best, saved checkpoints/best.pt)\n[2026-10-08 11:19:33] step 15000 loss 0.541 val_acc 0.842 (new best, saved checkpoints/best.pt)\n[2026-10-08 12:02:03] step 20000 loss 0.488 val_acc 0.853 (new best, saved checkpoints/best.pt)\n[2026-10-08 12:44:33] step 25000 loss 0.447 val_acc 0.859 (new best, saved checkpoints/best.pt)\n[2026-10-08 13:27:03] step 30000 loss 0.419 val_acc 0.864 (new best, saved checkpoints/best.pt)\n[2026-10-08 14:09:33] step 35000 loss 0.392 val_acc 0.868 (new best, saved checkpoints/best.pt)\n[2026-10-08 14:39:18] step 38500 loss 0.379 val_acc 0.874 (new best, saved checkpoints/best.pt)\n[2026-10-08 14:52:03] step 40000 loss 0.371 val_acc 0.871\n[2026-10-08 14:52:03] training finished: 40000 episodes, total time 5 h 40 min\n[2026-10-08 14:52:03] final val_acc 0.871; best val_acc 0.874 at step 38500, checkpoint checkpoints/best.pt kept for evaluation\n"}, {"kind": "text", "ext": "md", "data": "# LeafProto 향후 연구 아이디어\n\nPlant Vision Lab, 2026-11-21 정리 (작성: Park Hyunwoo, 검토 예정: Prof. Jung Minjun)\n\n이 문서는 현재 LeafProto 방법의 구성 요소(FreqMix, CosineProtoHead, ResNet-12 인코더, 일관성 손실)를 바탕으로 다음 단계에서 시도할 만한 확장 아이디어를 모아 둔 메모입니다. 현재 결과는 5-shot 정확도 87.4%이며, 이 수치를 넘어서는 것이 목표입니다. 아이디어 하나당 실험 비용과 기대 효과를 함께 적었습니다.\n\n## 1. FreqMix 확장\n\n### 1-1. 에피소드별 beta 학습 (adaptive FreqMix)\n\n현재 FreqMix는 저주파 대역 비율 beta = 0.1로 고정되어 있습니다. beta를 에피소드마다 입력 이미지의 스펙트럼 통계(예: 진폭 스펙트럼의 에너지 분포)에서 예측하면 잎 사진마다 조명 변화 정도에 맞춘 혼합이 가능합니다.\n\n- 기대 효과: 조명이 심하게 다른 현장 사진에서 과도한 혼합을 줄일 수 있음\n- 주의점: beta 고정값 0.1과 전 대역 혼합(beta = 1.0, 85.6%) 사이의 중간 지점을 찾는 것이 핵심입니다. 두 경우를 반드시 비교군으로 둘 것\n- 제안 실험: beta를 0.05, 0.1, 0.2 범위에서 예측하도록 제한하고 5-shot 정확도 변화를 확인\n\n### 1-2. 위상(phase)도 함께 섞기\n\n현재 방법은 위상 P_a를 그대로 두고 진폭 A만 섞습니다. 위상 성분은 잎맥과 병반의 공간 구조를 담고 있으므로, 위상을 조금씩 섞으면 질병 질감이 흐려질 위험이 있습니다. 대신 위상 혼합 강도를 아주 작게(예: 0.05 이하) 두는 실험을 생각해 볼 수 있습니다.\n\n- 기대 효과: 종(species) 간 형태 차이에 대한 일반화 향상 가능\n- 위험: 고주파 질병 텍스처가 손상될 수 있으므로 w/o FreqMix(84.0%) 대비 개선이 있는지 먼저 확인\n\n### 1-3. 적용 확률 p의 스케줄링\n\n현재 p = 0.5로 고정되어 있습니다. 학습 초반에는 약하게, 후반에는 강하게 적용하는 커리큘럼을 시도할 수 있습니다. 40000 에피소드 중 앞부분은 p를 낮게 두는 방식이 자연스럽습니다.\n\n## 2. CosineProtoHead 확장\n\n### 2-1. 다중 스케일 프로토타입\n\n현재 프로토타입 p_c는 L2 정규화된 support 임베딩의 평균 하나입니다. 인코더의 중간 레이어(예: 160, 320 채널 블록)에서도 프로토타입을 만들어 합치면 색상 정보와 질감 정보를 동시에 쓸 수 있습니다.\n\n- 제안: 640-d 최종 임베딩 외에 중간 블록의 global average pooling 결과를 프로토타입에 추가\n- 평가 포인트: 1-shot에서 차이가 가장 클 것으로 예상 (현재 1-shot은 69.7%)\n\n### 2-2. 클래스별 학습 가능한 scale s\n\n현재 logit은 s * cos(f_q, p_c)이며 s는 10.0으로 시작하는 단일 학습 값입니다. 클래스마다 s_c를 두면 분산이 큰 질병 클래스에서 확신도를 따로 조정할 수 있습니다.\n\n- 주의점: 5-way 에피소드에서 클래스당 support 수가 적으면 s_c가 과적합될 수 있음. 정규화(예: s_c를 s 근처로 묶는 페널티) 필요\n\n## 3. 일관성 손실(consistency loss) 확장\n\n현재 L = L_ce + lambda_cons * L_cons 이며 lambda_cons = 0.5, L_cons는 깨끗한 쿼리 뷰(detach)와 FreqMix 쿼리 뷰 사이의 KL 발산입니다.\n\n### 3-1. temperature를 적용한 KL\n\n두 예측 분포에 temperature T를 적용해 부드럽게 맞추면 혼합 뷰의 노이즈에 덜 민감해질 수 있습니다. T = 2, 4 정도를 먼저 시도하고, 같은 T로 L_cons 크기도 함께 기록합니다.\n\n### 3-2. lambda_cons 스케줄\n\nlambda_cons = 0 일 때 86.3%(-1.1)였으므로 일관성 손실의 기여는 작은 편입니다. 초반에는 0, 후반에 0.5 이상으로 올리는 방식이 효과적인지 확인할 가치가 있습니다.\n\n## 4. 인코더와 배포\n\n### 4-1. ResNet-12 경량화 및 모바일 배포\n\n현재 ResNet-12 인코더(채널 64-160-320-640, 640-d 임베딩)는 현장 촬영 앱에 올리기에는 무겁습니다. 채널 폭을 절반으로 줄이거나 지식 증류(distillation)를 적용해 모바일 추론 속도를 확인하는 작업이 필요합니다.\n\n- 기준점: FastAdapt는 LeafProto보다 에피소드당 약 3.1배 느리므로, 추론 속도 측정은 두 방법을 같은 조건에서 비교해야 합니다.\n- 입력 해상도 84x84 그대로 유지할지도 함께 결정할 것\n\n## 5. 일반화 범위\n\n### 5-1. 종 간 전이(cross-species transfer)\n\n현재 실험은 leafdoc_fs 한 데이터셋에서만 이루어졌고, 종 단위로 나눈 평가는 아직 없습니다. 한 종의 질병으로 학습하고 다른 종의 질병으로 테스트하는 설정을 만들면 한계 항목에 대한 답을 줄 수 있습니다.\n\n- 준비 작업: Kim Seoyeon이 만든 분할 규칙을 종 단위로 확장\n- 예상 난이도: 높음. 1-shot 성능 저하가 클 것으로 보임\n\n### 5-2. 다른 데이터셋 추가\n\n이번 논문의 한계 중 하나는 데이터셋이 하나라는 점입니다. 공개 잎 질병 데이터셋 한두 개를 추가하면 워크숍 제출 전에 보완할 수 있는지 검토가 필요합니다.\n\n## 우선순위 (제안)\n\n| 순서 | 아이디어 | 이유 | 예상 작업량 |\n|---|---|---|---|\n| 1 | 에피소드별 beta 학습 | 고정 beta 한계에 직접 대응 | 중간 |\n| 2 | temperature 일관성 손실 | 코드 변경이 작음 | 낮음 |\n| 3 | 다중 스케일 프로토타입 | 1-shot 개선 기대 | 중간 |\n| 4 | 종 간 전이 설정 | 한계 항목 보완 | 높음 |\n| 5 | 모바일 배포 | 응용 측면 강조 | 높음 |\n\n## 메모\n\n- 2026-12-15 워크숍 제출 전에는 1번과 2번만 시도하고, 나머지는 다음 학기 과제로 넘깁니다.\n- 새 아이디어를 실험할 때는 항상 5-shot 기준 full LeafProto 87.4%와 비교하고, 같은 seed 42를 사용합니다.\n- 실험 결과는 결과 표와 ablation 표에 같은 형식으로 추가합니다.\n"}, {"kind": "text", "ext": "md", "data": "# 랩 미팅 노트 - 2026-03-05\n\n- 일시: 2026-03-05 (목) 14:00\n- 장소: Plant Vision Lab 세미나실\n- 참석: 박현우, 김서연, 이도윤, 최지민, 정민준 교수\n- 주제: LeafProto 초기 설계 방향 및 베이스라인 선정\n\n## 1. 배경 및 목표\n\n- 잎 사진 기반 식물 질병 분류를 1~10 shot 환경에서 수행하는 것이 목표.\n- 데이터는 종(species) x 질병 조합으로 클래스가 나뉘어 있어, 학습에 없던 새 클래스에 대한 일반화가 핵심 과제.\n- 입력 해상도는 84x84, 현장에서 찍은 사진을 그대로 사용.\n\n## 2. 논의 내용\n\n### 2.1 베이스 방법 선정\n\n- ProtoClass를 베이스로 사용하기로 함.\n- 프로토타입을 support 임베딩의 평균으로 만들고 거리로 분류하는 구조가 단순해서 확장하기 좋다는 의견이 많았음.\n- 원 논문은 4-conv 인코더와 유클리드 거리를 사용하므로, 인코더는 ResNet-12 계열로 교체하는 방향으로 검토하기로 함.\n\n### 2.2 주 베이스라인\n\n- FastAdapt를 주 비교 대상(main baseline)으로 정함.\n- 최근 연구이고 같은 에피소드 설정에서 성능이 강해서 비교 기준으로 적절하다고 판단.\n- 단점도 함께 짚음. 에피소드마다 ridge 회귀로 마지막 층을 5 step 적응시키기 때문에 추론이 느림. 논문에서는 이 추론 비용을 함께 보고하자는 의견.\n- 보조 베이스라인으로 Finetune도 유지. 기본 클래스로 사전학습한 뒤 support 세트에서 선형 헤드를 100 step 미세조정하는 방식.\n\n### 2.3 주파수 영역 혼합 모듈 도입\n\n- 정민준 교수님 제안을 받아 주파수 영역 혼합 모듈(FreqMix 아이디어)을 추가하기로 결정.\n- 처리 방식:\n  - 이미지를 2D FFT로 변환한 뒤 진폭(amplitude)과 위상(phase)으로 분리.\n  - 같은 에피소드 안의 두 이미지에서 저주파 진폭 대역만 보간해서 섞음.\n  - 위상은 그대로 두고 역FFT로 복원.\n  - 레이블은 원본 이미지(a)의 것을 그대로 사용.\n- 설계 근거: 저주파 진폭에는 잎의 색과 조명 정보가 주로 담기고, 병반 질감은 고주파 쪽에 남아 있을 것이라는 가설. 따라서 고주파 질감은 건드리지 않고 색과 조명 변화만 흔들어 주면 일반화에 도움이 될 것으로 기대.\n- 위상은 형태 정보를 담고 있어서 유지하기로 함.\n- 초기 설정안:\n  - 중앙 정사각형 마스크의 크기는 짧은 변의 10% (beta = 0.1).\n  - 보간 계수 lam은 0.3~0.7 사이 균등분포.\n  - 이미지별 적용 확률 0.5.\n  - 학습 단계에서만 적용하고 평가 때는 끔.\n- 전체 주파수를 섞는 방식(beta = 1.0)도 나중에 비교 실험 대상으로 남겨 두기로 함.\n\n### 2.4 데이터 분할\n\n- leafdoc_fs 데이터셋은 총 18,420장, 54개 클래스.\n- 분할은 base 30 클래스(학습), 12 클래스(검증), 12 클래스(novel 테스트).\n- 김서연 연구원이 분할을 만들고 클래스별 장수 분포를 확인하기로 함.\n- 종 간 전이(cross-species transfer)는 이번 연구 범위에서 제외.\n\n## 3. 결정 사항\n\n1. 베이스 방법은 ProtoClass로 한다.\n2. 주 베이스라인은 FastAdapt, 보조 베이스라인은 Finetune으로 한다.\n3. 주파수 영역 혼합 모듈(저주파 진폭 교환, 위상 유지)을 추가한다.\n4. 모듈 연결 작업은 src/leafproto_model.py를 수정해서 진행한다.\n5. 데이터 분할은 김서연 연구원이 담당한다.\n\n## 4. 액션 아이템\n\n| 담당 | 내용 | 기한 |\n|------|------|------|\n| 박현우 | src/leafproto_model.py에 주파수 혼합 모듈 연결, 에피소드 학습 루프 점검 | 2026-03-20 |\n| 김서연 | leafdoc_fs 분할 생성, 클래스별 장수 확인 | 2026-03-20 |\n| 이도윤 | FastAdapt 공개 구현 재현 가능 여부 확인 | 2026-03-20 |\n| 최지민 | 관련 연구 정리 초안 작성 (ProtoClass, FastAdapt 중심) | 2026-03-27 |\n\n## 5. 다음 회의 안건\n\n- 주파수 혼합 모듈 적용 후 1-shot, 5-shot 초기 정확도 확인.\n- 거리 함수 변경(유클리드 거리에서 코사인 유사도로) 필요성 검토.\n- 혼합 대역 비율(beta) 설정에 따른 민감도 실험 계획.\n- 다음 회의: 2026-03-19 (목) 14:00\n\n## 6. 기타\n\n- 정민준 교수님: 초기 실험 결과가 나오면 베이스라인과 같은 조건으로 바로 비교할 수 있게 평가 설정(에피소드 수, 시드 42)을 고정해 두라고 당부.\n- 최지민 연구원: 논문 초안 구조를 미리 잡아 두자고 제안. 다음 회의 때 목차 초안 공유.\n"}, {"kind": "text", "ext": "md", "data": "# 랩 미팅 노트 (2026-09-17)\n\n- 일시: 2026-09-17\n- 장소: Plant Vision Lab 세미나실\n- 참석: 박현우, 김서연, 이도윤, 최지민, 정민준 교수님\n- 주제: 메인 결과 리뷰, ablation 계획, 논문 일정 (LeafProto)\n\n## 1. 메인 결과 리뷰\n\nresults/main_results.csv (열: method, shots, accuracy, ci95)를 함께 확인했다. 5-way, 테스트 에피소드 600개, 정확도 %(평균 ± ci95) 기준이다.\n\n| 방법 | 1-shot | 2-shot | 5-shot | 10-shot |\n|---|---|---|---|---|\n| Finetune | 52.3 ± 0.9 | 61.8 ± 0.8 | 72.5 ± 0.7 | 79.1 ± 0.6 |\n| ProtoClass | 60.4 ± 0.9 | 70.2 ± 0.8 | 80.9 ± 0.6 | 85.0 ± 0.5 |\n| FastAdapt | 64.8 ± 0.9 | 73.5 ± 0.8 | 83.6 ± 0.6 | 87.2 ± 0.5 |\n| LeafProto (ours) | 69.7 ± 0.9 | 78.3 ± 0.7 | 87.4 ± 0.5 | 90.6 ± 0.4 |\n\n- 핵심 수치: LeafProto 5-shot 87.4%. FastAdapt(83.6) 대비 +3.8p, ProtoClass(80.9) 대비 +6.5p.\n- 모든 shot 수에서 LeafProto가 1위. 10-shot에서는 FastAdapt와의 격차가 +3.4p로 줄어든다.\n- 곡선은 모두 shot이 늘수록 올라가고 뒤로 갈수록 완만해진다.\n- FastAdapt는 에피소드당 추론이 LeafProto보다 약 3.1배 느리다. 정확도 차이와 함께 속도 비교도 본문에 넣기로 했다.\n- v1 초안(2026-06-20)의 수치(LeafProto 5-shot 86.1)는 더 이상 쓰지 않는다. v2 수치로 통일한다.\n\n**확인 필요 (박현우)**: 논문 Figure 2 캡션에 \"largest gain at 5 shots over baselines\"라고 되어 있는데, 표를 보면 1-shot의 FastAdapt 대비 격차(+4.9p)가 5-shot(+3.8p)보다 크다. 캡션 문구를 데이터에 맞게 수정하기로 했다.\n\n## 2. Ablation 계획\n\n모든 ablation은 5-way 5-shot 설정, seed 42, 동일한 테스트 에피소드 600개로 돌린다. 담당은 이도윤.\n\n| 실험 | 변경 내용 | 확인하려는 것 |\n|---|---|---|\n| w/o FreqMix | FreqMix 제거 | 주요 기여(FreqMix)의 효과 |\n| Euclidean head | cosine head 대신 squared Euclidean 거리 사용 | cosine + 학습 가능한 scale의 효과 |\n| w/o consistency loss | lambda_cons = 0 | KL 일관성 손실의 효과 |\n| FreqMix full-spectrum | beta = 1.0 (전체 주파수 혼합) | 저주파 대역만 섞는 설계의 필요성 |\n\n## 3. Ablation 결과 (이도윤 실행 후 공유)\n\n5-shot 정확도 기준이다.\n\n| 구성 | 5-shot 정확도 (%) | 차이 |\n|---|---|---|\n| Full LeafProto | 87.4 | - |\n| w/o FreqMix | 84.0 | -3.4 |\n| Euclidean head | 85.2 | -2.2 |\n| w/o consistency loss (lambda_cons = 0) | 86.3 | -1.1 |\n| FreqMix full-spectrum (beta = 1.0) | 85.6 | -1.8 |\n\n**분석**\n- FreqMix가 가장 큰 기여 요소다. 제거하면 -3.4p로 떨어진다.\n- 저주파 대역만 섞는 것이 중요하다. 저주파 amplitude에는 잎의 색과 조명 정보가 들어 있고, 병 질감은 고주파에 있어서 phase와 함께 그대로 남는다. 전체 주파수를 섞으면(beta = 1.0) 질감까지 흐려져 -1.8p가 된다.\n- cosine head는 -2.2p로 두 번째로 큰 기여다. 거리 함수와 학습 가능한 scale을 같이 쓰는 설계를 유지한다.\n- consistency loss는 -1.1p로 작지만 일관되게 도움이 된다. 논문에서는 이 차이를 과장하지 않는다.\n\n## 4. 논문 일정\n\n- 원고: paper/leafproto_draft_v2.pdf (2026-11-10 기준)\n- 내부 리뷰 마감: 2026-11-30\n- 투고 대상: AgriVision Workshop 2027, 제출 마감 2026-12-15\n- 구성: abstract, introduction, method, experiments (Table 1 메인 결과, Table 2 ablation), Figure 1-2, related work, limitations\n- limitations 항목: 데이터셋 1개뿐임, 84x84 해상도, 종 간 전이(cross-species transfer) 실험 없음, beta 고정\n\n## 5. 액션 아이템\n\n- 이도윤: ablation 4개 결과를 표로 정리해 공유 (완료)\n- 박현우: Figure 2 캡션 수정, ablation 결과를 method와 experiments 섹션에 반영\n- 김서연: leafdoc_fs split 통계(클래스별 장수, 종별 분포) 정리해서 experiments 섹션용 표 준비\n- 최지민: related work 문단에 ProtoClass, FastAdapt 비교와 augmentation 관련 연구(SpecShift 2021, LeafAug 2020) 정리\n- 정민준 교수님: 2026-11-30 내부 리뷰 전에 전체 원고 검토\n\n## 6. 다음 단계 아이디어 (이번 논문 범위 밖)\n\n- beta를 에피소드마다 학습하는 adaptive FreqMix\n- phase도 함께 섞는 방식\n- CosineProtoHead에 multi-scale prototype 도입\n- 클래스별로 학습하는 scale s\n- 종 간 전이(cross-species transfer) 실험\n- ResNet-12 인코더의 모바일 배포\n- temperature를 적용한 consistency loss\n\n이번 미팅에서는 논문 범위를 4개 ablation과 현재 limitations까지로 정하고, 위 아이디어는 후속 연구로 남기기로 했다.\n"}, {"kind": "text", "ext": "md", "data": "# 국외 출장 경비 정산 신청서\n\n## 1. 기본 정보\n\n| 항목 | 내용 |\n|---|---|\n| 신청자 성명 | |\n| 소속 | 대학원 연구실 |\n| 연락처 | |\n| 신청일 | 2026-11-21 |\n| 제출 기한 | 2026-12-05 (학과 행정실) |\n\n## 2. 출장 개요\n\n- 출장 목적: 국제 학술대회 참석 및 세션 청강\n- 출장지: 일본 오사카\n- 출장 기간: 2026-10-28 ~ 2026-10-31 (3박 4일)\n- 출장비 지원 근거: 학과 연구비 중 출장 경비 항목\n- 학회 등록비: 본 신청에 포함하지 않음 (법인카드로 별도 처리)\n\n## 3. 지출 내역\n\n| 구분 | 증빙 | 금액 (KRW) | 비고 |\n|---|---|---:|---|\n| 항공료 (왕복) | 전자항공권 영수증 | 580,000 | 이코노미 클래스 |\n| 숙박비 | 호텔 영수증 | 460,000 | 3박 합계 |\n| 일비 | 해당 없음 | 120,000 | 출장 규정 기준 1일 30,000 x 4일 |\n| 교통비 | 공항 철도, 택시 영수증 | 80,000 | 출국 및 귀국 구간 |\n| **합계** | | **1,240,000** | |\n\n## 4. 증빙 서류 체크리스트\n\n- [ ] 전자항공권 영수증 및 탑승 확인서\n- [ ] 호텔 숙박 영수증 (투숙자 성명 확인 가능해야 함)\n- [ ] 교통비 영수증 또는 카드 사용 명세\n- [ ] 학회 참가 확인서 (등록 완료 페이지 캡처 가능)\n- [ ] 출장 복명서 1부 (양식은 행정실 게시판 참고)\n\n## 5. 처리 절차\n\n1. 신청서와 증빙 서류 원본 또는 스캔본을 행정실에 제출\n2. 행정실 증빙 검토 (영업일 기준 3일 이내)\n3. 지도교수 확인 후 학과장 결재\n4. 결재 완료 후 신청자 계좌로 입금 (영업일 기준 5일 이내)\n\n## 6. 유의 사항\n\n- 2026-12-05 이후에 접수된 신청은 해당 회계연도 처리 대상에서 제외될 수 있음\n- 항공권 변경 또는 취소가 발생하면 즉시 행정실에 알릴 것\n- 개인 카드로 결제한 경우 카드사 승인 내역서 원본을 함께 첨부할 것\n- 외화 지출은 카드사 승인일 기준 환율을 적용하여 원화로 기재할 것\n- 식비는 출장 규정상 일비에 포함되므로 별도 청구하지 않음\n- 증빙이 부족한 항목은 집행이 보류될 수 있으므로 제출 전 다시 확인할 것\n\n## 7. 확인\n\n| 구분 | 성명 | 서명 | 날짜 |\n|---|---|---|---|\n| 신청인 | | | |\n| 지도교수 확인 | | | |\n| 행정실 접수 | | | |\n\n※ 본 양식은 학과 행정실 내부 처리용이며, 작성 후 원본을 행정실에 직접 제출하거나 스캔본을 이메일로 보내 주시기 바랍니다.\n"}, {"kind": "text", "ext": "md", "data": "# Protein Structure Prediction: Reading Group List\n\nReading group, autumn term. We meet every other Thursday at 16:00 in Seminar Room 3. Each session has one presenter who gives a 15-minute summary, followed by open discussion. Please read the assigned paper before the session and bring at least one question.\n\n## Schedule\n\n| Session | Date | Presenter | Paper |\n|---|---|---|---|\n| 1 | 2026-09-03 | Yoon Taeho | FoldNet-lite 2023 |\n| 2 | 2026-09-17 | Han Ara | Residue Graph Refinement 2021 |\n| 3 | 2026-10-01 | Moon Sujin | DistoGram 2022 |\n| 4 | 2026-10-15 | Oh Jinwoo | Torsion-Aware Attention 2024 |\n| 5 | 2026-10-29 | Seo Hyejin | MSA Sparsify 2020 |\n| 6 | 2026-11-12 | Bae Kyungmin | Recycling for Long Chains 2025 |\n\n## Papers\n\n### 1. FoldNet-lite 2023\nA lightweight structure predictor that replaces the full evoformer-style trunk with a stack of pairwise convolution blocks. The authors argue that most of the accuracy comes from the distance-map head, so the trunk can be shrunk by a factor of four. Useful as a starting point for discussing what the trunk actually contributes.\n\n### 2. Residue Graph Refinement 2021\nTreats the predicted contact map as a graph and runs message passing over residues to clean up inconsistent contacts. The refinement step improves long-range contact precision but adds noticeable cost for chains above 500 residues. Worth reading for the error analysis in the appendix.\n\n### 3. DistoGram 2022\nPredicts a histogram of inter-residue distances per pair instead of a single distance value. The loss is a cross-entropy over bins, and the authors show that the spread of the histogram correlates with local uncertainty. We will compare this with the confidence heads in more recent work.\n\n### 4. Torsion-Aware Attention 2024\nInjects backbone torsion angles into the attention bias so that attention heads can respect local geometry. The gain is clearest on loops and disordered regions, where sequence-only models tend to smear their predictions. Discussion point: is the gain from better geometry or from a different inductive bias?\n\n### 5. MSA Sparsify 2020\nStudies how many aligned sequences a model really needs. The paper shows that subsampling the multiple sequence alignment to a few hundred rows loses little accuracy on well-conserved families but hurts orphan proteins badly. Good background for any discussion of low-data settings.\n\n### 6. Recycling for Long Chains 2025\nAnalyses iterative recycling of the structure module for chains longer than 1,000 residues. The authors report that the number of recycling steps has diminishing returns after three cycles and that memory use, not accuracy, sets the practical limit. We will close the term by comparing this with the earlier papers on cost.\n\n## Discussion Questions\n\n1. Which of these papers changes the input representation, and which changes only the output head?\n2. How should we judge a predicted structure for a protein with no close homologs in the training set?\n3. Do the reported gains survive when the evaluation split is changed to a stricter time cutoff?\n4. Which of the cost-saving ideas could be used in a lab with a single consumer GPU?\n\n## Logistics\n\n- Papers are available through the group drive folder. Please do not share the PDFs outside the group.\n- If you cannot attend a session, send your questions to the presenter by the Wednesday before.\n- The list may change if a new paper appears that fits the autumn theme. Any change will be announced in the group chat.\n"}], "edges": [{"a": 5, "b": 3, "s": "train.py → leafproto_model.py: 사용함", "rel": "사용함", "direct": true, "d": 1, "ev": "on src/train.py --config configs/base.yaml \"\"\" import argparse import time from pathlib import Path import torch import torch.nn.functional as F from leafproto_model import LeafProtoNet from data import get_split, EpisodeSampler from utils import set_seed, get_logger, save_checkpoint, load_config VA", "evf": "src/train.py", "x": "train.py가 모델 코드(leafproto_model.py)를 import해서 사용합니다."}, {"a": 5, "b": 0, "s": "train.py → data.py: 사용함", "rel": "사용함", "direct": true, "d": 1, "ev": "l \"\"\" import argparse import time from pathlib import Path import torch import torch.nn.functional as F from leafproto_model import LeafProtoNet from data import get_split, EpisodeSampler from utils import set_seed, get_logger, save_checkpoint, load_config VAL_EPISODES = 200 LOG_EVERY = 100 if __nam", "evf": "src/train.py", "x": "train.py가 데이터 로딩 코드(data.py)를 import해서 사용합니다."}, {"a": 5, "b": 6, "s": "train.py → utils.py: 사용함", "rel": "사용함", "direct": true, "d": 1, "ev": "lib import Path import torch import torch.nn.functional as F from leafproto_model import LeafProtoNet from data import get_split, EpisodeSampler from utils import set_seed, get_logger, save_checkpoint, load_config VAL_EPISODES = 200 LOG_EVERY = 100 if __name__ == \"__main__\": main()", "evf": "src/train.py", "x": "train.py가 공용 함수(utils.py)를 import해서 사용합니다."}, {"a": 3, "b": 2, "s": "leafproto_model.py → freq_mix.py: 사용함", "rel": "사용함", "direct": true, "d": 1, "ev": "in docs/method.md. Episodes arrive already sampled and resized to 84x84. \"\"\" import torch import torch.nn as nn import torch.nn.functional as F from freq_mix import FreqMix", "evf": "src/leafproto_model.py", "x": "모델 코드가 Fr function qHtml(x,n){
 const body=x.t=="scale"?`<div class="scale">${[1,2,3,4,5,6,7].map(i=>`<label><input type="radio" name="${x.k}" value="${i}">${i}</label>`).join("")}</div>
   <div class="scale-ends"><span>전혀 그렇지 않다</span><span>매우 그렇다</span></div>`
  :x.t=="text"?`<textarea id="s_${x.k}" placeholder="${x.ph}"></textarea>`
  :`<div class="opts">${x.o.map(o=>`<label><input type="${x.t=="check"?"checkbox":"radio"}" name="${x.k}" value="${o}">${o}</label>`).join("")}</div>`;
 return `<div class="q"><b>${n}. ${x.q}</b>${body}</div>`;
}
function qRead(list,start){const A={};
 for(const [i,x] of list.entries()){
  if(x.t=="text"){A[x.k]=$("s_"+x.k).value.trim();continue}
  const v=[...document.querySelectorAll(`input[name=${x.k}]:checked`)].map(e=>e.value);
  if(!v.length)return {err:`${start+i}번 문항에 답해 주세요.`};
  A[x.k]=x.t=="check"?v:x.t=="scale"?+v[0]:v[0]}
 return {A};
}

 Object.keys(links).forEach(k=>{const [a,b]=k.split("-").map(Number);if(W.ghide.has(a)||W.ghide.has(b))delete links[k]});

  <div class="group-card-items">${c.m.slice().sort((x,y)=>base(d.files[x]).localeCompare(base(d.files[y]))).map(i=>`<button class="card-file ${(W.sel&&W.sel.k=="f"&&W.sel.i==i)||(W.q&&want&&want.has(i))?"selected":""}" data-i="${i}" title="${esc(d.files[i])}"><span class="badge-ext">${esc((ext(d.files[i])||"file").toUpperCase().slice(0,5))}</span><span>${esc(base(d.files[i]))}</span></button>`).join("")}</div></section>`).join("");
 const box={},bottoms=[0,0];
 $("groupCards").querySelectorAll(".group-card").forEach(el=>{const g=+el.dataset.g,col=bottoms.indexOf(Math.min(...bottoms));
  const b={x:col*380,y:bottoms[col],w:270,h:el.offsetHeight};box[g]=b;el.style.left=b.x+"px";el.style.top=b.y+"px";bottoms[col]+=b.h+40});
 W.cardBox={w:650,h:Math.max(1,...bottoms)};
 const mx=Math.max(1,...Object.values(links));
 $("groupLinks").setAttribute("width",W.cardBox.w);$("groupLinks").setAttribute("height",W.cardBox.h);
 $("groupLinks").innerHTML=Object.entries(links).map(([k,cnt],i)=>{const [ga,gb]=k.split("-").map(Number),a=box[ga],b=box[gb],same=a.x===b.x;
  const L=a.x<=b.x?a:b,R=L===a?b:a,sx=L.x+L.w,sy=L.y+L.h/2,tx=same?R.x+R.w:R.x,ty=R.y+R.h/2,bend=same?45+(i%4)*16:50,c1=sx+bend,c2=same?tx+bend:tx-bend;
  const lx=(sx+3*c1+3*c2+tx)/8,ly=(sy+ty)/2,lw=Math.max(26,String(cnt).length*9+16),path=`M${sx},${sy} C${c1},${sy} ${c2},${ty} ${tx},${ty}`;
  return `<g class="group-connection ${W.link==k?"on":""}" data-k="${k}"><path class="cl" stroke-width="${1.5+4*Math.sqrt(cnt/mx)}" d="${path}"/><path class="ch" d="${path}"/>
   <rect x="${lx-lw/2}" y="${ly-11}" width="${lw}" height="22" rx="9"/><text x="${lx}" y="${ly}">${cnt}</text></g>`}).join("");
 $("groupCards").querySelectorAll(".group-card-header").forEach(h=>{const g=+h.parentNode.dataset.g;h.onclick=()=>openGroup(g)});

/* task 2: after the seed hides, 3 suggestions from drift (similar to what was hidden) + 3 random visible links, shuffled, source not shown */
function buildProps(){
 const d=W.d,n=W.s.review/2,used=new Set(W.seed),best={};
 W.seed.forEach(j=>(d.drift[j]||[]).forEach(([k,sc])=>{if(!used.has(k)&&!W.hidden.has(k))best[k]=Math.max(best[k]||0,sc)}));
 const drift=Object.keys(best).map(Number).sort((a,b)=>best[b]-best[a]||a-b).slice(0,n);drift.forEach(k=>used.add(k));
 const rnd=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
 const base_=rnd(d.edges.map((e,j)=>j).filter(j=>!used.has(j)&&!W.hidden.has(j))).slice(0,n);
 W.props=rnd([...drift.map(e=>({e,src:"drift"})),...base_.map(e=>({e,src:"base"}))]).map(p=>Object.assign(p,{accept:null}));
 W.pi=0;log("proposals",W.props.map(p=>[p.e,p.src]));
}
function markProp(){const p=W.props[W.pi];if(p)edges.update([{id:p.e,hidden:false,color:{color:C.prop,highlight:C.prop,hover:C.prop},width:3.5,dashes:[8,5]}])}
function showReview(){
 const p=W.props[W.pi],e=W.d.edges[p.e];renderFb();if(W.mode=="cards")setMode("2d");stick({hn:new Set([e.a,e.b]),he:new Set()});
 $("detail").innerHTML=`<div class="propbar">지금 판단 중인 시스템 제안</div>`+edgeHtml(p.e);bind();
 $("iscroll").scrollTop=0;net.selectEdges([p.e]);side2();setTimeout(()=>{const A=net.getPosition(e.a),B=net.getPosition(e.b);revealPt({x:(A.x+B.x)/2,y:(A.y+B.y)/2})},30);
}
function reviewDone(){
 const acc=W.props.filter(p=>p.accept).length;stick(null);if($("detail")&&$("detail").querySelector(".propbar"))overview();
 $("sidebody").innerHTML=`<div class="sidebox"><h3>제안을 모두 판단했습니다</h3><p>제안 ${W.props.length}개 중 ${acc}개를 숨겼습니다. 정리된 그래프를 한번 둘러본 뒤 [다음]을 눌러 주세요. 판단을 바꾸려면 아래 항목을 누르면 됩니다.</p>
  <div class="list" style="margin-top:8px">${W.props.map((p,k)=>`<div class="row2" data-k="${k}"><span style="color:${p.accept?"var(--bad)":"var(--ok)"};width:32px">${p.accept?"숨김":"남김"}</span><span>${esc(W.d.edges[p.e].s.split(":")[0])}</span></div>`).join("")}</div></div>
  <div class="sidefoot"><button class="primary" id="done">다음</button></div>`;
 $("sidebody").querySelectorAll("[data-k]").forEach(x=>x.onclick=()=>{W.pi=+x.dataset.k;const p=W.props[W.pi];p.accept=null;W.hidden.delete(p.e);W.fb=W.fb.filter(f=>!(f.t=="prop_accept"&&f.j==p.e));renderFb();applyHidden();showReview()});
 $("done").onclick=finish2;
}
function mini(el,hidden,mark){
 const d=W.d,dg={},pos=POS||{};d.edges.forEach((e,j)=>{if(hidden.has(j))return;dg[e.a]=(dg[e.a]||0)+1;dg[e.b]=(dg[e.b]||0)+1});
 const lone=i=>hidden.size&&!dg[i]&&d.edges.some(e=>e.a==i||e.b==i),dg0={},touch=new Set();
 d.edges.forEach((e,j)=>{dg0[e.a]=(dg0[e.a]||0)+1;dg0[e.b]=(dg0[e.b]||0)+1;if(hidden.has(j)||mark&&mark.has(j)){touch.add(e.a);touch.add(e.b)}});
 const n=new vis.DataSet(d.files.map((f,i)=>Object.assign({id:i,label:dg0[i]>=4||touch.has(i)?base(f):""},nodeView(i,lone(i)?false:undefined,dg),{font:{size:15,color:lone(i)?"#5c5c5c":C.text,strokeWidth:4,strokeColor:C.bg}},pos[i]?{x:pos[i].x,y:pos[i].y}:{})));
 const e=new vis.DataSet(d.edges.map((x,j)=>Object.assign({id:j,from:x.a,to:x.b},hidden.has(j)?{hidden:true}:mark&&mark.has(j)?{color:{color:"#ff5c6c"},width:4.5,dashes:[8,5],arrows:{to:{enabled:false},from:{enabled:false}}}:Object.assign(edgeView(j),{color:{color:"#57525e"}}))));
 const nw=new vis.Network(el,{nodes:n,edges:e},{physics:false,interaction:{dragNodes:false,zoomView:true,hover:false},edges:{smooth:{type:"continuous"}}});
 nw.once("afterDrawing",()=>nw.fit({animation:false}));
}
function finish2(){
 const st=W.d.st[W.s.pid];POS=W.pos;
 LOG.steps.t2.review={seed:W.seed.slice(),items:W.props.map(p=>({e:p.e,src:p.src,accept:p.accept,gtOk:st[p.e]==0}))};
 go(step+1);
}
LOG.steps.intro={t0:Date.now(),events:[]};render();
</script>
