ne split, read from the metadata CSV.\n\n    Columns used: image_path, label, species, disease, split.\n    \"\"\"\n\n    def __init__(self, split, root=DATA_ROOT, meta_csv=META_CSV):\n        if split not in VALID_SPLITS:\n            raise ValueError(f\"split must be one of {VALID_SPLITS}, got {split!r}\")\n        meta = pd.read_csv(meta_csv)\n        meta = meta[meta[\"split\"] == split].reset_index(drop=True)\n        self.split = split\n        self.root = root\n        self.paths = meta[\"image_path\"].tolist()\n        self.labels = meta[\"label\"].astype(int).tolist()\n        self.species = meta[\"species\"].tolist()\n        self.disease = meta[\"disease\"].tolist()\n        self.index_by_class = defaultdict(list)\n        for i, y in enumerate(self.labels):\n            self.index_by_class[y].append(i)\n        self.class_ids = sorted(self.index_by_class)\n\n    def __len__(self):\n        return len(self.paths)\n\n    def __getitem__(self, idx):\n        image = load_image(os.path.join(self.root, self.paths[idx]))\n        return image, self.labels[idx]\n\n    def num_classes(self):\n        return len(self.class_ids)\n\n\nclass EpisodeSampler:\n    \"\"\"Draws N-way K-shot episodes with n_query queries per class.\n\n    Support and query labels are remapped to 0..n_way-1 so that the\n    prototype head always sees a consistent label space.\n    \"\"\"\n\n    def __init__(self, n_way=5, k_shot=1, n_query=15, seed=42):\n        self.n_way = n_way\n        self.k_shot = k_shot\n        self.n_query = n_query\n        self.rng = random.Random(seed)\n\n    def sample(self, dataset):\n        need = self.k_shot + self.n_query\n        eligible = [c for c in dataset.class_ids if len(dataset.index_by_class[c]) >= need]\n        if len(eligible) < self.n_way:\n            raise RuntimeError(f\"only {len(eligible)} classes have {need} images\")\n        chosen = self.rng.sample(eligible, self.n_way)\n        ep = {\"support_idx\": [], \"support_y\": [], \"query_idx\": [], \"query_y\": []}\n        for new_label, c in enumerate(chosen):\n            idx = self.rng.sample(dataset.index_by_class[c], need)\n            ep[\"support_idx\"] += idx[: self.k_shot]\n            ep[\"support_y\"] += [new_label] * self.k_shot\n            ep[\"query_idx\"] += idx[self.k_shot:]\n            ep[\"query_y\"] += [new_label] * self.n_query\n        return ep\n\n    def episodes(self, dataset, n_episodes):\n        for _ in range(n_episodes):\n            yield self.sample(dataset)\n\n\ndef load_episode(dataset, episode):\n    \"\"\"Turn episode indices into tensors (support_x, support_y, query_x, query_y).\"\"\"\n    s_x = torch.stack([dataset[i][0] for i in episode[\"support_idx\"]])\n    q_x = torch.stack([dataset[i][0] for i in episode[\"query_idx\"]])\n    s_y = torch.tensor(episode[\"support_y\"], dtype=torch.long)\n    q_y = torch.tensor(episode[\"query_y\"], dtype=torch.long)\n    return s_x, s_y, q_x, q_y\n\n\ndef get_split(split, root=DATA_ROOT, meta_csv=META_CSV):\n    return LeafDocDataset(split, root=root, meta_csv=meta_csv)\n\n\nif __name__ == \"__main__\":\n    for name in VALID_SPLITS:\n        ds = get_split(name)\n        print(f\"{name}: {len(ds)} images, {ds.num_classes()} classes\")\n"}, {"kind": "text", "ext": "py", "data": "\"\"\"Evaluate a trained LeafProto checkpoint on the novel test split.\n\nRuns 600 fixed-seed 5-way test episodes, reports mean accuracy and the\n95% confidence interval over episodes, and records the row in the\nmain results table.\n\"\"\"\nimport argparse\nimport math\nimport os\n\nimport numpy as np\nimport pandas as pd\nimport torch\nimport yaml\n\nfrom leafproto_model import LeafProtoNet\nfrom data import get_split, EpisodeSampler\n\nRESULTS_CSV = \"results/main_results.csv\"\nN_TEST_EPISODES = 600\nRESULT_COLS = [\"method\", \"shots\", \"accuracy\", \"ci95\"]\n\n\ndef load_config(path):\n    with open(path, \"r\") as f:\n        cfg = yaml.safe_load(f)\n    parent = cfg.pop(\"inherits\", None)\n    if parent:\n        base = load_config(os.path.join(os.path.dirname(path), parent))\n        base.update(cfg)\n        cfg = base\n    return cfg\n\n\ndef set_seed(seed):\n    np.random.seed(seed)\n    torch.manual_seed(seed)\n    torch.cuda.manual_seed_all(seed)\n\n\n@torch.no_grad()\ndef run_episodes(model, dataset, sampler, device, n_episodes):\n    model.eval()\n    accs = []\n    for _ in range(n_episodes):\n        xs, ys, xq, yq = sampler.sample(dataset)\n        logits = model(xs.to(device), ys.to(device), xq.to(device))\n        pred = logits.argmax(dim=1).cpu()\n        accs.append((pred == yq).float().mean().item() * 100.0)\n    return np.array(accs)\n\n\ndef upsert_result(path, row):\n    if os.path.exists(path):\n        df = pd.read_csv(path)\n    else:\n        df = pd.DataFrame(columns=RESULT_COLS)\n    mask = (df[\"method\"] == row[\"method\"]) & (df[\"shots\"] == row[\"shots\"])\n    df = pd.concat([df[~mask], pd.DataFrame([row])], ignore_index=True)\n    os.makedirs(os.path.dirname(path), exist_ok=True)\n    df.to_csv(path, index=False)\n\n\ndef main():\n    parser = argparse.ArgumentParser(description=\"Evaluate LeafProto on test episodes\")\n    parser.add_argument(\"--config\", required=True)\n    parser.add_argument(\"--ckpt\", required=True)\n    parser.add_argument(\"--method\", default=\"LeafProto\")\n    args = parser.parse_args()\n\n    cfg = load_config(args.config)\n    set_seed(cfg[\"seed\"])\n    device = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n\n    model = LeafProtoNet(scale_init=cfg[\"scale_init\"]).to(device)\n    ckpt = torch.load(args.ckpt, map_location=device)\n    model.load_state_dict(ckpt.get(\"model\", ckpt))\n    print(f\"loaded {args.ckpt} (step {ckpt.get('step', 'unknown')})\")\n\n    dataset = get_split(\"test\")\n    sampler = EpisodeSampler(cfg[\"n_way\"], cfg[\"k_shot\"], cfg[\"n_query\"])\n    accs = run_episodes(model, dataset, sampler, device, N_TEST_EPISODES)\n\n    mean = accs.mean()\n    ci95 = 1.96 * accs.std(ddof=1) / math.sqrt(len(accs))\n    print(f\"{args.method} {cfg['k_shot']}-shot: {mean:.1f} +- {ci95:.1f} \"\n          f\"(ci95 over {len(accs)} episodes)\")\n\n    row = {\n        \"method\": args.method,\n        \"shots\": cfg[\"k_shot\"],\n        \"accuracy\": round(mean, 1),\n        \"ci95\": round(ci95, 1),\n    }\n    upsert_result(RESULTS_CSV, row)\n    print(f\"wrote {RESULTS_CSV}\")\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"kind": "text", "ext": "py", "data": "\"\"\"FreqMix: low-frequency amplitude mixing for leaf photos.\n\nEach image is transformed with a 2D FFT per channel and split into amplitude A\nand phase P. Inside a centered low-frequency band M, the amplitude of image a is\ninterpolated with the amplitude of a partner image b from the same episode.\nOutside the band the amplitude stays A_a, and the phase P_a is kept unchanged.\nThe inverse FFT gives the augmented image, which keeps the label of image a.\n\"\"\"\n\nimport torch\nimport torch.nn as nn\n\n\nclass FreqMix(nn.Module):\n    def __init__(self, beta: float = 0.1, lam_low: float = 0.3,\n                 lam_high: float = 0.7, p: float = 0.5):\n        super().__init__()\n        self.beta = beta          # band ratio, share of the shorter side\n        self.lam_low = lam_low    # lam ~ Uniform(lam_low, lam_high)\n        self.lam_high = lam_high\n        self.p = p                # apply probability per image\n\n    def band_mask(self, height: int, width: int, device) -> torch.Tensor:\n        # Centered square covering beta * min(H, W) of the shifted spectrum.\n        side = max(1, int(round(self.beta * min(height, width))))\n        mask = torch.zeros(height, width, device=device)\n        top = height // 2 - side // 2\n        left = width // 2 - side // 2\n        mask[top:top + side, left:left + side] = 1.0\n        return mask\n\n    def forward(self, x: torch.Tensor) -> torch.Tensor:\n        \"\"\"x: (B, C, H, W) images of one episode (support or query set).\n\n        Returns augmented images with the same shape. Labels are unchanged,\n        because every output keeps the identity of its own input image a.\n        Identity is returned in eval mode.\n        \"\"\"\n        if not self.training or x.size(0) < 2:\n            return x\n\n        B, C, H, W = x.shape\n        device = x.device\n        x_f = x.float()\n\n        # Partner b for every image a, drawn from the same episode.\n        perm = torch.randperm(B, device=device)\n        x_b = x_f[perm]\n\n        # Per-channel 2D FFT with the zero frequency moved to the center.\n        F_a = torch.fft.fftshift(torch.fft.fft2(x_f, dim=(-2, -1)), dim=(-2, -1))\n        F_b = torch.fft.fftshift(torch.fft.fft2(x_b, dim=(-2, -1)), dim=(-2, -1))\n        A_a, P_a = F_a.abs(), F_a.angle()\n        A_b = F_b.abs()\n\n        # A_mix = (1 - M) * A_a + M * (lam * A_a + (1 - lam) * A_b)\n        lam = torch.empty(B, 1, 1, 1, device=device).uniform_(self.lam_low, self.lam_high)\n        M = self.band_mask(H, W, device).view(1, 1, H, W)\n        A_mix = (1 - M) * A_a + M * (lam * A_a + (1 - lam) * A_b)\n\n        # Only a random subset of images (probability p) is mixed.\n        apply = (torch.rand(B, device=device) < self.p).view(B, 1, 1, 1)\n        A_out = torch.where(apply, A_mix, A_a)\n\n        # Keep phase P_a, then inverse FFT back to image space.\n        F_out = torch.polar(A_out, P_a)\n        F_out = torch.fft.ifftshift(F_out, dim=(-2, -1))\n        x_out = torch.fft.ifft2(F_out, dim=(-2, -1)).real\n\n        return x_out.clamp_(0.0, 1.0).to(x.dtype)\n"}, {"kind": "text", "ext": "py", "data": "\"\"\"LeafProto network: ResNet-12 encoder, cosine prototype head and the\nepisodic training loss with the FreqMix consistency term.\n\nThe method is described in docs/method.md. Episodes arrive already sampled\nand resized to 84x84.\n\"\"\"\nimport torch\nimport torch.nn as nn\nimport torch.nn.functional as F\n\nfrom freq_mix import FreqMix\n\n\nclass ResBlock(nn.Module):\n    \"\"\"Three 3x3 conv-BN-LeakyReLU layers, 1x1 shortcut, 2x2 max-pool.\"\"\"\n\n    def __init__(self, in_ch, out_ch):\n        super().__init__()\n        self.body = nn.Sequential(\n            nn.Conv2d(in_ch, out_ch, 3, padding=1, bias=False),\n            nn.BatchNorm2d(out_ch),\n            nn.LeakyReLU(0.1),\n            nn.Conv2d(out_ch, out_ch, 3, padding=1, bias=False),\n            nn.BatchNorm2d(out_ch),\n            nn.LeakyReLU(0.1),\n            nn.Conv2d(out_ch, out_ch, 3, padding=1, bias=False),\n            nn.BatchNorm2d(out_ch),\n        )\n        self.shortcut = nn.Sequential(\n            nn.Conv2d(in_ch, out_ch, 1, bias=False),\n            nn.BatchNorm2d(out_ch),\n        )\n        self.act = nn.LeakyReLU(0.1)\n        self.pool = nn.MaxPool2d(2)\n\n    def forward(self, x):\n        return self.pool(self.act(self.body(x) + self.shortcut(x)))\n\n\nclass ResNet12(nn.Module):\n    \"\"\"ResNet-12 with channels 64-160-320-640, returns a 640-d embedding.\"\"\"\n\n    def __init__(self, channels=(64, 160, 320, 640)):\n        super().__init__()\n        dims = [3, *channels]\n        self.blocks = nn.Sequential(\n            *[ResBlock(dims[i], dims[i + 1]) for i in range(len(channels))]\n        )\n        self.out_dim = channels[-1]\n\n    def forward(self, x):\n        x = self.blocks(x)\n        return F.adaptive_avg_pool2d(x, 1).flatten(1)\n\n\nclass CosineProtoHead(nn.Module):\n    \"\"\"Cosine logits between query embeddings and class prototypes.\"\"\"\n\n    def __init__(self, scale_init=10.0):\n        super().__init__()\n        self.scale = nn.Parameter(torch.tensor(float(scale_init)))\n\n    @staticmethod\n    def prototypes(support_emb, support_labels, n_way):\n        # p_c = mean of the L2-normalised support embeddings of class c\n        emb = F.normalize(support_emb, dim=-1)\n        return torch.stack(\n            [emb[support_labels == c].mean(dim=0) for c in range(n_way)]\n        )\n\n    def forward(self, query_emb, protos):\n        q = F.normalize(query_emb, dim=-1)\n        p = F.normalize(protos, dim=-1)\n        return self.scale.clamp(min=1e-2) * q @ p.t()\n\n\nclass LeafProtoNet(nn.Module):\n    def __init__(self, n_way=5, scale_init=10.0, freqmix_beta=0.1, freqmix_p=0.5):\n        super().__init__()\n        self.n_way = n_way\n        self.encoder = ResNet12()\n        self.head = CosineProtoHead(scale_init)\n        self.freqmix = FreqMix(beta=freqmix_beta, p=freqmix_p)\n\n    def episode_logits(self, support_x, support_y, query_x):\n        s_emb = self.encoder(support_x)\n        q_emb = self.encoder(query_x)\n        protos = self.head.prototypes(s_emb, support_y, self.n_way)\n        return self.head(q_emb, protos)\n\n    def forward(self, support_x, support_y, query_x):\n        return self.episode_logits(support_x, support_y, query_x)\n\n    def training_loss(self, support_x, support_y, query_x, query_y, lambda_cons=0.5):\n        clean_logits = self.episode_logits(support_x, support_y, query_x)\n        loss_ce = F.cross_entropy(clean_logits, query_y)\n\n        # FreqMix view: each image is paired with a random partner from the same episode.\n        s_perm = torch.randperm(support_x.size(0), device=support_x.device)\n        q_perm = torch.randperm(query_x.size(0), device=query_x.device)\n        mix_s = self.freqmix(support_x, support_x[s_perm])\n        mix_q = self.freqmix(query_x, query_x[q_perm])\n        mixed_logits = self.episode_logits(mix_s, support_y, mix_q)\n\n        # Clean view is the detached target of the KL consistency term.\n        clean_prob = F.softmax(clean_logits, dim=-1).detach()\n        loss_cons = F.kl_div(\n            F.log_softmax(mixed_logits, dim=-1), clean_prob, reduction=\"batchmean\"\n        )\n        loss = loss_ce + lambda_cons * loss_cons\n        return loss, loss_ce.detach(), loss_cons.detach()\n"}, {"kind": "text", "ext": "py", "data": "\"\"\"Plot few-shot accuracy versus number of shots for the LeafProto paper.\n\nReads results/main_results.csv (columns: method, shots, accuracy, ci95)\nand writes figures/accuracy_vs_shots.png.\n\nUsage:\n    python src/plot_results.py\n    python src/plot_results.py --csv results/main_results.csv --out figures/accuracy_vs_shots.png\n\"\"\"\n\nimport argparse\nimport os\n\nimport matplotlib\n\nmatplotlib.use(\"Agg\")  # headless runs on the lab server\nimport matplotlib.pyplot as plt\nimport pandas as pd\n\nMETHOD_ORDER = [\"Finetune\", \"ProtoClass\", \"FastAdapt\", \"LeafProto\"]\nSTYLES = {\n    \"Finetune\": {\"color\": \"#999999\", \"marker\": \"s\", \"ls\": \"--\"},\n    \"ProtoClass\": {\"color\": \"#1f77b4\", \"marker\": \"o\", \"ls\": \"-\"},\n    \"FastAdapt\": {\"color\": \"#ff7f0e\", \"marker\": \"^\", \"ls\": \"-\"},\n    \"LeafProto\": {\"color\": \"#d62728\", \"marker\": \"D\", \"ls\": \"-\"},\n}\nSHOTS = [1, 2, 5, 10]\n\n\ndef load_results(csv_path):\n    df = pd.read_csv(csv_path)\n    required = {\"method\", \"shots\", \"accuracy\", \"ci95\"}\n    missing = required - set(df.columns)\n    if missing:\n        raise ValueError(f\"{csv_path} is missing columns: {sorted(missing)}\")\n    df[\"shots\"] = df[\"shots\"].astype(int)\n    return df\n\n\ndef plot_accuracy_vs_shots(df, out_path):\n    fig, ax = plt.subplots(figsize=(6, 4.2))\n    for method in METHOD_ORDER:\n        sub = df[df[\"method\"] == method].sort_values(\"shots\")\n        if sub.empty:\n            print(f\"warning: no rows for {method}, skipping\")\n            continue\n        style = STYLES[method]\n        ax.errorbar(\n            sub[\"shots\"],\n            sub[\"accuracy\"],\n            yerr=sub[\"ci95\"],\n            label=method,\n            color=style[\"color\"],\n            marker=style[\"marker\"],\n            linestyle=style[\"ls\"],\n            linewidth=1.8,\n            markersize=6,\n            capsize=3,\n        )\n    ax.set_xlabel(\"Number of shots (k)\")\n    ax.set_ylabel(\"Accuracy (%)\")\n    ax.set_xticks(SHOTS)\n    ax.set_xlim(0.5, 10.5)\n    ax.set_title(\"5-way episodes on leafdoc_fs\")\n    ax.grid(alpha=0.3)\n    ax.legend(loc=\"lower right\")\n    fig.tight_layout()\n\n    os.makedirs(os.path.dirname(out_path) or \".\", exist_ok=True)\n    fig.savefig(out_path, dpi=200)\n    plt.close(fig)\n    return out_path\n\n\ndef print_five_shot_gap(df):\n    five = df[df[\"shots\"] == 5].set_index(\"method\")[\"accuracy\"]\n    if \"LeafProto\" in five and \"FastAdapt\" in five and \"ProtoClass\" in five:\n        gap_fa = five[\"LeafProto\"] - five[\"FastAdapt\"]\n        gap_pc = five[\"LeafProto\"] - five[\"ProtoClass\"]\n        print(f\"5-shot LeafProto {five['LeafProto']:.1f}%: \"\n              f\"+{gap_fa:.1f} over FastAdapt, +{gap_pc:.1f} over ProtoClass\")\n\n\ndef main():\n    parser = argparse.ArgumentParser(description=\"Draw the accuracy-vs-shots figure.\")\n    parser.add_argument(\"--csv\", default=\"results/main_results.csv\")\n    parser.add_argument(\"--out\", default=\"figures/accuracy_vs_shots.png\")\n    args = parser.parse_args()\n\n    df = load_results(args.csv)\n    out = plot_accuracy_vs_shots(df, args.out)\n    print(f\"saved {out}\")\n    print_five_shot_gap(df)\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"kind": "text", "ext": "py", "data": "\"\"\"Train LeafProto on the base classes of leafdoc_fs with episodic sampling.\n\nUsage:\n    python src/train.py --config configs/base.yaml\n\"\"\"\nimport argparse\nimport time\nfrom pathlib import Path\n\nimport torch\nimport torch.nn.functional as F\n\nfrom leafproto_model import LeafProtoNet\nfrom data import get_split, EpisodeSampler\nfrom utils import set_seed, get_logger, save_checkpoint, load_config\n\nVAL_EPISODES = 200\nLOG_EVERY = 100\n\n\ndef parse_args():\n    p = argparse.ArgumentParser(description=\"Train LeafProto (few-shot leaf disease)\")\n    p.add_argument(\"--config\", default=\"configs/base.yaml\", help=\"path to YAML config\")\n    p.add_argument(\"--device\", default=\"cuda\" if torch.cuda.is_available() else \"cpu\")\n    return p.parse_args()\n\n\ndef episode_loss(model, batch, lambda_cons):\n    \"\"\"Cross-entropy on clean query logits plus KL(clean || FreqMix view).\"\"\"\n    sx, sy, qx, qy = batch\n    logits_clean, logits_mix = model.episode_logits(sx, sy, qx)\n    l_ce = F.cross_entropy(logits_clean, qy)\n    p_clean = F.softmax(logits_clean, dim=1).detach()  # clean view is the target\n    l_cons = F.kl_div(F.log_softmax(logits_mix, dim=1), p_clean, reduction=\"batchmean\")\n    return l_ce + lambda_cons * l_cons\n\n\n@torch.no_grad()\ndef validate(model, sampler, dataset, device):\n    model.eval()\n    accs = []\n    for sx, sy, qx, qy in sampler.iter_episodes(dataset, VAL_EPISODES, num_workers=0):\n        logits = model.predict(sx.to(device), sy.to(device), qx.to(device))\n        accs.append((logits.argmax(dim=1).cpu() == qy).float().mean().item())\n    model.train()\n    return sum(accs) / max(len(accs), 1)\n\n\ndef main():\n    args = parse_args()\n    cfg = load_config(args.config)\n    set_seed(cfg[\"seed\"])\n    log = get_logger(cfg[\"log_dir\"])\n    log.info(f\"config: {args.config}\")\n    device = torch.device(args.device)\n\n    train_set = get_split(\"train\", image_size=cfg[\"image_size\"])\n    val_set = get_split(\"val\", image_size=cfg[\"image_size\"])\n    sampler = EpisodeSampler(cfg[\"n_way\"], cfg[\"k_shot\"], cfg[\"n_query\"])\n\n    model = LeafProtoNet(\n        scale_init=cfg[\"scale_init\"],\n        freqmix_beta=cfg[\"freqmix\"][\"beta\"],\n        freqmix_p=cfg[\"freqmix\"][\"p\"],\n    ).to(device)\n    optim = torch.optim.Adam(model.parameters(), lr=cfg[\"lr\"], weight_decay=cfg[\"weight_decay\"])\n    sched = torch.optim.lr_scheduler.CosineAnnealingLR(optim, T_max=cfg[\"episodes\"])\n\n    ckpt_path = Path(\"checkpoints\") / \"best.pt\"\n    ckpt_path.parent.mkdir(parents=True, exist_ok=True)\n    best_acc, best_step = 0.0, 0\n    running, count = 0.0, 0\n    start = time.time()\n\n    episodes = sampler.iter_episodes(train_set, cfg[\"episodes\"], num_workers=cfg[\"num_workers\"])\n    for step, batch in enumerate(episodes, start=1):\n        batch = [t.to(device, non_blocking=True) for t in batch]\n        loss = episode_loss(model, batch, cfg[\"lambda_cons\"])\n        optim.zero_grad(set_to_none=True)\n        loss.backward()\n        optim.step()\n        sched.step()\n        running += loss.item()\n        count += 1\n\n        if step % cfg[\"eval_every\"] == 0:\n            acc = validate(model, sampler, val_set, device)\n            log.info(f\"step {step} loss {running / count:.3f} val_acc {acc:.3f}\")\n            running, count = 0.0, 0\n            if acc > best_acc:\n                best_acc, best_step = acc, step\n                save_checkpoint(ckpt_path, model, optim, step, best_acc)\n        elif step % LOG_EVERY == 0:\n            log.info(f\"step {step} loss {running / count:.3f} lr {sched.get_last_lr()[0]:.6f}\")\n            running, count = 0.0, 0\n\n    elapsed = int(time.time() - start)\n    h, rem = divmod(elapsed, 3600)\n    m, s = divmod(rem, 60)\n    log.info(f\"done: best val_acc {best_acc:.3f} at step {best_step}, \"\n             f\"total {h}h {m}m {s}s\")\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"kind": "text", "ext": "py", "data": "\"\"\"Seeding, logging and checkpoint helpers shared by the LeafProto scripts.\"\"\"\n\nimport logging\nimport os\nimport random\nfrom datetime import datetime\n\nimport numpy as np\nimport torch\nimport yaml\n\n\ndef set_seed(seed: int = 42) -> None:\n    \"\"\"Fix python, numpy and torch RNGs so episodes are reproducible.\"\"\"\n    random.seed(seed)\n    np.random.seed(seed)\n    torch.manual_seed(seed)\n    torch.cuda.manual_seed_all(seed)\n    torch.backends.cudnn.deterministic = True\n    torch.backends.cudnn.benchmark = False\n\n\ndef get_logger(log_dir: str = \"logs\") -> logging.Logger:\n    \"\"\"Return a logger writing to logs/train_YYYY-MM-DD.log and to stdout.\"\"\"\n    os.makedirs(log_dir, exist_ok=True)\n    stamp = datetime.now().strftime(\"%Y-%m-%d\")\n    log_path = os.path.join(log_dir, f\"train_{stamp}.log\")\n\n    logger = logging.getLogger(\"leafproto\")\n    if logger.handlers:  # avoid duplicate handlers when called twice\n        return logger\n\n    logger.setLevel(logging.INFO)\n    logger.propagate = False\n    fmt = logging.Formatter(\"[%(asctime)s] %(message)s\", datefmt=\"%Y-%m-%d %H:%M:%S\")\n\n    file_handler = logging.FileHandler(log_path, encoding=\"utf-8\")\n    file_handler.setFormatter(fmt)\n    stream_handler = logging.StreamHandler()\n    stream_handler.setFormatter(fmt)\n\n    logger.addHandler(file_handler)\n    logger.addHandler(stream_handler)\n    return logger\n\n\ndef save_checkpoint(state: dict, path: str) -> None:\n    \"\"\"Save model/optimizer state and metadata, creating the folder if needed.\"\"\"\n    folder = os.path.dirname(path)\n    if folder:\n        os.makedirs(folder, exist_ok=True)\n    torch.save(state, path)\n\n\ndef load_checkpoint(path: str, device: str = \"cpu\") -> dict:\n    \"\"\"Load a checkpoint saved by save_checkpoint.\"\"\"\n    if not os.path.isfile(path):\n        raise FileNotFoundError(f\"checkpoint not found: {path}\")\n    return torch.load(path, map_location=device)\n\n\ndef load_config(path: str) -> dict:\n    \"\"\"Load a YAML config and merge the parent named under the 'inherits' key.\n\n    The parent path is resolved relative to the folder of the child config.\n    Keys in the child override keys in the parent. Chains are followed.\n    \"\"\"\n    with open(path, \"r\", encoding=\"utf-8\") as f:\n        cfg = yaml.safe_load(f) or {}\n\n    parent_name = cfg.pop(\"inherits\", None)\n    if parent_name is None:\n        return cfg\n\n    parent_path = os.path.join(os.path.dirname(path), parent_name)\n    parent = load_config(parent_path)\n    parent.update(cfg)\n    return parent\n"}, {"kind": "text", "ext": "md", "data": "# LeafProto\n\nFew-shot plant disease classification from leaf photos. LeafProto is a prototype classifier with a frequency-domain augmentation (FreqMix) and a cosine prototype head. It was developed at the Plant Vision Lab, Hanbit University.\n\nPaper: *LeafProto: Few-Shot Plant Disease Classification with Frequency-Domain Mixing and a Cosine Prototype Head* (current draft: `paper/leafproto_draft_v2.pdf`).\n\n## Method in brief\n\nFull details are in `docs/method.md`. In short:\n\n- **FreqMix**: take the 2D FFT of each leaf image per channel and split it into amplitude and phase. For two images in the same episode, the low-frequency amplitude band is interpolated. The mask is a centered square covering 10% of the shorter side of the shifted spectrum (beta = 0.1), and the mixing weight is lam ~ Uniform(0.3, 0.7). Phase is kept, then an inverse FFT is applied. The label is that of the first image. FreqMix is applied with probability 0.5 per image, during training only.\n- **Cosine prototype head**: each prototype is the mean of the L2-normalized support embeddings of a class. Logits are `s * cos(f_q, p_c)`, where the scale `s` is learnable and starts at 10.0.\n- **Encoder**: ResNet-12 with channels 64-160-320-640, giving a 640-d embedding after global average pooling.\n- **Loss**: `L = L_ce + 0.5 * L_cons`. `L_cons` is the KL divergence between the predictions for the clean query view (detached) and the FreqMix query view.\n\n## Results (5-way, accuracy %, mean ± ci95)\n\n| Method     | 1-shot     | 2-shot     | 5-shot     | 10-shot    |\n|------------|------------|------------|------------|------------|\n| Finetune   | 52.3 ± 0.9 | 61.8 ± 0.8 | 72.5 ± 0.7 | 79.1 ± 0.6 |\n| ProtoClass | 60.4 ± 0.9 | 70.2 ± 0.8 | 80.9 ± 0.6 | 85.0 ± 0.5 |\n| FastAdapt  | 64.8 ± 0.9 | 73.5 ± 0.8 | 83.6 ± 0.6 | 87.2 ± 0.5 |\n| LeafProto  | 69.7 ± 0.9 | 78.3 ± 0.7 | 87.4 ± 0.5 | 90.6 ± 0.4 |\n\nAt 5 shots LeafProto reaches 87.4%, which is 3.8 points above FastAdapt and 6.5 points above ProtoClass.\n\nAblation at 5 shots (accuracy %), also stored in `results/`:\n\n| Variant                                  | 5-shot | Change |\n|------------------------------------------|--------|--------|\n| Full LeafProto                           | 87.4   | –      |\n| w/o FreqMix                              | 84.0   | -3.4   |\n| w/o cosine head (squared Euclidean)      | 85.2   | -2.2   |\n| w/o consistency loss (lambda_cons = 0)   | 86.3   | -1.1   |\n| FreqMix full spectrum (beta = 1.0)       | 85.6   | -1.8   |\n\nFreqMix is the largest contributor. The low-frequency band carries leaf color and illumination, while disease texture sits in higher frequencies and is preserved.\n\n## Setup\n\nRequirements: Python 3.10, PyTorch 2.2, numpy, pyyaml, pandas, matplotlib.\n\n```bash\npython3.10 -m venv .venv\nsource .venv/bin/activate\npip install \"torch==2.2.*\" numpy pyyaml pandas matplotlib\n```\n\n## Data\n\nThe dataset is `leafdoc_fs`: 18,420 field photos of leaves across 54 classes (species x disease). The split is 30 base classes for training, 12 for validation, and 12 novel classes for test. Place the data under `data/leafdoc_fs/`. The metadata CSV is `data/leafdoc_fs/metadata.csv` with the columns `image_path, label, species, disease, split`. Images are resized to 84x84.\n\n## Configs\n\nConfigs live in `configs/`. The base config holds the default values: lr 0.001, Adam, weight decay 0.0005, cosine schedule, image size 84, 1 episode per step, 5-way, 1-shot, 15 queries, 40,000 episodes, seed 42, FreqMix beta 0.1 and p 0.5, lambda_cons 0.5, scale init 10.0, evaluation every 500 steps, 4 data workers.\n\nThe 5-way config used for the paper is `configs/<5-way-config>.yaml`. It starts with an `inherits:` line that points to the base config and overrides `k_shot: 5`, `log_dir: logs`, and `results_csv` (the CSV under `results/`). Replace `<5-way-config>` with the actual filename in `configs/`.\n\n## Training\n\nRun the 5-way training with:\n\n```bash\npython src/train.py --config configs/<5-way-config>.yaml\n```\n\nWithout `--config`, `src/train.py` uses the base config.\n\nEach run writes a log to `logs/train_{YYYY-MM-DD}.log`. The first line records the config, for example:\n\n```\n[2026-10-08 09:12:03] config: configs/<5-way-config>.yaml\n```\n\nThe reference run took 5 h 40 min for 40,000 episodes on one RTX 4090. Validation accuracy went from 71.2% at step 500 to 87.1% at step 40,000. The best checkpoint was saved at step 38,500 to `checkpoints/best.pt`.\n\n## Evaluation\n\nEvaluation uses 600 test episodes, 5-way, 15 queries per class, with seed 42. The output is mean accuracy in % with a 95% confidence interval over episodes.\n\n```bash\npython src/evaluate.py --config configs/<5-way-config>.yaml --ckpt checkpoints/best.pt\n```\n\n## Figures\n\nPlotting scripts live in `src/`. Run the one named `plot_*.py` to regenerate the accuracy-versus-shots chart in `figures/` from the results CSV.\n\n## Repository layout\n\n- `configs/`: YAML configs (base config and 5-way config)\n- `src/`: training, evaluation, FreqMix, model, data loading, utils, and plotting code\n- `data/`: dataset folder (`leafdoc_fs/`), not tracked in git\n- `logs/`: training logs named by date\n- `checkpoints/`: saved model weights\n- `results/`: result CSV and ablation table\n- `figures/`: generated plots and pipeline diagram\n- `docs/`: method description (`docs/method.md`)\n- `papers/`: reading notes on the baseline papers\n- `paper/`: paper drafts\n- `notes/`: meeting notes\n\n## Team\n\n- Park Hyunwoo: first author, training code\n- Kim Seoyeon: data and splits, FreqMix experiments\n- Lee Doyun: baselines and plotting\n- Choi Jimin: writing and related work\n- Prof. Jung Minjun: advisor\n"}, {"kind": "text", "ext": "md", "data": "# LeafProto: Method Description\n\nLeafProto is a few-shot classifier for plant disease from leaf photos. Training is episodic: each step samples a 5-way episode with a small support set and a query set. The method builds on ProtoClass (Maddox and Tanaka, 2019) and changes three things: (a) cosine similarity with a learnable scale replaces squared Euclidean distance, (b) a frequency-domain augmentation called FreqMix is added, and (c) a consistency loss ties clean and mixed query views together.\n\n## 1. Notation\n\n- Episode: N = 5 classes, K support images per class (K = 5 in the main setting), Q = 15 query images per class.\n- Input leaf image x, resized to 84 x 84 pixels with 3 color channels.\n- f(x) in R^640: embedding produced by the encoder.\n\n## 2. Encoder\n\nThe encoder is a ResNet-12 with channel widths 64, 160, 320, and 640. Global average pooling produces a 640-d embedding per image. The class `LeafProtoNet` wraps the encoder and the cosine prototype head.\n\n## 3. FreqMix (key novel module)\n\nFreqMix is a frequency-domain augmentation applied to the images of an episode during training.\n\n1. For each image and each color channel, compute the 2D FFT and split the spectrum into amplitude A and phase P.\n2. For two images a and b from the same episode, mix the low-frequency amplitude band:\n\n   A_mix = (1 - M) * A_a + M * (lam * A_a + (1 - lam) * A_b)\n\n   Inside the mask M the amplitude is interpolated between a and b. Outside M it stays A_a.\n3. Keep the phase P_a unchanged and apply the inverse FFT to get the mixed image.\n4. The label of the mixed image is the label of image a.\n\nHyperparameters:\n\n- Band ratio beta = 0.1. M is a centered square covering 10% of the shorter side of the shifted spectrum.\n- lam is drawn from Uniform(0.3, 0.7).\n- Apply probability p = 0.5 per image.\n- FreqMix is applied to support and query images during training only. It is never applied at evaluation.\n\nThe low-frequency band carries leaf color and illumination. Disease texture lives in higher frequencies, which FreqMix leaves intact.\n\n## 4. Cosine prototype head\n\nThe class `CosineProtoHead` works as follows.\n\n- Each support embedding is L2-normalized.\n- The prototype of class c is the mean of the normalized support embeddings of that class:\n  p_c = mean over support images of class c of f(x_s) / ||f(x_s)||.\n- For a query q and class c, the logit is\n\n  z_{q,c} = s * cos(f_q, p_c)\n\n  where s is a learnable scale initialised to 10.0.\n- Class probabilities are the softmax of the logits over the 5 classes.\n\n## 5. Losses\n\nThe total loss is\n\n  L = L_ce + lambda_cons * L_cons, with lambda_cons = 0.5.\n\n- L_ce is the cross-entropy over the cosine logits of the query set.\n- L_cons is the KL divergence between the softmax predictions of the clean query view and the FreqMix query view. The clean view is detached, so gradients flow only through the mixed branch.\n\n## 6. Training procedure\n\n1. Sample one 5-way episode per step, with K = 5 support and Q = 15 query images per class.\n2. Apply FreqMix to support and query images with probability 0.5 each.\n3. Encode all images, build prototypes from the support set, and compute cosine logits for the clean and mixed queries.\n4. Compute L and update the encoder and scale s with Adam (learning rate 0.001, weight decay 0.0005) under a cosine learning-rate schedule.\n5. Run 40,000 episodes with seed 42. Evaluate on the validation split every 500 steps and keep the checkpoint with the best validation accuracy.\n\nThe main 5-shot run took 5 h 40 min on one RTX 4090.\n\n## 7. Evaluation\n\nEvaluation uses 600 test episodes drawn from the 12 novel test classes of leafdoc_fs. Each episode is 5-way with 15 queries per class. Accuracy is reported in percent as a mean with a 95% confidence interval (ci95) over episodes. FreqMix is off and seeds are fixed at 42.\n\n## 8. Results summary\n\nMain results (accuracy %, 5-way, mean +- ci95):\n\n| Method    | 1-shot     | 2-shot     | 5-shot     | 10-shot    |\n|-----------|------------|------------|------------|------------|\n| Finetune  | 52.3 +- 0.9 | 61.8 +- 0.8 | 72.5 +- 0.7 | 79.1 +- 0.6 |\n| ProtoClass | 60.4 +- 0.9 | 70.2 +- 0.8 | 80.9 +- 0.6 | 85.0 +- 0.5 |\n| FastAdapt | 64.8 +- 0.9 | 73.5 +- 0.8 | 83.6 +- 0.6 | 87.2 +- 0.5 |\n| LeafProto | 69.7 +- 0.9 | 78.3 +- 0.7 | 87.4 +- 0.5 | 90.6 +- 0.4 |\n\nAt 5 shots LeafProto reaches 87.4%, which is 3.8 points above FastAdapt (83.6) and 6.5 points above ProtoClass (80.9).\n\nAblation (5-shot accuracy %):\n\n| Variant                                   | Accuracy | Change |\n|-------------------------------------------|----------|--------|\n| Full LeafProto                            | 87.4     | -      |\n| w/o FreqMix                               | 84.0     | -3.4   |\n| w/o cosine head (squared Euclidean)       | 85.2     | -2.2   |\n| w/o consistency loss (lambda_cons = 0)    | 86.3     | -1.1   |\n| FreqMix full spectrum (beta = 1.0)        | 85.6     | -1.8   |\n\nFreqMix is the largest contributor. Mixing the full spectrum hurts because it also alters the high-frequency texture that carries disease signal.\n\n## 9. Relation to prior work\n\nProtoClass computes prototypes as mean support embeddings and classifies with squared Euclidean distance. LeafProto keeps the prototype idea and changes the similarity to a cosine with a learnable scale, adds FreqMix, and adds the consistency loss. FastAdapt relies on a 5-step ridge-regression adaptation of the last layer per episode, which makes test-time inference about 3.1 times slower per episode than LeafProto. LeafProto has no inner loop.\n\n## 10. Limitations and open choices\n\n- Only one dataset (leafdoc_fs) has been evaluated.\n- Images are used at 84 x 84 resolution.\n- Transfer across species has not been tested.\n- The band ratio beta is fixed at 0.1 rather than learned.\n\n## 11. Future work\n\n- Learn beta per episode (adaptive FreqMix).\n- Mix the phase as well as the amplitude.\n- Use multi-scale prototypes in the cosine head.\n- Learn a separate scale s for each class.\n- Test cross-species transfer.\n- Deploy the ResNet-12 encoder on mobile devices.\n- Add a temperature to the consistency loss.\n"}, {"kind": "text", "ext": "md", "data": "# Related Work (draft)\n\nDraft for the v2 internal review. Comments welcome, especially on the FastAdapt paragraph.\n\n## Episodic few-shot classification\n\nFew-shot image classification is usually trained and evaluated in episodes. Each episode samples N classes with K labelled support images and Q query images per class, and the model must classify the queries using only the support set. Our experiments follow this protocol with 5-way episodes, 15 queries per class, and 1, 2, 5 or 10 shots. We report accuracy in percent with a 95% confidence interval over 600 test episodes, using seed 42.\n\n## Prototype-based methods\n\nProtoClass (Maddox and Tanaka, 2019) represents each class by the mean of its support embeddings and assigns a query to the nearest prototype under squared Euclidean distance. Its original benchmark reports 78.2% for 5-way 5-shot, using a four-layer convolutional encoder trained episodically. Our work starts from ProtoClass. We keep the prototype-as-mean-of-support idea and the episodic training loop, and change three things: the similarity function, the training augmentation, and the training objective. Notes on the paper are in papers/notes_protoclass2019.md.\n\n## Adaptation-based methods\n\nFastAdapt (Voss and Lindqvist, 2022) meta-learns an encoder and then adapts the last layer for each test episode. The adaptation is a five-step ridge-regression inner loop with regularisation 0.1. The paper reports 83.6% for 5-way 5-shot. We reproduced this number on leafdoc_fs, so it is the strongest baseline in our tables. Its main costs are at test time. Each episode needs the inner loop, which makes inference about 3.1 times slower per episode than LeafProto. The method also uses no image-level augmentation, so it does not address the limited variety of field photos. Notes are in papers/notes_fastadapt2022.md.\n\n## Fine-tuning baselines\n\nThe Finetune baseline pretrains the encoder on the base classes and then fine-tunes a linear head on the support set for 100 steps. It is a simple and widely used reference. On leafdoc_fs it reaches 52.3% at 1 shot and 72.5% at 5 shots, well below the prototype methods. This gap suggests that a head fitted on one or two images per class overfits quickly, which is the main reason we chose a prototype-based design.\n\n## Frequency-domain and leaf-specific augmentation\n\nAugmentation that changes the frequency content of images has been used for general recognition. SpecShift (2021) perturbs spectral components to improve robustness to appearance shifts. LeafAug (2020) uses colour and geometric transforms designed for leaf photos. Both are general context for our work and neither targets few-shot episodes. FreqMix differs in two ways. It mixes only the low-frequency amplitude band between two images of the same episode, and it keeps the phase of the anchor image. Low-frequency amplitude mainly carries colour and illumination. Disease texture sits at higher frequencies, and FreqMix leaves that band untouched.\n\n## Plant disease classification\n\nMost plant disease classifiers assume many labelled images per class and a fixed label set. Field photos vary in lighting, background and leaf age, and new species and disease combinations appear often. Few-shot formulations fit this setting better, but they are less studied for leaves. Our dataset, leafdoc_fs, has 54 species-by-disease classes split into 30 base, 12 validation and 12 novel test classes.\n\n## How this work differs\n\nLeafProto builds on ProtoClass and changes three parts:\n\n- **Similarity.** Queries are compared to prototypes with cosine similarity scaled by a learnable scale s, initialised to 10.0. The Euclidean head is replaced.\n- **Augmentation.** FreqMix works in the 2D FFT domain. For two images in an episode, the amplitude inside a centred square covering 10% of the shorter side is interpolated with lambda drawn from Uniform(0.3, 0.7). The phase is kept and the inverse FFT gives the mixed image. The label is that of the anchor. It is applied with probability 0.5 per image, in training only.\n- **Objective.** The total loss is L = L_ce + 0.5 * L_cons. L_ce is cross-entropy over the cosine logits of the queries. L_cons is a KL divergence between the predictions on the clean query view and the FreqMix view, with the clean view detached.\n\nOn leafdoc_fs at 5 shots, LeafProto reaches 87.4%. This is 3.8 points above FastAdapt (83.6%) and 6.5 points above ProtoClass (80.9%). Unlike FastAdapt, LeafProto needs no inner loop at test time.\n\nThe ablation at 5 shots supports each part. Removing FreqMix costs 3.4 points (84.0%). Replacing the cosine head with squared Euclidean distance costs 2.2 points (85.2%). Setting lambda_cons to 0 costs 1.1 points (86.3%). Mixing the full spectrum with beta = 1.0 costs 1.8 points (85.6%). FreqMix contributes the most, which is why we treat the low-frequency band restriction as the central design choice.\n\n## Open gaps\n\nRelated methods are also limited in ways we do not yet address. Our evaluation uses a single dataset, images at 84x84 resolution, and no cross-species transfer. The band ratio beta is fixed at 0.1 rather than adapted per episode. We discuss these limits in the final section of the paper.\n"}, {"kind": "text", "ext": "md", "data": "# Reading notes: FastAdapt (fastadapt2022)\n\nAuthors: Voss and Lindqvist (2022)\nRole for us: main competing baseline. It appears as the \"FastAdapt\" row in Table 1 of the paper draft.\n\n## One-line summary\n\nA meta-learned encoder plus a per-episode adaptation of the last layer, using a short ridge-regression inner loop (5 steps, lambda = 0.1).\n\n## How it works\n\n- The encoder is meta-trained over episodes on the base classes.\n- For each test episode, the last layer is adapted on the support set with 5 inner steps of ridge regression. Each step has a closed-form solution, and the regularisation weight is lambda = 0.1.\n- Query predictions come from the adapted last layer.\n- The outer loop updates the encoder through the adapted head, so the encoder is trained to adapt well.\n\n## Our reproduction setting\n\n- Same protocol as the rest of the paper: 5-way episodes, 15 queries per class, 600 test episodes, seed 42, 84x84 input.\n- Data is leafdoc_fs with 30 base, 12 val and 12 novel classes.\n- Our 5-shot number on leafdoc_fs is 83.6, which matches the 5-shot value the original authors report.\n\n## Results on leafdoc_fs (accuracy %, 5-way, mean ± ci95)\n\n| Shots | FastAdapt |\n|-------|-----------|\n| 1     | 64.8 ± 0.9 |\n| 2     | 73.5 ± 0.8 |\n| 5     | 83.6 ± 0.6 |\n| 10    | 87.2 ± 0.5 |\n\n## Strengths\n\n- Stronger than Finetune and ProtoClass at low shot counts. At 1-shot it reaches 64.8, against 60.4 for ProtoClass.\n- The closed-form inner loop is stable and needs little tuning beyond lambda.\n- Adapting only the last layer keeps the adaptation cheap in terms of parameters.\n\n## Weaknesses\n\n- Slow inference. In our timing runs it is about 3.1x slower per episode than LeafProto.\n- The inner loop runs for every test episode, so the extra cost is paid at evaluation time for every query set.\n- No data augmentation. The encoder only sees the raw field photos, so it has no explicit way to handle the lighting and colour variation typical of leaf photos taken outdoors.\n\n## Relevance to LeafProto\n\n- FastAdapt is the strongest baseline in the paper. LeafProto is ahead at every shot count:\n  - 1-shot: 69.7 vs 64.8 (+4.9)\n  - 5-shot: 87.4 vs 83.6 (+3.8)\n  - 10-shot: 90.6 vs 87.2 (+3.4)\n- The gap narrows at 10 shots, which matches the trend in the accuracy-versus-shots figure.\n- Our framing: FastAdapt gets its gains from test-time adaptation. LeafProto gets its gains from FreqMix augmentation during training and a cosine prototype head, with no inner loop at test time.\n- FastAdapt has no augmentation, so it is a natural point of comparison for the FreqMix ablation. The ablation shows FreqMix is the largest single contributor to LeafProto's 5-shot result.\n\n## Open questions\n\n- Would adding a FreqMix-style augmentation to FastAdapt close the gap? We have not run this.\n- Does the 3.1x slowdown hold on other hardware? Our timing runs were on a single RTX 4090.\n- Is lambda = 0.1 the best setting for leaf images, or was it tuned on the original benchmark only?\n\n## Notes for the seminar\n\n- When presenting the baseline, say that FastAdapt is the main comparison point, not a weak one.\n- Keep the 5-shot gap (+3.8) and the speed comparison (3.1x) in the same slide so the trade-off is clear.\n"}, {"kind": "text", "ext": "md", "data": "# Reading notes: ProtoClass (protoclass2019)\n\nAuthors: Maddox and Tanaka. Read for: the prior work LeafProto is built on.\nStatus: read in full, notes by Choi Jimin, reviewed by Park Hyunwoo.\n\n## One-line summary\n\nProtoClass is an episodic few-shot method. Each class gets a prototype, the mean of its support embeddings, and queries are classified by squared Euclidean distance to the prototypes.\n\n## Setup as described in the paper\n\n- Episodic training with N-way K-shot episodes and a query set per episode.\n- Encoder: a 4-conv backbone, producing a flat embedding vector.\n- Prototype p_c = mean of the support embeddings of class c.\n- Score for a query: negative squared Euclidean distance to each prototype, softmax over classes, cross-entropy loss.\n- Train and test use the same N-way K-shot format.\n\n## Reported results\n\n- 5-way 5-shot accuracy of 78.2 on their own evaluation set.\n- Their numbers are not directly comparable to ours. Different data, different resolution, different encoder.\n- On leafdoc_fs (our runs, same protocol as the paper tables), ProtoClass reaches 60.4 at 1-shot, 70.2 at 2-shot, 80.9 at 5-shot and 85.0 at 10-shot.\n\n## What is useful for us\n\n- The prototype idea is simple and cheap at test time. No inner loop, so it is much faster per episode than FastAdapt.\n- Episodic training matches our test protocol directly (5-way, 15 queries per class).\n- The Euclidean head is easy to swap. That is why we could test the cosine head as a single change.\n\n## What we change in LeafProto\n\n(a) Cosine head with a learnable scale.\n- Prototypes are now built from L2-normalised support embeddings.\n- Logit for query q and class c is s * cos(f_q, p_c), with s initialised to 10.0 and learned.\n- The paper's squared Euclidean distance is replaced by this cosine score.\n\n(b) FreqMix augmentation, which is new in our work and not in ProtoClass.\n- Each leaf image goes through a 2D FFT per channel. Amplitude and phase are split.\n- Low-frequency amplitude is mixed between two images of the same episode. Phase is kept.\n- Settings: band ratio beta = 0.1, lam ~ Uniform(0.3, 0.7), apply probability p = 0.5, training only.\n\n(c) Consistency loss.\n- Total loss L = L_ce + lambda_cons * L_cons, with lambda_cons = 0.5.\n- L_cons is the KL divergence between the softmax of the clean query view and the FreqMix query view. The clean view is detached.\n\nEncoder: we use a ResNet-12 (channels 64-160-320-640, 640-d embedding), not the 4-conv net of the original paper.\n\n## Ablation evidence on the head and the augmentation\n\nFrom the 5-shot ablation on leafdoc_fs:\n- Full LeafProto: 87.4\n- Squared Euclidean instead of cosine head: 85.2 (-2.2)\n- No FreqMix: 84.0 (-3.4)\n- No consistency loss: 86.3 (-1.1)\n\nSo the cosine head matters, but FreqMix matters more. This is the main reason the paper is framed around the augmentation and not only the head.\n\n## Concerns to keep in mind\n\n- The original paper used a small encoder and a different benchmark. Some of the gain we see could come from the encoder change, not only from the three modifications. We should say this clearly in the limitations.\n- ProtoClass has no augmentation, so the fair comparison for our method is ProtoClass with the same ResNet-12 encoder. We do not have this run yet. Lee Doyun may be able to add it.\n- The paper does not study image resolution. Our inputs are 84x84 field photos, and small lesions may be hard to see at that size.\n- The paper only reports 5-way results in the main text as far as I can tell. Our 1-shot and 10-shot numbers are our own runs.\n\n## Quick takeaways for the write-up\n\n- Cite ProtoClass as the base method in the method section. Say which parts we keep (prototypes, episodic training) and which we change (distance, augmentation, loss).\n- Do not compare the 78.2 number directly with our tables. Use our own ProtoClass runs for the comparison.\n- If the seminar slide on ProtoClass recap needs one line: \"Prototype = mean support embedding, squared Euclidean distance, episodic training.\"\n"}, {"kind": "image", "data": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABEwAAAKhCAIAAADFaayLAAAACXBIWXMAABDrAAAQ6wFQlOh8AAC87ElEQVR4nOzdB1QUV98GcEDFbhJLYkzsmlgSNbbXaGJijFGjRhNj4mtQo8bek6DGqK+K2Hss2Bv2hg2UIkWp0osoVUC69L6w7PcPN7nfsMAysAu7LM/vcDizd2dn7pTdvc/OzB0dGQAAAAAAgBbRUXcFAAAAAAAAVAkhBwAAAAAAtApCDgAAAAAAaBWEHAAAAAAA0CoIOQAAAAAAoFUQcgAAAAAAQKsg5AAAAAAAgFZByAEAAAAAAK2CkAMAAAAAAFoFIQcAAAAAALQKQg4AAAAAAGgVhBwAAAAAANAqCDkAAAAAAKBVEHIAAAAAAECrIOQAAAAAAIBWQcgBAAAAAACtgpADAAAAAABaBSEHAAAAAAC0CkIOAAAAAABoFYQcAAAAAADQKgg5AAAAAACgVRByAAAAAABAqyDkAAAAAACAVkHIAQAAAAAArYKQAwAAAAAAWgUhBwAAAAAAtApCDgAAAAAAaBWEHAAAAAAA0CoIOQAAAAAAoFXUHHKeP3++4F8WFhbqrQxojsWLF7O9Qt0VKV1hYeGNGzdWrVq1bNmyW7duVXo6165dY4tpb2+vwuppPh8fH7bgx48fV/nERW4dDw8PVoeTJ0+qvA4iqWpH4oyNjWmJvLy82MPo6OjA0iQlJSk/r5olOzubbe4VK1ZUzxzT09PZHGn7qnCyCQkJNM2lS5fm5OSocLIAANpHzSHn999/1/nXkCFD1FsZ0Bx6enpsr1B3RUq3ZMkSvt8qk8T4dP766y+VVOzYsWOHi1DrWSUTrCI3b95kC/7dd9+pfOIit87FixfZOD/88IPK6yCSqnYk5vbt2zSdVq1aUYOeldCHqk5pduzYoXTda5iUlBS27M2bN6+eOcbGxrI5vvnmm6qdMtus69atU+1kAQC0jDobkdQOe+edd4RfvZGRkWqsD2gOTQ45tN82bNiQVW/w4MEmJiaVnpTKQ46+vj6bYH5+vkomWEWqLuSI3zpqDzkq3JFITk5Ox44daVJbt27lhdSgR8hhtCnkWFhY0GTr168fFham2ikDAGgTdTYibW1t8dULpdLkkJOUlMTq1qhRo4KCAmUmhZCj8pAjfuuoPeSocEci+/btY5NKT09nJYmJiWz68+bNW13c48ePla5+DUORMrZIfHx89cyx6kIO+fDDD2 IgcAAAgReQAAAApIgcAAEgROQAAQIrIAQAAUkQOAACQInIAAIAUkQMAAKSIHAAAIEXkAAAAKSIHAABIETkAAECKyAEAAFJEDgAAkCJyAACAFJEDAACkiBwAACBF5AAAACkiBwAASBE5AABAisgBAABSRA4AAJAicgAAgBSRAwAApIgcAAAgReQAAAApIgcAAEgROQAAQIrIAQAAUkQOAACQInIAAIAUkQMAAKSIHAAAIEXkAAAAKSIHAABIETkAAECKyAEAAFJEDgAAkPIvpd+j30AU0IYAAAAASUVORK5CYII="}, {"kind": "text", "ext": "md", "data": "# Ablation results: LeafProto (5-way, 5-shot)\n\nThis file reports the component ablation for LeafProto on the leafdoc_fs test split. Each row removes or changes one component of the full model and keeps everything else fixed. All runs use the 5-way, 5-shot training config, 600 test episodes with 15 queries per class, and seed 42.\n\n## Table: removing each component\n\n| Variant | What changes | 5-shot acc. (%) | Δ vs. full |\n|---|---|---|---|\n| Full LeafProto | none (FreqMix β = 0.1, cosine head, λ_cons = 0.5) | **87.4** | — |\n| w/o FreqMix | no frequency-domain augmentation in training | 84.0 | -3.4 |\n| w/o cosine head | squared Euclidean distance to prototypes instead of scaled cosine | 85.2 | -2.2 |\n| w/o consistency loss | λ_cons = 0, so only L_ce is used | 86.3 | -1.1 |\n| FreqMix full-spectrum | β = 1.0, mixes all frequencies instead of the low band | 85.6 | -1.8 |\n\nFull LeafProto matches the 5-shot number in the main results table (87.4%). The ablation rows are point means under the same protocol; the confidence intervals for the full model are the ones listed in the main results table.\n\n## Setup notes\n\n- **FreqMix (default):** 2D FFT per channel, amplitude mixing inside a centered square covering 10% of the shorter side of the shifted spectrum, λ ~ Uniform(0.3, 0.7), applied with probability 0.5 per image. Phase is kept. The label stays with image a. It is applied to support and query images during training only.\n- **Cosine head (default):** prototypes are means of L2-normalized support embeddings, logits are s · cos(f_q, p_c), and s is learnable with initial value 10.0.\n- **Consistency loss (default):** KL divergence between the softmax of the clean query view (detached) and the FreqMix query view, weighted by λ_cons = 0.5.\n- **Full-spectrum variant:** the only change is β = 1.0. The rest of the FreqMix procedure is unchanged.\n\n## Analysis\n\n**FreqMix is the largest contributor.** Removing it costs 3.4 points, the biggest drop of the four ablations. Most of the gain comes from the low-frequency amplitude band. In leaf photos from the field, this band mostly carries overall leaf color and illumination. Mixing it between episode images makes the encoder less sensitive to lighting and color shifts between farms and photo sessions, which is useful when only one or five labeled examples per class are available.\n\n**The low band matters because disease texture lives elsewhere.** Lesion edges, spots, and fine vein patterns are mostly in the higher frequencies. Because FreqMix keeps the phase and leaves the outer amplitude unchanged, these cues pass through the augmentation. The full-spectrum variant (β = 1.0) is 1.8 points below the full model, which is consistent with this explanation. When all frequencies are mixed, the texture signal that separates diseases is also blurred.\n\n**The cosine head is the second contributor.** Switching back to squared Euclidean distance costs 2.2 points. The learnable scale plus cosine similarity gives a more stable prototype comparison than raw distances when the support sets are small, which is the setting where the head is used.\n\n**The consistency loss adds a smaller but consistent gain.** Setting λ_cons = 0 costs 1.1 points. This is the smallest effect, but it is in the same direction as the other three ablations, and the consistency term is cheap to keep.\n\n## Limitations of this ablation\n\n- Each variant is a single removal. We did not test combinations, so the effects should not be summed.\n- The β sweep only has two points: β = 0.1 (default) and β = 1.0 (full spectrum). Intermediate band sizes are not covered, and β was
