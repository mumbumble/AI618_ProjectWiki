<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProjectWiki 사용자 스터디</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/standalone/umd/vis-network.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<style>
/* tokens and base styles follow the team viewer (projectwiki/srcs/view_template.html, main @ aeebcf0) */
:root{color-scheme:dark;
 --bg:#1e1e1e;--panel:#262626;--text:#dedede;--sub:#bdbdbd;--muted:#a3a3a3;--line:#363636;--line2:#4a4a4a;
 --accent:#b49af4;--accdeep:#7658b9;--accsoft:#3a3248;--ok:#7cbb9c;--oksoft:#26332c;--bad:#e98b90;--chip:#333136;--rail:#202020;
 --warn:#e0a458;--warnsoft:#33291c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif}
body{display:flex;flex-direction:column;overflow:hidden;word-break:keep-all;overflow-wrap:break-word}
p,li,h2,h3,.explain,.qtext,.callout,.suggest,.purpose,.inst,.empty-state,.fb,.brief,.summary,.sidebox,.edge-link span{text-wrap:pretty}
h2,.qtext,.suggest .q,.brief h2,.paper h2{text-wrap:balance}
.path,.file span,.card-file span,blockquote,.code,.doc code,.csv{word-break:normal;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--chip);border-radius:5px;padding:5px 10px;cursor:pointer}
button:hover{background:#403b49}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accdeep);color:#fff;border-color:#8768ca} button.primary:hover{background:#8466c7}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)} button.ghost:hover{color:var(--text);background:var(--chip)}
button:disabled{opacity:.4;cursor:default}
button.sm{font-size:12px;padding:2px 9px}
.hint{color:var(--muted);font-size:12px}
.mono,.path{font-family:ui-monospace,Consolas,monospace}

/* header */
header{display:flex;flex:none;align-items:center;height:43px;padding:0 16px;background:var(--rail);border-bottom:1px solid var(--line);gap:10px;position:relative}
header h1{font-size:14px;font-weight:600;margin:0}
.brand{color:var(--accent);font-size:22px}
#where{color:var(--muted);font-size:12px;margin-left:6px} #where b{color:var(--text);font-weight:500}
.header-note{margin-left:auto;color:var(--muted);font-size:12px}
#prog{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);transition:width .4s}
#app{flex:1;min-height:0;display:flex;flex-direction:column}

/* task strip */
.task{flex:none;display:flex;align-items:center;gap:14px;min-height:44px;padding:8px 16px;background:var(--rail);border-bottom:1px solid var(--line)}
.plbl{flex:none;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.plbl .pill{display:inline-block;padding:1px 8px;border-radius:4px;background:#38303f;color:var(--accent);font-weight:600;font-size:12px}
.purpose{flex:1;min-width:0;font-size:14.5px;color:var(--text);line-height:1.5}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:0 6px;border-radius:4px;margin-right:8px;background:var(--warnsoft);color:var(--warn);border:1px solid #6b5230;letter-spacing:0}
.inst{flex:none;font-size:12px;color:var(--muted)}

/* workspace */
.workspace{flex:1;min-height:0;display:flex;position:relative}
.ribbon{width:46px;flex:none;background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:10px}
.icon-button{border:0;background:transparent;width:32px;height:32px;padding:6px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.icon-button svg,.tab svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5}
.ribbon .active{color:var(--accent);background:#38303f}
.ribbon .bottom{margin-top:auto}
.explorer{width:255px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.workspace.folder .explorer{width:285px}
.noexp .explorer,.noinsp .inspector,.noinsp #vsplit{display:none}
.pane-title{height:43px;padding:10px 16px;border-bottom:1px solid var(--line);font-weight:500;display:flex;align-items:center;gap:8px;flex:none}
.pane-title .hint{margin-left:auto}
.search-box{margin:14px 12px 6px}
#search{width:100%;padding:6px 10px;background:var(--bg);border:1px solid var(--line);border-radius:5px}
#search::placeholder{color:var(--muted)}
.explorer-scroll{overflow:auto;padding:4px 10px 16px;flex:1}
.section-title{font-size:12px;letter-spacing:.6px;color:var(--muted);margin:20px 8px 8px;font-weight:600}
.vault-name{padding:8px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-tree details{margin-left:10px} .file-tree>details{margin-left:0}
.file-tree summary{cursor:pointer;color:#bdbdbd;padding:3px 4px;overflow-wrap:anywhere}
.file{border:0;background:transparent;display:flex;align-items:center;gap:7px;width:100%;text-align:left;padding:4px 8px;color:#bcbcbc;border-radius:4px}
.file span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-icon{display:inline-flex;align-items:center;justify-content:center;flex:none;width:20px;height:20px}
.file-icon svg{display:block;width:18px;height:18px}
.file:hover,.file.hov{background:var(--chip)}
.file.selected{background:var(--accsoft);color:#d4bfff}
#legend .item{display:flex;width:100%;gap:8px;align-items:center;text-align:left;padding:5px 8px;border:0;background:transparent;border-radius:4px}
#legend .item:hover{background:var(--chip)} #legend .item.on{background:var(--accsoft);color:#e1d3ff}
#legend .item .hint{margin-left:auto}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.wantfile .callout:not(.ready){animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #b49af400}50%{box-shadow:0 0 0 3px #b49af455}}

main{flex:1;min-width:0;display:flex;flex-direction:column}
.tabbar{height:43px;background:var(--rail);display:flex;padding:5px 8px 0;gap:4px;border-bottom:1px solid var(--line);flex:none}
.tab{display:flex;align-items:center;gap:9px;padding:6px 16px;min-width:165px;max-width:360px;border:1px solid var(--line);border-bottom:0;background:var(--bg);border-radius:7px 7px 0 0;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab svg{color:var(--accent)} .tab .file-icon svg{width:16px;height:16px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:8px 20px;border-bottom:1px solid #2b2b2b;flex:none}
.breadcrumb{color:var(--muted);font-size:13px} .breadcrumb strong{color:var(--text);font-weight:500}
.view-mode{display:inline-flex;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--rail)}
.view-mode button{border:0;background:transparent;padding:3px 10px;color:var(--muted)}
.view-mode button[aria-pressed="true"]{background:#493b65;color:#e1d3ff}
#graphwrap{flex:1;min-height:160px;position:relative}
#net{position:absolute;inset:0}
#groupgraph{position:absolute;inset:0;overflow:hidden;cursor:grab}
#groupgraph.drag{cursor:grabbing}
#net[hidden],#groupgraph[hidden]{display:none}
#groupScene{position:absolute;left:0;top:0;transform-origin:0 0}
#groupLinks{position:absolute;left:0;top:0;overflow:visible}
.graph-caption{position:absolute;left:22px;top:16px;pointer-events:none;color:var(--muted);font-size:12px}
.graph-caption strong{display:block;font-size:16px;color:#cecece;font-weight:500;margin-bottom:2px}
.tools{display:flex;align-items:center;gap:8px}
.graph-options{position:relative}
.graph-options summary{cursor:pointer;padding:5px 10px;color:var(--muted);list-style:none;border-radius:5px} .graph-options summary:hover{color:var(--text);background:var(--chip)}
.graph-options summary::-webkit-details-marker{display:none} .graph-options summary:before{content:"▸ ";font-size:11px} .graph-options[open] summary:before{content:"▾ "}
.options-panel{position:absolute;right:0;top:36px;width:200px;background:var(--panel);padding:10px 12px;border:1px solid var(--line);border-radius:7px;z-index:5;box-shadow:0 8px 24px #0006}
.options-panel label{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer}
input[type=checkbox]{accent-color:#a88be5}
.group-row{display:flex;align-items:center;gap:5px}
.group-row .item{min-width:0;flex:1}
.group-row.off .item{opacity:.55}
.visibility-switch{position:relative;flex:none;width:30px;height:18px;padding:0;border:1px solid #65616b;border-radius:12px;background:#4a474f;margin-right:4px}
.visibility-switch::after{content:"";position:absolute;width:12px;height:12px;left:2px;top:2px;border-radius:50%;background:#e6e3eb}
.visibility-switch[aria-checked="true"]{background:#8060bd;border-color:#a88be5}
.visibility-switch[aria-checked="true"]::after{left:14px;background:#fff}
.visibility-switch:hover{border-color:var(--accent)}
.feedback-section{border-top:1px solid var(--line);margin-top:24px}
.fb{font-size:13px;padding:7px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.fb .t{color:var(--muted)}
footer{height:27px;flex:none;display:flex;align-items:center;gap:16px;padding:0 14px;border-top:1px solid var(--line);background:var(--rail);color:var(--muted);font-size:12px}
#sessionStatus{margin-left:auto}
.graph-empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:var(--muted);pointer-events:none}
.graph-empty[hidden]{display:none}
.graph-controls{position:absolute;right:18px;top:16px;display:flex;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:3px}
.graph-controls button{background:transparent;border:0;font-size:18px;min-width:32px;line-height:1.2}
.graph-controls button:last-child{font-size:13px;border-left:1px solid var(--line);border-radius:0 4px 4px 0}
.group-card{position:absolute;width:270px;border:1.5px solid var(--gc);border-radius:9px;background:#26282f;box-shadow:0 4px 14px #0003;overflow:hidden}
.group-card.on,.group-card.focused{box-shadow:0 0 0 3px #b49af44d}
.group-card-header{padding:11px 13px 8px;border-bottom:1px solid #ffffff12;cursor:pointer}
.group-card-header:hover{background:#2d2f37}
.group-card-title{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.group-card-title .dot{background:var(--gc)}
.group-card-header .hint{display:block;margin:3px 0 0 16px}
.group-card-items{padding:7px;max-height:248px;overflow:auto;overscroll-behavior:contain}
.card-file{display:flex;align-items:center;gap:9px;width:100%;padding:4px 8px;border:0;background:transparent;text-align:left;font-size:13.5px;border-radius:4px}
.card-file .badge-ext{display:inline-flex;align-items:center;justify-content:center;flex:none;min-width:38px;height:22px;padding:0 5px;border:1px solid #626262;border-radius:5px;background:#303030;color:#dedede;font:700 11px/1 ui-monospace,Consolas,monospace}
.card-file span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-file.selected{background:#493b65;color:#e1d3ff}
.group-connection{cursor:pointer}
.group-connection .cl{fill:none;stroke:#80798d;opacity:.7}
.group-connection .ch{fill:none;stroke:transparent;stroke-width:18}
.group-connection:hover .cl,.group-connection.on .cl{stroke:var(--accent);opacity:1}
.group-connection rect{fill:#302c38;stroke:#665d76}
.group-connection text{fill:#e0d7eb;font:13px "Segoe UI","Malgun Gothic",sans-serif;text-anchor:middle;dominant-baseline:central}

/* folder-only viewer */
#viewer{position:absolute;inset:0;overflow:auto;padding:28px 36px var(--cardh,280px)}
#viewer h2{font-size:18px;font-weight:600;margin:0 0 4px}

/* inspector */
#vsplit{width:5px;flex:none;cursor:col-resize;background:var(--line);border-left:1px solid var(--rail)}
#vsplit:hover,#vsplit.drag{background:#5b4b7c}
.inspector{width:var(--dw,400px);flex:none;background:var(--panel);display:flex;flex-direction:column;min-height:0}
.inspector-scroll{overflow:auto;padding:20px 20px var(--cardh,240px);flex:1}
.inspector h2{font-size:18px;font-weight:600;margin:0 0 6px;overflow-wrap:anywhere}
.inspector h3{font-size:13px;font-weight:600;margin:22px 0 8px;color:var(--sub)}
.empty-state{padding:24px 0 10px}
.empty-symbol{color:var(--accent);font-size:30px;margin-bottom:16px}
.empty-state p{color:var(--muted)}
.path{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.badge{display:inline-block;font-size:12px;padding:2px 7px;border-radius:4px;background:var(--chip)}
.badge.direct{background:#483c62;color:#d9c6ff}
.badge.removed{background:#573439;color:#ffb6bd}
.badge.prop{background:var(--warnsoft);color:var(--warn)}
.badge.user{background:#304b3c;color:#a4ddbe}
.inspector-scroll>#detail{min-height:40%}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
blockquote{margin:6px 0 14px;padding:8px 12px;border-left:2px solid #77629d;background:#222;font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere;font-family:ui-monospace,Consolas,monospace;color:#cfcfcf}
.edge-link{cursor:pointer;display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:7px 0;font-size:13px;border-radius:0;overflow-wrap:anywhere}
.edge-link:hover{color:var(--accent);background:transparent}
.edge-link .file-icon{align-self:center}
.edge-link .hint{font-size:12px}
.explain{font-size:14.5px;line-height:1.7;margin:0}
.back{display:inline-block;font-size:12px;color:var(--muted);cursor:pointer;margin-bottom:12px} .back:hover{color:var(--accent)}
.propbar{margin:-20px -20px 16px;padding:10px 20px;background:var(--warnsoft);color:var(--warn);font-size:12px;font-weight:600;border-bottom:1px solid #6b5230}
.fixrow{border-top:1px solid var(--line);margin-top:22px;padding-top:4px}

/* file contents */
.doc{font-size:14px;line-height:1.75}
.doc h1{font-size:19px;margin:4px 0 12px} .doc h2{font-size:16px;margin:20px 0 8px} .doc h3{font-size:14.5px;margin:16px 0 6px;color:var(--text)}
.doc table{border-collapse:collapse;margin:8px 0;font-size:13px} .doc td,.doc th{border:1px solid var(--line);padding:4px 8px}
.doc code{font:12.5px ui-monospace,Consolas,monospace;color:#bba6db;background:#202020;padding:1px 4px;border-radius:3px}
.doc pre{background:#202020;padding:10px 12px;border-radius:5px;overflow:auto;border:1px solid var(--line)} .doc pre code{background:none;padding:0;color:inherit}
.doc blockquote{font-family:inherit;background:none}
.doc a{color:var(--accent)}
.code{margin:0;border-radius:5px;overflow:auto;font:12.5px/1.6 ui-monospace,Consolas,monospace;border:1px solid var(--line);background:#202020}
.code code{display:block;padding:10px 12px;white-space:pre;background:none!important}
.csv{border-collapse:collapse;font-size:12.5px} .csv td,.csv th{border:1px solid var(--line);padding:3px 8px} .csv th{background:#202020}
.cell{margin:10px 0} .cell .ctag{font-size:11px;color:var(--muted);margin-bottom:2px}
.pdf{width:100%;height:calc(100vh - 250px - var(--cardh,0px));min-height:300px;border:1px solid var(--line);border-radius:5px;background:#fff}
img.shot{max-width:100%;border-radius:5px;border:1px solid var(--line);background:#fff}

/* question / task bar under the graph */
#bottom{flex:none;border-top:1px solid var(--line);background:var(--panel);max-height:46%;display:flex;flex-direction:column}
.bhead{display:flex;align-items:center;gap:12px;height:36px;padding:0 20px;cursor:pointer;user-select:none;flex:none;border-bottom:1px solid var(--line);background:var(--rail)}
.bhead:hover .fold{color:var(--text)}
.bhead .lbl{font-size:13px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:8px}
.bhead .lbl:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)} .practice-b .bhead .lbl:before{background:var(--warn)}
.bhead .mini{flex:1;min-width:0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0}
#bottom.min .mini{opacity:1}
.bhead .fold{color:var(--muted);font-size:12px;margin-left:auto}
#bottom.min #sidebody{display:none} #bottom.min .bhead{border-bottom:0}
#sidebody{overflow:auto}
.sidebox,.qwrap{padding:14px 20px}
.sidebox h3{margin:0 0 4px;font-size:14px;font-weight:600}
.sidebox p{margin:0;color:var(--muted);font-size:13px}
.qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.qhead .lbl{display:none}
.qtext{font-size:16px;font-weight:500;line-height:1.5;margin-bottom:10px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{text-align:left;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);display:flex;gap:10px;align-items:center}
.opt:hover{border-color:#8062ba;background:#2a2730}
.opt.on{background:#493b65;border-color:#8062ba;color:#e1d3ff}
.opt .k{font:600 11px ui-monospace,Consolas,monospace;color:var(--muted);width:12px} .opt.on .k{color:#e1d3ff}
.callout{border:1px solid #5b4b7c;background:#2b2635;border-radius:6px;padding:10px 14px}
.callout .big{font-size:14px;font-weight:600;color:#d4bfff}
.callout .sm{font-size:12.5px;color:var(--muted);margin-top:2px}
.callout.ready{border-color:#3f6a55;background:var(--oksoft)} .callout.ready .big{color:var(--ok)}
.pickbtn{width:100%;margin-top:8px;padding:8px 14px}
.steps{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.steps li{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;color:var(--muted)}
.steps .n{flex:0 0 20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:1px solid var(--line2)}
.steps li.now{color:var(--text);border-color:#6b5230} .steps li.now .n{background:var(--warn);border-color:var(--warn);color:#1e1e1e}
.steps li.ok{color:var(--ok)} .steps li.ok .n{background:var(--oksoft);border-color:var(--ok)}
.locked{padding:0 20px 14px;color:var(--muted);font-size:13px}
.empty{padding:14px 20px;color:var(--muted);font-size:13px}
.suggest{padding:14px 20px;background:var(--warnsoft)}
.suggest .h{font-size:12px;font-weight:600;color:var(--warn)}
.suggest .q{font-size:15px;font-weight:500;margin:6px 0 2px}
.actions{display:flex;gap:8px;align-items:center}
.marks{font-size:13px;letter-spacing:4px;color:var(--muted)}
.list .row2{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:13px;cursor:pointer} .list .row2:hover{color:var(--accent)}
.sidefoot{padding:0 20px 14px}

/* briefing */
.brief{position:fixed;inset:0;z-index:50;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px}
.brief .card{max-width:640px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:28px 30px;box-shadow:0 20px 60px #0008}
.brief .k{font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.6px}
.brief h2{font-size:21px;font-weight:600;margin:4px 0 10px}
.brief p{color:var(--sub);margin:0 0 12px}
.brief ul{margin:0;padding-left:18px;color:var(--sub)} .brief li{margin:5px 0}
.brief .foot{display:flex;align-items:center;justify-content:space-between;margin-top:20px}
.legend3{display:grid;grid-template-columns:30px 1fr 30px 1fr;gap:8px 10px;align-items:center;font-size:13px;color:var(--sub);margin:6px 0 16px;padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:6px}

/* intro / survey / end pages */
.page{flex:1;overflow:auto;display:flex;justify-content:center;padding:52px 20px}
.paper{max-width:640px;width:100%}
.paper h2{font-size:22px;font-weight:600;margin:0 0 8px}
.paper>p{color:var(--muted);margin:0 0 20px}
.box{border-top:1px solid var(--line);padding:20px 0}
.box .lbl{display:block;font-size:12px;letter-spacing:.6px;color:var(--muted);font-weight:600;margin-bottom:6px}
.box ol{margin:6px 0 0;padding-left:20px;color:var(--sub)} .box li{margin:3px 0}
.check{display:flex;gap:8px;align-items:flex-start;margin:6px 0} .check input{accent-color:#a88be5;margin-top:5px}

const FD={"mock_sleep_grades": {"name": "stat_hw_sleep", "intro": {"who": "통계 수업 팀 과제 폴더입니다. 대학생의 수면 시간, 아르바이트 시간과 성적의 관계를 분석해 보고서를 냈습니다.", "dirs": [["data", "설문 원자료, 정제한 데이터, 변수 설명"], ["src", "데이터 정제 코드"], ["notebooks", "분석 노트북"], ["report", "최종 보고서와 그림"], ["assignment", "과제 명세"], ["references", "선행 연구 노트"], ["notes", "팀 회의록, TA 피드백"], ["README.md", "과제 소개"], ["misc", "과제와 상관없는 파일"]], "flow": ["데이터 (data)", "정제 코드 (src)", "분석 노트북 (notebooks)", "보고서 (report)"]}, "files": ["README.md", "assignment/project_spec.pdf", "references/notes_han2024_sleep_parttime_grades.md", "report/figures/predicted_vs_actual_grade.png", "report/figures/sleep_vs_grade_scatter.png", "report/final_report.md", "data/clean_student_sleep_survey_2026.csv", "data/codebook.md", "data/raw_student_sleep_survey_2026.csv", "src/clean_data.py", "src/features.py", "notebooks/01_eda.ipynb", "notebooks/02_model.ipynb", "notes/ta_feedback.md", "notes/team_meeting.md", "misc/hw1_solution.py", "notes/personal_schedule.md"], "groups": [["보고서와 그림", [0, 1, 2, 3, 4, 5]], ["데이터 및 코드북", [6, 7, 8]], ["데이터 정제·피처 코드", [9, 10]], ["분석 노트북", [11, 12]], ["회의·피드백 노트", [13, 14]], ["관련 없음", [15, 16]]], "sum": ["팀 과제 소개: 연구 질문(수면·아르바이트 시간과 성적), 실행 방법", "과목 과제 명세 (보고서 6개 절, 채점 기준)", "같은 질문을 다룬 선행 연구 읽기 노트", "예측 성적 vs 실제 성적 그림", "수면 시간 vs 성적 산점도", "최종 보고서 (데이터 정제, 상관, 회귀 결과)", "정제한 설문 데이터 (28행)", "원자료 설문 변수 설명", "원자료 설문 데이터 (32행)", "원자료를 정제해 clean 파일을 만드는 코드", "회귀에 쓸 변수 행렬을 만드는 코드", "탐색적 분석 노트북 (상관, 산점도)", "선형 회귀 모델 노트북", "TA의 보고서 초안 피드백", "팀 회의록: 역할 분담과 분석 방향 결정", "다른 과목 숙제 풀이 (과제와 무관)", "개인 주간 시간표 (과제와 무관)"], "gdesc": ["과제의 결과물: 과제 명세, 최종 보고서와 그림, 참고 문헌 노트", "설문 원자료와 정제한 데이터, 변수 설명서", "원자료를 정제하고 회귀용 변수를 만드는 코드", "탐색 분석과 회귀 모델 노트북", "팀 회의록과 TA 피드백", "과제와 상관없는 파일"], "content": [{"kind": "text", "ext": "md", "data": "# SleepWork-Grade\n\nTeam project for **STAT2101 Introduction to Data Analysis**, Fall 2026, Hanbit University.\nInstructor: Prof. Yoon Seong-min (윤성민). TA: Jung Da-eun (정다은).\n\n## Research question\n\nDo weeknight sleep duration and weekly part-time work hours predict the final STAT2101 grade?\n\n## Data\n\nThe data come from an online survey of STAT2101 students, open from 2026-09-21 to 2026-10-02.\nThe raw export has 32 rows (student_id S001 to S032). After cleaning, **28 rows** remain.\n**4 rows were dropped**:\n\n- S014 appeared twice (duplicate removed)\n- S027 reported 25 hours of sleep (out of the valid 3-12 range)\n- S022 has no course grade\n- S030 has \"abc\" as the course grade\n\nValues that were repaired rather than dropped:\n\n- S003 sleep \"7h\" was read as 7.0 hours\n- S017 sleep \"six and half\" was read as 6.5 hours\n- S005 missing work_hours was imputed with the median (10.0)\n- S011 study_hours \"N/A\" was imputed with the median (8.0)\n\nColumns (same in raw and clean data):\n\n| column | meaning |\n|---|---|\n| student_id | S001 to S032 |\n| gender | F / M |\n| year | academic year, 1-4 |\n| sleep_hours | average weeknight sleep (hours, valid 3-12) |\n| work_hours | part-time work hours per week (valid 0-40) |\n| study_hours | self-study hours per week (valid 0-30) |\n| caffeine_cups | cups of coffee/tea per day (0-8) |\n| course_grade | final STAT2101 score (0-100) |\n\n## Method\n\n1. Descriptive statistics and Pearson correlations with `course_grade`.\n2. Ordinary least squares linear regression (scikit-learn `LinearRegression`) with\n   `sleep_hours`, `work_hours` and `study_hours` as predictors.\n3. Evaluation by leave-one-out cross-validation (LOO-CV), reporting RMSE and R2.\n   Random seed is 2026.\n\nHeadline numbers (clean data, n = 28):\n\n- Correlation with grade: sleep_hours r = 0.46, work_hours r = -0.38, study_hours r = 0.44\n- LOO-CV RMSE = 6.42, R2 = 0.41 (mean-only baseline RMSE = 9.97)\n\n## Repository layout\n\n```\nREADME.md          this file\ndata/              raw survey export and cleaned dataset\nsrc/               cleaning script and feature functions\nnotebooks/         exploratory analysis and model notebooks\nreport/            final_report.md and report/figures/\n```\n\n## How to reproduce\n\nRequires Python 3.11.\n\n```bash\ngit clone <repo-url> SleepWork-Grade\ncd SleepWork-Grade\npip install pandas numpy scikit-learn matplotlib jupyter\npython src/clean_data.py\njupyter notebook notebooks/\n```\n\nThen:\n\n1. Run the EDA notebook first. It prints `describe()` and the correlation matrix and saves the scatter figure to `report/figures/`.\n2. Run the modelling notebook second. It fits the linear model, runs LOO-CV, and saves the predicted-vs-actual figure.\n3. Read `report/final_report.md`. It uses the figures from `report/figures/`.\n\n`python src/clean_data.py` reads the raw survey file in `data/` and writes the cleaned dataset back to `data/`.\nRun all cells from top to bottom so that the seed (2026) is applied.\n\n## Team\n\n- Kim Min-jun (김민준): team lead, data cleaning\n- Lee Seo-yeon (이서연): feature engineering in `src/`\n- Park Ji-ho (박지호): EDA notebook and figures\n- Choi Yuna (최유나): final report\n\n## Deadline\n\nSubmission via LMS by **2026-12-05 23:59**, as a zip of this repository.\n\n## Limitations\n\nThe sample is small (n = 28, one course), sleep is self-reported, and the analysis shows\nassociation rather than causation. Two values were median-imputed and the model has no\ninteraction terms. See Section 6 of the report for details.\n"}, {"kind": "pdf", "data": "JVBERi0xLjcKJcK1wrYKJSBXcml0dGVuIGJ5IE11UERGIDEuMjguNgoKMSAwIG9iago8PC9UeXBlL0NhdGFsb2cvUGFnZXMgMiAwIFIvSW5mbzw8L1Byb2R1Y2VyKE11UERGIDEuMjguNik+Pj4+CmVuZG9iagoKMiAwIG9iago8PC9UeXBlL1BhZ2VzL0NvdW50IDIvS2lkc1s0IDAgUiAzMSAwIFJdPj4KZW5kb2JqCgozIDAgb2JqCjw8L0ZvbnQ8PC9oZWJvIDUgMCBSL2hlbHYgOCAwIFIvY291ciAyMiAwIFI+Pj4+CmVuZG9iagoKNCAwIG9iago8PC9UeXBlL1BhZ2UvTWVkaWFCb3hbMCAwIDU5NSA4NDJdL1JvdGF0ZSAwL1Jlc291cmNlcyAzIDAgUi9QYXJlbnQgMiAwIFIvQ29udGVudHNbNiAwIFIgNyAwIFIgOSAwIFIgMTAgMCBSIDExIDAgUiAxMiAwIFIgMTMgMCBSIDE0IDAgUiAxNSAwIFIgMTYgMCBSIDE3IDAgUiAxOCAwIFIgMTkgMCBSIDIwIDAgUiAyMSAwIFIgMjMgMCBSIDI0IDAgUiAyNSAwIFIgMjYgMCBSIDI by recall or social desirability.\n\n## Methods\n\n- Pearson correlations between sleep, work and grade.\n- A linear regression of grade on sleep and work hours, with a single fit on the full sample.\n- Comparison of mean grades between students who worked over 15 hours per week and those who did not.\n- No cross-validation was reported. Fit quality is given as in-sample R2.\n\n## Key findings\n\n- Sleep and grade: r = 0.31, a weak to moderate positive association.\n- Working over 15 hours per week was linked to a grade about 3.2 points lower on the GPA-scaled grade.\n- The linear model reached R2 = 0.18.\n- The direction of both effects matches the expected pattern: more sleep goes with higher grades, and heavier work goes with lower grades.\n\n## Discussion points from the authors\n\n- Heavy part-time work seems to squeeze out sleep, and the two effects may overlap rather than add up. The authors did not fit interaction terms.\n- Effects were similar across the three universities, which the authors read as some evidence of generalisability within the country.\n- They suggest universities consider work-hour guidance for first-year students.\n\n## Limitations stated by the authors\n\n- Cross-sectional design, so no causal direction can be inferred.\n- Self-reported sleep and work hours.\n- Grade scale harmonised across campuses, which may hide differences in grading practice.\n- The authors did not report a validation split or out-of-sample error.\n\n## Comparison notes for our project\n\n- Our sleep-grade correlation is r = 0.46 (n = 28). That is stronger than their r = 0.31, but with only 28 students the 95% CI is wide, roughly 0.10 to 0.71. The two estimates are compatible with each other.\n- Both studies find the same direction for sleep and for work hours. Our work-hours correlation is r = -0.38.\n- Their linear model explains R2 = 0.18 in-sample. Our model reaches R2 = 0.41 under leave-one-out cross-validation, which is a stricter test, so the two R2 values should not be read as a direct ranking.\n- Their 15-hour threshold for heavy work is the same cutoff we use for the work_heavy indicator. Our heavy-work group (9 of 28 students) has a mean grade of 69.1 against 76.9 for the others.\n- Their study is far larger and covers three campuses. Ours covers one course at one university, so their results are the better guide to the wider population.\n- Both studies rely on self-reported sleep, so the same measurement caveat applies to both.\n\n## Open questions\n\n- Would the sleep effect survive adjustment for study hours? Our model suggests it does, but the prior study did not include study time.\n- Does the 15-hour threshold matter more than total work hours? We have not tested this with enough data.\n"}, {"kind": "image", "data": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABEwAAAKhCAIAAADFaayLAAAACXBIWXMAABDrAAAQ6wFQlOh8AAAs3UlEQVR4nO3dCZTf873/8ViCLKKx1FJuCSrWWkvt1da+VOvaqyW111L7XutFpaq20oRyubepttZEiyT2EBERWzUSEUtISDAEN8r83//5nH7P786Wn+jNZN4ej/M8PTPf/OY33/nN9Jzvy8z8pksjAABAIl06+gQAAAD+lYwcAAAgFSMHAABIxcgBAABSMXIAAIBUjBwAACAVIwcAAEjFyAEAAFIxcgAAgFSMHAAAIBUjBwAASMXIAQAAUjFyAACAVIwcAAAgFSMHAABIxcgBAABSMXIAAIBUjBwAACAVIwcAAEjFyAEAAFIxcgAAgFSMHAAAIBUjBwAASMXIAQAAUjFyAACAVIwcAAAgFSMHAABIxcgBAABSMXIAAIBUOmDk3HLLLYc1GThwYDs3O//888vNJk+ePMfOrRMZPXp0eXyuvfba+t+q0z2qDQ0N5YRPOumkcmTs2LH1fP38n5q9B/+LptN9sQEAaXTAyDnmmGO6NPn+97/fzs3WWmutcrOnn356jp1bJ/L73/++PD677757/W/V6R7V119/vZzwl7/85XIkRnI9Xz/NTJky5TdNbr311s9/VrP34M9thgwZUh6TV1999f/i/jvdFxsAkIaR01kZOZ9p5DzyyCPlrTbeeOPPf1Y5Rs7WW29dPop77rnn/+L+O90XGwCQxtw7ct56663Xm3z88cdz7Nw6kS/syPnoo4/KF8bbb79d//0YOS0ZOQBAVnPvyLn44ouPaRKXs+XIWWedVY40NDSMHDny9NNP32WXXQ455JC777675ZvfdtttJ5xwwk477dSvX78bbrih5VKKS+Rf/vKXBxxwwPbbb7/vvvvGnU+aNKn616lTp5b3deGFF8arcRW41157DR48uNVTPfHEE8uN4+WbbrrpoIMO2nPPPS+77LJ33nknjowfP/7cc8/ddddd4339+c9/bvnmEyZM+NWvfrX//vvHbU499dQ77rij1ffy5JNPnnHGGXGb00477ZlnnmnrOnvUqFHx7n7wgx/svffe/fv3nz59eu2/tnrd+cYbb7zSZMaMGa2+608++aR8gMcff3y8Gg/4kUceGR/jFVdcEW9be8sbb7yx3HLMmDHxCMfnaJ999q xsAEFCIHOCCycLuww8/bPCwYxpZ/x06dGjz5s3e1ZtXbm7uxx9/vHfvXm/GaMtEWSKfOHFCaqFFfpWh3K/cVFJSUp0++e6772RVLQv6pq8unZCQkCCXbGKY5cuX6z+uyc/Pl3uURy3NIHe6e/du/X7qDSotLZWLyYK1sd9oqfnmm29kEu2TGbvdLs9eTk5ORUWFzWbLzs7etm1bUVHRunXrpI70v7nl22+/lWv94AxNu6DXUYU8FfLQjh07Jk+7vKlkpT569OgfvJY8fHkf1t9jqtq3b1G5Ef33A89Ta7xF5cFeffXVcpsXOgwAwHqIHMBg3hVknfNl6V/UCO/Blw109uzZa6+9VvuGle9t3br1oosu0naFl7X4Aw88MGHCBEMmaRERERF9+vTRjo5QUFDQs2fP+r/i00CNvUWra96lY8aM0faoMVxMTMzIkSONngIAYApEDmCwxlaQU6ZMeaQR2qGoDPf3v/9d/9tdfMnj8Tz55JPal50kCQYNGpSZmWnIJC3i9OnTQUFBnTt3HjJkSJcuXX7961+batf5JiKnrKyswY+SfE/eEgMGDNAfAg4AEMiIHMBgJSUlcXFxjX2tyOS0X29ilO+++27r1q3Hjh1rcK8h/yJr9C+//HLbtm0/+E0t3/OLt2hlZaXEmNFTAADMgsgBAAAAYClEDgAAAABLIXIAAAAAWAqRAwAAAMBSiBwAAAAAlkLkAAAAALAUIgcAAACApRA5AAAAACyFyAEAAABgKUQOAAAAAEshcgAAAABYCpEDAAAAwFKIHAAAAACWQuQAAAAAsBQiBwAAAIClEDkAAAAALIXIAQAAAGApRA4AAAAASyFyAAAAAFgKkQMAAADAUogcAAAAAJZC5AAAAACwFCIHAAAAgKUQOQAAAAAshcgBAAAAYClEDgAAAABLIXIAAAAAWAqRAwAAAMBSiBwAAAAAlkLkAAAAALCU/wVEhbeCtuMzGQAAAABJRU5ErkJggg=="}, {"kind": "text", "ext": "md", "data": "# Sleep, Part-time Work and Course Grades: A Student Survey\n\nSTAT2101 Introduction to Data Analysis, Fall 2026, Hanbit University\nInstructor: Prof. Yoon Seong-min | Team: Kim Min-jun (team lead, data cleaning), Lee Seo-yeon (feature engineering), Park Ji-ho (EDA and figures), Choi Yuna (report)\n\n## 1. Question\n\nDo weeknight sleep duration and weekly part-time work hours predict the final STAT2101 grade? As a secondary question, we check whether self-study time adds predictive value once sleep and work are known.\n\n## 2. Data\n\nWe used an online survey of STAT2101 students open from 2026-09-21 to 2026-10-02. The raw export has 32 rows and seven variables: student_id (S001 to S032), gender, year (academic year, 1 to 4), sleep_hours (average weeknight sleep, valid 3 to 12), work_hours (part-time hours per week, valid 0 to 40), study_hours (self-study hours per week, valid 0 to 30), caffeine_cups (cups per day, 0 to 8), and course_grade (final STAT2101 score, 0 to 100).\n\nCleaning removed 4 rows, which leaves 28 clean rows:\n\n- 1 duplicate row (S014 appeared twice; one copy was kept).\n- 3 invalid rows: S022 had no course_grade, S027 reported sleep_hours of 25 (outside the valid range), and S030 had the text \"abc\" as course_grade.\n\nTwo free-text sleep entries were converted to numbers: S003 \"7h\" became 7.0 and S017 \"six and half\" became 6.5. Two values were imputed with the column median: S005 work_hours (10.0) and S011 study_hours (8.0). The cleaned file has the same eight columns, correct data types, and no missing values.\n\nNumbers from an earlier draft (r = 0.52 and training RMSE 5.88) were computed before these fixes, when the duplicate was kept and S027 was not removed. They are superseded by the values in this report.\n\n**Table 1. Descriptive statistics (clean data, n = 28)**\n\n| Variable | Mean | SD |\n|---|---|---|\n| sleep_hours | 6.8 | 0.9 |\n| work_hours | 11.4 | 8.3 |\n| study_hours | 8.6 | 3.9 |\n| course_grade | 74.3 | 9.8 |\n\n## 3. Methods\n\n**Cleaning.** The cleaning script uses three functions: parse_hours() converts text durations, drop_invalid() removes duplicate and out-of-range rows, and impute_median() fills the two missing numeric values.\n\n**Features.** The model uses three predictors, sleep_hours, work_hours and study_hours, assembled by build_feature_matrix(). Two derived flags were also tested: sleep_deficit (max(0, 7.0 − sleep_hours)) and work_heavy (1 if work_hours ≥ 15). Neither was kept (see Section 4.3).\n\n**Correlations (A2).** We computed Pearson correlations between each predictor and course_grade, and between sleep_hours and work_hours.\n\n**Model (A3).** We fitted an ordinary least squares linear regression (scikit-learn LinearRegression) with the three predictors. Linear models were chosen over tree models because the sample is small. Performance was estimated with leave-one-out cross-validation (LOO-CV) across all 28 students. The reported RMSE and R2 are computed on the held-out predictions, not on the training data. A baseline that always predicts the mean grade gives the reference RMSE.\n\n**Figures (A4).** Figure 1 is the EDA scatter plot of sleep against grade. Figure 2 plots LOO-CV predictions against actual grades.\n\n**Prior study (A5).** We compare our findings with Han and Oh (2024) in Section 5.\n\n**Reproducibility.** Random seed is 2026. To reproduce, install pandas, numpy, scikit-learn, matplotlib and jupyter under Python 3.11, run the cleaning script in src/ on the raw survey file, then run the EDA notebook and the modeling notebook in order. The report is in report/final_report.md.\n\n## 4. Results\n\n### 4.1 Correlations with course grade\n\n**Table 2. Pearson correlations (n = 28)**\n\n| Pair | r |\n|---|---|\n| sleep_hours with course_grade | 0.46 |\n| study_hours with course_grade | 0.44 |\n| work_hours with course_grade | −0.38 |\n| sleep_hours with work_hours | −0.19 |\n\nSleep and work are only weakly correlated, so each carries its own information. A simple regression of grade on sleep gives a slope of 5.0 grade points per extra hour of sleep.\n\nNine of the 28 students work 15 or more hours per week. Their mean grade is 69.1, compared with 76.9 for the other 19. Eleven students sleep less than 7 hours a night.\n\n![Figure 1. Sleep vs course grade (n = 28), colored by work_heavy](figures/sleep_vs_grade_scatter.png)\n\n*Figure 1. Blue points: under 15 work hours per week. Orange points: 15 or more. The black line is the regression of grade on sleep (slope 5.0).*\n\n### 4.2 Linear model with cross-validation\n\n**Table 3. Model performance (metrics from leave-one-out CV, n = 28)**\n\n| Model | LOO-CV RMSE | LOO-CV R2 |\n|---|---|---|\n| Baseline (predict the mean grade) | 9.97 | — |\n| Linear model: sleep, work, study | 6.42 | 0.41 |\n\nThe model reduces RMSE from 9.97 to 6.42 grade points compared with the mean baseline, and explains about 41% of the variance in held-out grades.\n\n**Table 4. Coefficients of the final model (fitted on all 28 rows, for interpretation only)**\n\n| Term | Coefficient |\n|---|---|\n| Intercept | 41.2 |\n| sleep_hours | +3.1 per hour |\n| work_hours | −0.48 per hour |\n| study_hours | +1.05 per hour |\n\n![Figure 2. Linear model: predicted vs actual grade (LOO-CV), RMSE = 6.42, R2 = 0.41](figures/predicted_vs_actual_grade.png)\n\n*Figure 2. Points close to the dashed 45-degree line are predicted well. The annotation gives the LOO-CV RMSE and R2.*\n\n### 4.3 Feature ablation\n\n**Table 5. Feature sets compared with LOO-CV**\n\n| Feature set | LOO-CV RMSE | LOO-CV R2 |\n|---|---|---|\n| sleep_hours only | 8.74 | 0.21 |\n| sleep_hours + work_hours | 7.71 | 0.32 |\n| sleep_hours + work_hours + study_hours (kept) | 6.42 | 0.41 |\n| above + sleep_deficit + work_heavy | 6.71 | 0.37 |\n\nAdding each predictor lowers the error. The two derived flags made the model worse, so they were dropped.\n\n## 5. Discussion\n\nThe answer to the research question is yes, but the predictive power is moderate. Holding work and study hours fixed, each extra hour of weeknight sleep goes with about 3.1 more grade points. Each extra hour of weekly work goes with about 0.48 fewer points, so 10 more work hours goes with about 4.8 fewer. Study time also adds predictive value. The large group gap (69.1 vs 76.9) suggests that heavy work matters in practice, although the group comparison does not adjust for sleep or study time.\n\nOur results are consistent with Han and Oh (2024), who surveyed 412 students at three universities. They reported a sleep–grade correlation of r = 0.31, and found that working more than 15 hours per week lowered the GPA-scaled grade by 3.2 points. Their linear model reached R2 = 0.18. Our sleep–grade correlation (r = 0.46) is larger than theirs. With only 28 students, however, the 95% confidence interval for our r is roughly 0.10 to 0.71, so the difference between the two studies is not reliable. The direction of both effects agrees: more sleep and less work go with higher grades. Our R2 of 0.41 is not directly comparable with their 0.18, because ours is an out-of-sample LOO-CV estimate on a 0 to 100 score, while their grade is GPA-scaled. Their sample is also much larger.\n\n## 6. Limitations\n\n- **Small sample.** Only 28 students from one course were analysed. Correlations and coefficients are imprecise, and the LOO-CV estimates depend on a few students.\n- **Self-reported data.** Sleep and work hours come from an online survey and may contain recall error. Students may round their sleep hours.\n- **Cleaning choices.** Four rows were dropped, and two values (S005 work_hours and S011 study_hours) were imputed with the median. If the dropped students differ from the rest, the results may be biased.\n- **Cross-sectional design.** The data cannot show causation. Students with weaker grades may also take on more work, so the effect could run in either direction.\n- **Model scope.** We did not test interaction terms (for example sleep × work) or non-linear effects. The thresholds of 7 hours and 15 hours were fixed in advance and not tuned, but other cutoffs could change the derived-flag results.\n- **Single term.** The results describe one course in one semester and may not generalise to other courses.\n"}, {"kind": "text", "ext": "csv", "data": "student_id,gender,year,sleep_hours,work_hours,study_hours,caffeine_cups,course_grade\nS001,F,2,7.5,10,9,2,84\nS002,M,1,6.0,12,6,3,72\nS003,F,3,7.0,20,11,1,76\nS004,M,2,7.0,10,12,1,79\nS005,F,1,6.5,10,7,3,75\nS006,M,4,5.5,18,5,4,58\nS007,F,2,7.2,10,10,2,78\nS008,M,3,7.3,8,9,2,77\nS009,F,1,7.0,16,6,1,68\nS010,M,2,6.2,16,6,3,66\nS011,F,3,5.8,6,8,2,71\nS012,M,1,7.4,8,10,1,81\nS013,F,2,7.1,10,7,2,76\nS014,M,4,7.1,10,13,0,84\nS015,F,3,6.4,22,5,4,62\nS016,M,2,7.2,3,14,1,86\nS017,F,1,6.5,12,8,2,70\nS018,M,3,7.6,8,11,1,82\nS019,F,2,5.9,15,6,3,64\nS020,M,1,7.4,8,9,2,78\nS021,F,4,7.3,16,6,4,76\nS023,M,2,6.1,8,10,2,73\nS024,F,3,7.5,6,12,1,83\nS025,M,1,7.2,9,8,2,75\nS026,F,2,7.0,15,7,3,72\nS028,M,4,5.0,2,9,4,66\nS029,F,3,7.9,18,7,3,80\nS031,M,2,6.3,13,10,2,71\n"}, {"kind": "text", "ext": "md", "data": "# Codebook: Raw Student Sleep Survey 2026\n\n**File:** `data/raw_student_sleep_survey_2026.csv`\n**Source:** Online survey of STAT2101 students, Hanbit University, Fall 2026\n**Collection window:** 2026-09-21 to 2026-10-02\n**Rows:** 32 respondent rows plus one header row\n**Unit of observation:** one student per row, identified by `student_id`\n**Format:** UTF-8, comma-separated, header in the first line. Missing or unparseable entries are kept as they were typed, so some numeric columns contain text.\n\n## Columns\n\n| Column | Type | Valid values | Description |\n|---|---|---|---|\n| student_id | text | S001 to S032 | Anonymous respondent ID assigned when the survey closed |\n| gender | categorical | F, M | Self-reported gender |\n| year | integer | 1 to 4 | Academic year (1 = first year, 4 = fourth year) |\n| sleep_hours | numeric | 3 to 12 | Average weeknight sleep, in hours. Some answers were typed as text (for example \"7h\" or \"six and half\") |\n| work_hours | numeric | 0 to 40 | Part-time work, in hours per week |\n| study_hours | numeric | 0 to 30 | Self-study outside class, in hours per week |\n| caffeine_cups | numeric | 0 to 8 | Average caffeinated drinks per day. Collected but not used in the final model |\n| course_grade | numeric | 0 to 100 | Final STAT2101 score |\n\nThe outcome of interest is `course_grade`. The main predictors are `sleep_hours` and `work_hours`, with `study_hours` as a control.\n\n## Known Problems in the Raw File\n\n| Student | Column | Raw value | Handling in cleaning |\n|---|---|---|---|\n| S003 | sleep_hours | \"7h\" | Converted to 7.0 |\n| S017 | sleep_hours | \"six and half\" | Converted to 6.5 |\n| S005 | work_hours | missing | Imputed with the median (10.0) |\n| S011 | study_hours | \"N/A\" | Imputed with the median (8.0) |\n| S014 | (whole row) | appears twice | One copy dropped as a duplicate |\n| S022 | course_grade | missing | Row dropped |\n| S027 | sleep_hours | 25 | Row dropped (outside valid range 3 to 12) |\n| S030 | course_grade | \"abc\" | Row dropped |\n\n## Cleaning Summary\n\n- Raw rows: 32\n- Rows dropped: 4 (1 duplicate, 3 invalid)\n- Clean rows: 28\n- Values imputed by median: 2 (S005 work_hours, S011 study_hours)\n\nMedian imputation was used only for two cells, so the conclusions should be read with that in mind (see the Limitations section of the report).\n\n## Cleaned Version\n\nThe cleaned dataset has the same eight columns, with the same names and meanings described above. Its numeric columns have the correct types, it has no missing values, and it contains 28 rows. Everything in this codebook applies to the cleaned data as well.\n\n## Notes for Users\n\n- `student_id` is an identifier and should not be used as a predictor.\n- Values are self-reported. Sleep and work hours are estimates from memory, not logged measurements.\n- The survey covers one course in one term. Results should not be generalized to other students without further data.\n- Derived variables (for example, a work-heavy flag or a sleep-deficit score) are not stored in this file. They are computed in the analysis code from the columns above.\n"}, {"kind": "text", "ext": "csv", "data": "student_id,gender,year,sleep_hours,work_hours,study_hours,caffeine_cups,course_grade\nS001,F,2,7.5,6,9,2,81\nS002,M,3,6.0,18,5,3,68\nS003,F,1,7h,8,10,1,79\nS004,M,4,7.0,0,7,2,85\nS005,F,2,6.5,,8,3,72\nS006,M,1,5.5,20,4,4,61\nS007,F,3,8.0,4,12,1,88\nS008,M,2,6.5,12,7,3,70\nS009,F,4,7.2,10,9,2,77\nS010,M,3,5.0,22,3,4,58\nS011,F,1,6.8,6,N/A,2,74\nS012,M,2,7.8,0,11,1,86\nS013,F,3,6.2,16,6,3,66\nS014,M,4,7.4,9,8,2,80\nS014,M,4,7.4,9,8,2,80\nS015,F,2,5.8,14,5,4,64\nS016,M,1,8.5,3,13,1,91\nS017,F,3,six and half,11,8,3,73\nS018,M,4,6.9,12,7,2,71\nS019,F,1,4.5,25,4,5,55\nS020,M,2,7.1,5,10,2,78\nS021,F,3,6.0,18,6,3,62\nS022,M,4,7.3,8,9,2,\nS023,F,1,8.1,2,12,1,89\nS024,M,2,6.4,15,5,3,67\nS025,F,3,7.6,7,10,2,83\nS026,M,4,5.6,20,4,4,60\nS027,F,1,25,9,8,2,76\nS028,M,2,7.0,13,9,2,75\nS029,F,3,6.7,10,7,3,72\nS030,M,4,6.6,6,8,2,abc\nS031,F,2,7.9,3,11,1,84\n"}, {"kind": "text", "ext": "py", "data": "\"\"\"Clean the raw STAT2101 student sleep survey.\n\nRun from the project root:\n    python src/clean_data.py\n\nReads  data/raw_student_sleep_survey_2026.csv\nWrites data/clean_student_sleep_survey_2026.csv\n\nSteps:\n  1. parse messy numeric text (\"7h\", \"six and half\", \"N/A\", \"abc\")\n  2. drop invalid rows (missing or out-of-range grade/sleep, etc.)\n  3. drop duplicate student_id rows, keeping the first valid one\n  4. impute missing work_hours and study_hours with the column median\n\"\"\"\n\nRAW_PATH = \"data/raw_student_sleep_survey_2026.csv\"\nCLEAN_PATH = \"data/clean_student_sleep_survey_2026.csv\"\n\nCOLUMNS = [\"student_id\", \"gender\", \"year\", \"sleep_hours\", \"work_hours\",\n           \"study_hours\", \"caffeine_cups\", \"course_grade\"]\nNUMERIC = COLUMNS[2:]\nVALID_RANGE = {\n    \"year\": (1, 4),\n    \"sleep_hours\": (3, 12),\n    \"work_hours\": (0, 40),\n    \"study_hours\": (0, 30),\n    \"caffeine_cups\": (0, 8),\n    \"course_grade\": (0, 100),\n}\nIMPUTE_COLUMNS = [\"work_hours\", \"study_hours\"]\nNUMBER_WORDS = {\"three\": 3, \"four\": 4, \"five\": 5, \"six\": 6, \"seven\": 7,\n                \"eight\": 8, \"nine\": 9, \"ten\": 10, \"eleven\": 11, \"twelve\": 12}\n\n\ndef parse_hours(raw):\n    \"\"\"Turn messy numeric text into a float, or None if missing or unreadable.\"\"\"\n    text = raw.strip().lower()\n    if text in (\"\", \"na\", \"n/a\", \"nan\"):\n        return None\n    if text.endswith(\"h\"):\n        text = text[:-1].strip()\n    if text.endswith(\" and half\"):\n        base = text[:-len(\" and half\")].strip()\n        return NUMBER_WORDS[base] + 0.5 if base in NUMBER_WORDS else None\n    try:\n        return float(text)\n    except ValueError:\n        return None\n\n\ndef read_rows(path):\n    \"\"\"Read the raw CSV into a list of dicts with parsed numeric fields.\"\"\"\n    with open(path, encoding=\"utf-8\") as handle:\n        lines = [line.strip() for line in handle if line.strip()]\n    header = [name.strip() for name in lines[0].split(\",\")]\n    rows = []\n    for line in lines[1:]:\n        raw = dict(zip(header, [field.strip() for field in line.split(\",\")]))\n        row = {\"student_id\": raw.get(\"student_id\", \"\"), \"gender\": raw.get(\"gender\", \"\")}\n        for column in NUMERIC:\n            row[column] = parse_hours(raw.get(column, \"\"))\n        rows.append(row)\n    return rows\n\n\ndef is_valid(row):\n    \"\"\"A row is valid when every value is inside its range. Missing imputed columns are allowed.\"\"\"\n    for column, (low, high) in VALID_RANGE.items():\n        value = row[column]\n        if value is None:\n            if column in IMPUTE_COLUMNS:\n                continue\n            return False\n        if not low <= value <= high:\n            return False\n    return True\n\n\ndef drop_invalid(rows):\n    \"\"\"Keep the first valid row for each student_id.\"\"\"\n    kept, seen = [], set()\n    for row in rows:\n        if row[\"student_id\"] in seen or not is_valid(row):\n            continue\n        seen.add(row[\"student_id\"])\n        kept.append(row)\n    return kept\n\n\ndef median(values):\n    ordered = sorted(values)\n    mid = len(ordered) // 2\n    if len(ordered) % 2:\n        return ordered[mid]\n    return (ordered[mid - 1] + ordered[mid]) / 2\n\n\ndef impute_median(rows, column):\n    \"\"\"Fill missing values in one column with the median of the observed values.\"\"\"\n    observed = [row[column] for row in rows if row[column] is not None]\n    fill = median(observed)\n    count = 0\n    for row in rows:\n        if row[column] is None:\n            row[column] = fill\n            count += 1\n    return fill, count\n\n\ndef format_value(column, value):\n    if column in (\"year\", \"caffeine_cups\"):\n        return str(int(value))\n    return f\"{value:.1f}\"\n\n\ndef write_rows(path, rows):\n    with open(path, \"w\", encoding=\"utf-8\") as handle:\n        handle.write(\",\".join(COLUMNS) + \"\\n\")\n        for row in rows:\n            fields = [row[\"student_id\"], row[\"gender\"]]\n            fields += [format_value(column, row[column]) for column in NUMERIC]\n            handle.write(\",\".join(fields) + \"\\n\")\n\n\ndef main():\n    rows = read_rows(RAW_PATH)\n    print(f\"Raw rows read: {len(rows)}\")\n\n    clean = drop_invalid(rows)\n    print(f\"Rows kept after removing duplicates and invalid values: {len(clean)}\")\n    print(f\"Rows dropped: {len(rows) - len(clean)}\")\n\n    for column in IMPUTE_COLUMNS:\n        fill, count = impute_median(clean, column)\n        print(f\"Imputed {count} missing {column} value(s) with median {fill:.1f}\")\n\n    assert all(row[column] is not None for row in clean for column in NUMERIC)\n    write_rows(CLEAN_PATH, clean)\n    print(f\"Wrote {len(clean)} rows to {CLEAN_PATH}\")\n\n\nif __name__ == \"__main__\":\n    main()\n"}, {"kind": "text", "ext": "py", "data": "\"\"\"Feature engineering for the SleepWork-Grade project.\n\nOwner: Lee Seo-yeon (feature engineering).\n\nTeam decisions from the 2026-11-03 meeting that shape this module:\n- Plain linear regression only (no tree models, the sample is small).\n- The final model uses sleep_hours, work_hours and study_hours.\n- sleep_deficit and work_heavy are kept as helper columns for exploration,\n  but they are NOT in the model matrix. Adding them made the leave-one-out\n  CV results worse, so build_feature_matrix() leaves them out.\n\nUsage (from the modeling notebook):\n    from features import add_sleep_deficit, add_work_heavy, build_feature_matrix\n\"\"\"\n\nFEATURE_COLUMNS = [\"sleep_hours\", \"work_hours\", \"study_hours\"]\nTARGET_COLUMN = \"course_grade\"\n\n\ndef add_sleep_deficit(df, threshold=7.0):\n    \"\"\"Add sleep_deficit = max(0, threshold - sleep_hours).\n\n    Students who sleep at or above the threshold get 0.\n    \"\"\"\n    out = df.copy()\n    out[\"sleep_deficit\"] = out[\"sleep_hours\"].apply(\n        lambda h: max(0.0, threshold - h)\n    )\n    return out\n\n\ndef add_work_heavy(df, cutoff=15):\n    \"\"\"Add work_heavy = 1 if work_hours >= cutoff, else 0.\n\n    The default cutoff of 15 h/week is the group used in the EDA figure.\n    \"\"\"\n    out = df.copy()\n    out[\"work_heavy\"] = (out[\"work_hours\"] >= cutoff).astype(int)\n    return out\n\n\ndef check_required_columns(df):\n    \"\"\"Raise a clear error if the cleaned data is missing a needed column.\"\"\"\n    required = FEATURE_COLUMNS + [TARGET_COLUMN]\n    missing = [c for c in required if c not in df.columns]\n    if missing:\n        raise ValueError(f\"Missing columns for modeling: {missing}\")\n\n\ndef build_feature_matrix(df):\n    \"\"\"Return (X, y) for the linear model.\n\n    X has sleep_hours, work_hours, study_hours.\n    y is course_grade.\n    \"\"\"\n    check_required_columns(df)\n    X = df[FEATURE_COLUMNS].copy()\n    y = df[TARGET_COLUMN].copy()\n    if X.isnull().any().any() or y.isnull().any():\n        raise ValueError(\"Feature matrix still has missing values; run the cleaning step first.\")\n    return X, y\n\n\nif __name__ == \"__main__\":\n    # Quick self-check on the cleaned file. Run from the repo root.\n    # This block is only for a manual check; the notebooks import the functions.\n    print(\"Feature columns:\", FEATURE_COLUMNS)\n    print(\"Target column:\", TARGET_COLUMN)\n"}, {"kind": "nb", "data": [["markdown", "# SleepWork-Grade: Exploratory Data Analysis\n\nThis notebook looks at the cleaned student survey (32 raw rows, 28 after cleaning) before any modeling. It covers:\n\n1. Basic checks on the cleaned data\n2. Descriptive statistics (A1)\n3. Group comparison by weekly work hours\n4. Pearson correlations with `course_grade` (A2)\n5. One EDA figure: sleep vs grade, colored by work load (A4)\n\nRun from the repository root or from `notebooks/`. The notebook reads `data/clean_student_sleep_survey_2026.csv` and saves the figure to `report/figures/sleep_vs_grade_scatter.png`."], ["code", "import numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\nfrom pathlib import Path\n\n# Works whether the notebook is opened from the repo root or from notebooks/\nROOT = Path.cwd().parent if Path.cwd().name == \"notebooks\" else Path.cwd()\nDATA_PATH = ROOT / \"data\" / \"clean_student_sleep_survey_2026.csv\"\nFIG_DIR = ROOT / \"report\" / \"figures\"\nFIG_DIR.mkdir(parents=True, exist_ok=True)\n\nnp.random.seed(2026)\npd.set_option(\"display.precision\", 2)"], ["markdown", "## 1. Load and check the cleaned data\n\nThe cleaned file should have 28 rows, the 8 survey columns, and no missing values."], ["code", "df = pd.read_csv(DATA_PATH)\n\nprint(\"Shape:\", df.shape)\nprint(df.dtypes)\nprint(\"\\nMissing values per column:\")\nprint(df.isna().sum())\n\nassert df.shape[0] == 28, \"Expected 28 clean rows\"\nassert df.isna().sum().sum() == 0, \"Clean data should have no missing values\"\n\ndf.head()"], ["markdown", "## 2. Descriptive statistics (A1)\n\nSummary of the four main numeric variables. These values go into the descriptive table in the report."], ["code", "main_cols = [\"sleep_hours\", \"work_hours\", \"study_hours\", \"course_grade\"]\ndf[main_cols].describe().round(2)"], ["markdown", "## 3. Work load and sleep groups\n\nWe flag students who work 15 or more hours a week as `work_heavy`. We also count how many students sleep less than 7 hours on weeknights. Both groupings are used in the figure below."], ["code", "df[\"work_heavy\"] = (df[\"work_hours\"] >= 15).astype(int)\n\nprint(\"Students with work_hours >= 15:\", df[\"work_heavy\"].sum(), \"of\", len(df))\nprint(\"Students sleeping under 7 hours:\", (df[\"sleep_hours\"] < 7).sum(), \"of\", len(df))\n\ndf.groupby(\"work_heavy\")[\"course_grade\"].agg([\"count\", \"mean\", \"std\"]).round(1)"], ["markdown", "## 4. Pearson correlations (A2)\n\nWe check how each numeric variable relates to the final grade. We also look at how sleep and work hours relate to each other, since a strong overlap between two predictors would complicate the regression."], ["code", "num_cols = [\"sleep_hours\", \"work_hours\", \"study_hours\", \"caffeine_cups\", \"course_grade\"]\ncorr = df[num_cols].corr(method=\"pearson\")\n\nprint(corr.round(2))\nprint(\"\\nCorrelation with course_grade:\")\nprint(corr[\"course_grade\"].drop(\"course_grade\").sort_values().round(2))"], ["markdown", "## 5. Figure A: sleep vs course grade\n\nThe scatter plot shows weeknight sleep on the x-axis and the final grade on the y-axis. Blue points are students who work under 15 hours a week, orange points work 15 hours or more. The black line is a simple least-squares fit of grade on sleep, using all 28 students."], ["code", "slope, intercept = np.polyfit(df[\"sleep_hours\"], df[\"course_grade\"], 1)\nprint(f\"Simple regression slope: {slope:.2f} grade points per hour of sleep\")\n\nfig, ax = plt.subplots(figsize=(7, 5))\n\ngroups = [\n    (0, \"Work under 15 h/week\", \"tab:blue\"),\n    (1, \"Work 15 h/week or more\", \"tab:orange\"),\n]\nfor flag, label, color in groups:\n    sub = df[df[\"work_heavy\"] == flag]\n    ax.scatter(sub[\"sleep_hours\"], sub[\"course_grade\"],\n               color=color, label=label, edgecolor=\"white\", s=60)\n\nxs = np.linspace(4, 9, 100)\nax.plot(xs, intercept + slope * xs, color=\"black\", linewidth=2, label=\"Linear fit\")\n\nax.set_xlim(4, 9)\nax.set_ylim(50, 95)\nax.set_xlabel(\"Average weeknight sleep (hours)\")\nax.set_ylabel(\"Final STAT2101 grade (0-100)\")\nax.set_title(\"Sleep vs course grade (n=28)\")\nax.grid(alpha=0.3)\nax.legend(loc=\"lower right\")\nfig.tight_layout()\n\nfig.savefig(FIG_DIR / \"sleep_vs_grade_scatter.png\", dpi=200)\nplt.show()"], ["markdown", "## 6. Summary of EDA findings\n\n- Sleep and study hours both move with the grade in the positive direction, and work hours move in the negative direction.\n- Students who work 15 or more hours a week have a lower average grade than the rest of the class, which is visible in the figure as mostly orange points sitting lower.\n- Sleep and work hours are only weakly correlated, so both can enter the regression without being redundant.\n- The sleep-grade relationship looks roughly linear over the observed range, so a linear model is a reasonable first step. The next notebook fits and evaluates that model."]]}, {"kind": "nb", "data": [["markdown", "# Modeling: sleep, part-time work and STAT2101 grade\n\nThis notebook fits the final model for the SleepWork-Grade project. The research question is whether weeknight sleep duration and weekly part-time work hours predict the final STAT2101 grade.\n\nModel: ordinary least squares linear regression (scikit-learn `LinearRegression`) with the features `sleep_hours`, `work_hours` and `study_hours`. We evaluate it with leave-one-out cross-validation (LOO-CV) because n = 28 is small, and we fix the random seed to 2026. We chose a linear model over tree models because the sample is small and the coefficients are easy to interpret.\n\nRun the EDA notebook first, and make sure the cleaned data file exists (`data/clean_student_sleep_survey_2026.csv`) before running this notebook."], ["code", "import os\n\n# Make relative paths work whether Jupyter was started in the repo root or in notebooks/\nif os.path.basename(os.getcwd()) == \"notebooks\":\n    os.chdir(os.path.join(os.getcwd(), \"..\"))\n\nimport numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\nfrom sklearn.linear_model import LinearRegression\nfrom sklearn.dummy import DummyRegressor\nfrom sklearn.model_selection import LeaveOneOut, cross_val_predict\nfrom sklearn.metrics import mean_squared_error, r2_score\n\nfrom src.features import build_feature_matrix, add_sleep_deficit, add_work_heavy\n\nSEED = 2026\nnp.random.seed(SEED)\nprint(\"numpy\", np.__version__, \"| pandas\", pd.__version__)"], ["markdown", "## 1. Load the cleaned data\n\nThe cleaned file has 28 rows and 8 columns with no missing values. The feature matrix `X` and the target `y` come from the shared feature helper."], ["code", "df = pd.read_csv(\"data/clean_student_sleep_survey_2026.csv\")\nprint(df.shape)\nprint(df.isna().sum().sum(), \"missing values\")\n\nX, y = build_feature_matrix(df)\nprint(\"X:\", X.shape, list(X.columns))\nprint(\"y:\", y.shape, \"mean =\", round(y.mean(), 1))"], ["markdown", "## 2. Leave-one-out cross-validation\n\nEach student is held out once. The model is trained on the other 27 rows and predicts the held-out grade. The RMSE and R2 below are computed on these out-of-sample predictions, so they are LOO-CV metrics, not training metrics."], ["code", "loo = LeaveOneOut()\nmodel = LinearRegression()\n\ny_pred = cross_val_predict(model, X, y, cv=loo)\n\nrmse = np.sqrt(mean_squared_error(y, y_pred))\nr2 = r2_score(y, y_pred)\n\nprint(f\"Linear regression, LOO-CV (n = {len(y)})\")\nprint(f\"RMSE = {rmse:.2f}\")\nprint(f\"R2   = {r2:.2f}\")"], ["markdown", "## 3. Baseline: predict the mean grade\n\nTo check whether the model adds anything, we compare it with a baseline that always predicts the mean grade of the training folds, using the same LOO-CV splits."], ["code", "dummy = DummyRegressor(strategy=\"mean\")\nbase_pred = cross_val_predict(dummy, X, y, cv=loo)\nbase_rmse = np.sqrt(mean_squared_error(y, base_pred))\n\nprint(f\"Mean baseline, LOO-CV RMSE = {base_rmse:.2f}\")\nprint(f\"Model improves RMSE by {base_rmse - rmse:.2f} grade points\")"], ["markdown", "## 4. Final fit on all 28 rows\n\nThe LOO-CV metrics above estimate predictive performance. For interpretation, we refit the model on all 28 rows and report the coefficients."], ["code", "final_model = LinearRegression().fit(X, y)\n\ncoef_table = pd.DataFrame({\n    \"feature\": X.columns,\n    \"coefficient\": final_model.coef_.round(2),\n})\nprint(\"Intercept:\", round(final_model.intercept_, 1))\ncoef_table"], ["markdown", "## 5. Ablation: which features help?\n\nWe add features one at a time and compare LOO-CV RMSE and R2. The last row adds the engineered `sleep_deficit` and `work_heavy` features. These are kept only if they improve the LOO-CV score."], ["code", "def loo_metrics(data, cols):\n    \"\"\"Return LOO-CV RMSE and R2 for a linear model on the given columns.\"\"\"\n    preds = cross_val_predict(LinearRegression(), data[cols], y, cv=LeaveOneOut())\n    return np.sqrt(mean_squared_error(y, preds)), r2_score(y, preds)\n\ndf_feat = add_work_heavy(add_sleep_deficit(df.copy()))\n\nablation_sets = {\n    \"sleep only\": [\"sleep_hours\"],\n    \"sleep + work\": [\"sleep_hours\", \"work_hours\"],\n    \"sleep + work + study\": [\"sleep_hours\", \"work_hours\", \"study_hours\"],\n    \"sleep + work + study + deficit + work_heavy\": [\n        \"sleep_hours\", \"work_hours\", \"study_hours\", \"sleep_deficit\", \"work_heavy\"\n    ],\n}\n\nrows = []\nfor name, cols in ablation_sets.items():\n    r, s = loo_metrics(df_feat, cols)\n    rows.append({\"model\": name, \"LOO-CV RMSE\": round(r, 2), \"LOO-CV R2\": round(s, 2)})\n\nablation = pd.DataFrame(rows)\nablation"], ["markdown", "The engineered features make the LOO-CV score worse, so the final model keeps only `sleep_hours`, `work_hours` and `study_hours`."], ["markdown", "## 6. Predicted vs actual figure\n\nThis figure is the model-result figure for the final report. Points near the dashed 45-degree line are predicted well. The annotation shows the LOO-CV RMSE and R2."], ["code", "fig, ax = plt.subplots(figsize=(6.5, 6.5))\n\nax.scatter(y, y_pred, s=50, alpha=0.85, edgecolor=\"black\", linewidth=0.5, label=\"Student\")\n\nlo = min(y.min(), y_pred.min()) - 2\nhi = max(y.max(), y_pred.max()) + 2\nax.plot([lo, hi], [lo, hi], linestyle=\"--\", color=\"gray\", label=\"Perfect prediction\")\nax.set_xlim(lo, hi)\nax.set_ylim(lo, hi)\n\nax.set_xlabel(\"Actual course grade\", fontsize=14)\nax.set_ylabel(\"Predicted course grade (LOO-CV)\", fontsize=14)\nax.tick_params(axis=\"both\", labelsize=12)\nax.set_title(\"Linear model: predicted vs actual\", fontsize=16)\nax.text(0.05, 0.92, f\"RMSE = {rmse:.2f}, R2 = {r2:.2f}\",\n        transform=ax.transAxes, fontsize=13,\n        bbox=dict(boxstyle=\"round\", facecolor=\"white\", alpha=0.9))\nax.legend(loc=\"lower right\", fontsize=11)\nax.grid(alpha=0.3)\n\nos.makedirs(\"report/figures\", exist_ok=True)\nfig.savefig(\"report/figures/predicted_vs_actual_grade.png\", dpi=200, bbox_inches=\"tight\")\nplt.show()"], ["markdown", "## 7. Summary for the report\n\nThese are the values the Results section uses."], ["code", "print(\"Final model: linear regression on sleep_hours, work_hours, study_hours\")\nprint(f\"LOO-CV RMSE = {rmse:.2f} (mean baseline {base_rmse:.2f})\")\nprint(f\"LOO-CV R2   = {r2:.2f}\")\nprint(f\"Intercept   = {final_model.intercept_:.1f}\")\nfor name, c in zip(X.columns, final_model.coef_):\n    print(f\"  {name:<12} {c:+.2f} grade points per unit\")\nprint(\"Figure saved to report/figures/predicted_vs_actual_grade.png\")"]]}, {"kind": "text", "ext": "md", "data": "# TA 피드백: 보고서 초안 검토 (2026-11-18)\n\n**과목:** STAT2101 Introduction to Data Analysis (2026년 가을학기)\n**팀:** SleepWork-Grade\n**작성자:** 정다은 (TA)\n**대상:** 보고서 초안 (Question, Data, Methods, Results, Discussion, Limitations)\n\n---\n\n## 전체 평가\n\n초안 구조가 명세의 6개 섹션 순서(1 Question, 2 Data, 3 Methods, 4 Results, 5 Discussion, 6 Limitations)를 잘 따르고 있습니다. 특히 저장소의 재현 절차 안내가 아주 명확해서, 채점자가 처음부터 끝까지 따라 해볼 수 있다는 점이 좋았습니다. 아래 수정 사항을 반영하면 보고서 점수를 충분히 높일 수 있을 것 같습니다.\n\n---\n\n## 1. Question\n\n- 연구 질문(\"주중 수면 시간과 주당 아르바이트 시간이 STAT2101 최종 성적을 예측하는가?\")이 명확합니다. 그대로 유지해 주세요.\n- 질문에 \"예측\"과 \"영향\"이 섞여 있는데, 이 연구는 인과 관계가 아니라 예측과 연관성을 다루므로 용어를 \"예측\"으로 통일해 주세요.\n\n## 2. Data\n\n- **제외된 행 수를 명시해야 합니다.** 원자료는 32행이고, 중복 1행(S014 중복)과 무효 3행(S022 성적 결측, S027 수면 25시간 범위 초과, S030 성적 \"abc\")을 제외해 **총 4행이 제외되어 28행**이 분석에 사용되었습니다. 이 숫자를 본문에 분명히 적어 주세요.\n- 결측 처리 내역도 함께 적어 주세요. 근무 시간 S005는 중앙값 10.0, 학습 시간 S011은 중앙값 8.0으로 대체했습니다. 값을 바꾼 행이라는 점을 명시해야 합니다.\n- 수면 시간 표기 정정(S003 \"7h\" → 7.0, S017 \"six and half\" → 6.5)도 정제 과정으로 한 줄 정도 언급하면 좋겠습니다.\n- 설문 기간(2026-09-21 ~ 2026-10-02)과 표본 모집 방식(온라인 설문)을 적어 주세요.\n\n## 3. Methods\n\n- 선형 회귀(OLS), 변수 세 개(sleep_hours, work_hours, study_hours), 리브-원-아웃 교차 검증(LOO-CV), 시드 2026을 명시한 점은 좋습니다.\n- 트리 기반 모델을 쓰지 않은 이유(표본이 작음)를 한 문장 덧붙이면 방법 선택의 근거가 분명해집니다.\n- 상관계수 분석(Pearson)과 EDA 결과가 어떤 순서로 이어지는지 설명해 주세요.\n\n## 4. Results\n\n- **[필수] 성능 지표가 LOO-CV 기준인지 훈련 데이터 기준인지 표에서 명확히 구분해야 합니다.** 초안 표 머리글에 \"RMSE\"만 적혀 있어 혼동될 수 있습니다. \"LOO-CV RMSE\", \"LOO-CV R2\"로 표기해 주세요.\n- **[필수] 상관계수 수치 불일치를 고쳐 주세요.** 초안 본문의 수면-성적 상관계수 r = 0.52는 EDA 노트북 결과와 맞지 않습니다. 최종 수치는 **r = 0.46**입니다. 이전 버전의 수치가 본문에 남아 있지 않은지 전체적으로 확인해 주세요.\n- 초안에 있던 훈련 RMSE 5.88은 이전 데이터 기준 수치입니다. 최종 보고서에서는 **LOO-CV RMSE 6.42, R2 0.41**만 사용하고, 기준선(평균 예측)의 RMSE 9.97과 비교해 주세요.\n- 보고할 수치를 정리하면 다음과 같습니다.\n  - 상관계수: 수면 r = 0.46, 근무 시간 r = -0.38, 학습 시간 r = 0.44, 수면-근무 r = -0.19\n  - 회귀 계수(전체 28행 적합): 절편 41.2, 수면 +3.1/시간, 근무 -0.48/시간, 학습 +1.05/시간\n  - 근무 15시간 이상 그룹(9명) 평균 성적 69.1 vs 나머지(19명) 76.9\n  - 수면 7시간 미만 학생은 11명\n- **모형 비교 표(ablation)를 본문에 넣어 주세요.** 다음 네 줄이 모두 들어가야 합니다.\n  - 수면만: RMSE 8.74 / R2 0.21\n  - 수면 + 근무: RMSE 7.71 / R2 0.32\n  - 수면 + 근무 + 학습: RMSE 6.42 / R2 0.41 (최종 모형)\n  - 수면 부족 변수(sleep_deficit)와 고근무 변수(work_heavy)를 추가: RMSE 6.71 / R2 0.37 (성능이 떨어져 제외)\n- **그림 B(예측값 vs 실제값)의 축 레이블 글씨가 너무 작습니다.** 인쇄나 PDF로 변환했을 때 읽히도록 크기를 키워 주세요. 주석 \"RMSE = 6.42, R2 = 0.41\"도 함께 확인해 주세요.\n- **그림 A(산점도)에는 범례가 필요합니다.** 파란색은 근무 15시간 미만, 주황색은 15시간 이상이라는 설명을 넣어 주세요. 회귀선 기울기 5.0이 본문과 일치하는지도 확인해 주세요.\n\n## 5. Discussion\n\n- 수면과 성적의 상관(r = 0.46)과 근무 시간의 음의 상관(r = -0.38)이 같은 방향으로 나타났다는 점을 중심으로 서술해 주세요.\n- 선행 연구와 비교하는 문단이 있어야 합니다. Han and Oh (2024)는 표본 412명, 수면-성적 r = 0.31, 15시간 이상 근무 시 성적 3.2점 하락, 선형 모형 R2 = 0.18을 보고했습니다. 우리 결과 r = 0.46은 더 강하지만, n = 28이라 95% 신뢰구간이 대략 0.10 ~ 0.71로 넓습니다. 두 연구의 방향성은 일치한다고 결론지을 수 있습니다.\n- 연구 결과를 \"수면이 성적을 올린다\"와 같이 인과로 쓰지 않도록 주의해 주세요.\n\n## 6. Limitations\n\n- **[필수] Limitations 섹션이 너무 짧습니다.** 현재 한두 문장으로는 한계를 충분히 설명하지 못합니다. 최소한 다음 항목을 각각 한 문단씩 다뤄 주세요.\n  - 표본 크기가 작음(n = 28)과 그에 따른 불확실성\n  - 한 과목(STAT2101)만 대상으로 함\n  - 수면 시간과 근무 시간을 스스로 보고함(자기보고 편향)\n  - 상관관계이며 인과관계가 아님\n  - 중앙값 대체가 2개 값(S005, S011)에 적용됨\n  - 교호작용 항을 포함하지 않음\n  - 설문 기간이 약 2주로 짧고 온라인 표본이라 대표성에 한계가 있음\n\n---\n\n## 요약 체크리스트\n\n1. 제외 행 4개(중복 1, 무효 3)를 Data 섹션에 명시\n2. 상관계수 r = 0.52를 r = 0.46으로 수정하고, 이전 수치가 남지 않았는지 확인\n3. 표와 본문의 성능 지표에 \"LOO-CV\" 표기\n4. 모형 비교(ablation) 표 추가\n5. 그림 B 축 레이블 글씨 크기 확대, 그림 A 범례 추가\n6. Limitations 섹션 확장\n7. 선행 연구 비교 문단 추가(신뢰구간 포함)\n\n보고서 최종본은 2026-12-05 23:59까지 LMS에 저장소를 압축해서 제출해야 합니다. 최대 6쪽 분량을 넘지 않도록 확인해 주세요.\n\n질문이 있으면 수요일 15:00 오피스아워에 찾아오거나 메일로 연락해 주세요. 수고 많았습니다.\n"}, {"kind": "text", "ext": "md", "data": "# 팀 회의록: SleepWork-Grade\n\n- 과목: STAT2101 Introduction to Data Analysis (2026 가을학기)\n- 일시: 2026-11-03 (화) 19:00\n- 장소: 도서관 3B 스터디룸\n- 참석: 김민준(팀장), 이서연, 박지호, 최유나\n- 안건: 역할 분담, 분석 방법 확정, 일정 점검\n\n---\n\n## 1. 프로젝트 개요\n\n- 연구 질문: 주중 평균 수면 시간과 주당 아르바이트 시간이 STAT2101 최종 성적을 예측하는가?\n- 데이터: STAT2101 수강생 온라인 설문 (2026-09-21 ~ 2026-10-02), 원자료 32행\n- 과제 명세: `assignment/project_spec.pdf` (\"STAT2101 Term Project Specification\")\n- 보고서 필수 섹션 순서: 1 Question, 2 Data, 3 Methods, 4 Results, 5 Discussion, 6 Limitations\n- 보고서 최대 분량: 6쪽\n\n## 2. 필수 분석 항목 (명세 기준)\n\n- A1. 기술통계 표\n- A2. 성적과의 Pearson 상관계수\n- A3. 다중 선형 회귀 + 교차검증 (RMSE, R2 보고)\n- A4. EDA 그림 1개, 모델 결과 그림 1개\n- A5. 선행연구 1편 이상과 결과 비교\n\n## 3. 결정 사항\n\n1. **모델은 선형 회귀만 사용한다.** 표본이 작아서(n=28 예정) 트리 계열 모델은 과적합 위험이 크다고 판단했다.\n2. **검증 방법은 leave-one-out CV(LOO-CV)로 한다.** 보고 지표는 RMSE와 R2이며, 학습 데이터 성능이 아니라 LOO-CV 성능을 표에 쓴다.\n3. **난수 시드는 2026으로 고정한다.** 재현성 항목(10점)을 위해 모든 노트북과 스크립트에 동일하게 적용한다.\n4. **데이터 정제 기준:** 중복 행은 제거하고, 범위를 벗어난 값이나 성적이 없는 행은 제외한다. 수치로 바꿀 수 있는 텍스트 값(예: \"7h\", 글로 쓴 시간)은 변환하고, 결측 값은 중앙값으로 채운다. 제외 행 수는 보고서 Data 섹션에 정확히 적는다.\n5. **파생 변수 기준:** 수면 부족은 7시간 기준으로 계산하고, 장시간 근로는 주당 15시간 이상으로 정의한다. 다만 파생 변수를 모델에 넣을지는 LOO-CV 결과를 보고 최종 결정한다.\n6. **보고서 제목:** \"Sleep, Part-time Work and Course Grades: A Student Survey\"\n\n## 4. 역할 분담\n\n| 담당 | 이름 | 맡은 일 |\n|---|---|---|\n| 팀장, 데이터 정제 | 김민준 | 원자료 점검, 중복/이상치/결측 처리, 정제 데이터 저장, 정제 과정 기록 |\n| 특성 공학 | 이서연 | 특성 공학 함수 작성 (아래 세부 내용 참고) |\n| EDA 및 그림 | 박지호 | EDA 노트북 작성, 기술통계와 상관계수 표, 그림 2종 제작 |\n| 최종 보고서 | 최유나 | report 폴더의 최종 보고서 작성, 선행연구 비교 정리 |\n| 공동 | 전원 | README 작성, 처음부터 끝까지 재현 확인 |\n\n### 이서연 담당: 특성 공학 함수 세부 내용\n\n- 수면 부족량 파생 변수: 기준 7.0시간에서 평균 수면 시간을 뺀 값을 쓰고, 0보다 작으면 0으로 한다.\n- 장시간 근로 더미 변수: 주당 아르바이트 시간이 15시간 이상이면 1, 아니면 0으로 한다.\n- 회귀 입력 행렬 함수: 데이터프레임을 받아서 설명 변수(수면 시간, 근로 시간, 자습 시간)와 종속 변수(최종 성적)를 나누어 돌려준다. 모델링 노트북은 이 함수를 그대로 호출해야 한다.\n- 함수마다 한 줄 설명 주석과 간단한 테스트 코드를 붙인다.\n- 목요일까지 초안을 올리고, 박지호와 노트북 호출 방식을 맞춘다.\n\n### 박지호 담당: 그림 사양\n\n- 그림 A: 수면 시간과 성적의 산점도. 점 색은 장시간 근로 여부로 구분한다 (파란색 15시간 미만, 주황색 15시간 이상). 회귀선을 검은색으로 그리고 제목은 \"Sleep vs course grade (n=28)\"로 한다.\n- 그림 B: 실제 성적과 LOO-CV 예측 성적의 산점도. 점선으로 45도 기준선을 그리고, 그림 안에 \"RMSE, R2\" 값을 주석으로 표시한다.\n- 두 그림 모두 축 라벨과 눈금 글씨는 보고서에서 읽기 쉬운 크기로 맞춘다.\n\n## 5. 일정\n\n- 중간 점검 회의: 2026-11-17\n- 조교 오피스아워: 매주 수요일 15:00 (질문과 초안 피드백을 받을 수 있음)\n- 최종 마감: **2026-12-05 (토) 23:59**, LMS 제출\n- 제출 형식: 리포지토리 전체를 zip으로 압축하여 제출한다.\n- 제출 전 확인: 새 폴더에서 README 절차를 따라 처음부터 실행해서 같은 결과가 나오는지 확인한다.\n\n## 6. 액션 아이템\n\n- [ ] 김민준: 원자료 점검 후 정제 데이터 저장, 제외 행 수 기록 (11-10까지)\n- [ ] 이서연: 특성 공학 함수 초안과 테스트 코드 작성 (11-12까지)\n- [ ] 박지호: EDA 노트북 기술통계와 상관계수 출력, 그림 A와 B 초안 (11-14까지)\n- [ ] 최유나: 보고서 목차 6개 섹션 틀 작성, 선행연구 자료 2편 찾기 (11-14까지)\n- [ ] 공동: 모델 노트북에서 LOO-CV 실행, 시드 2026 확인 (11-17 회의 전)\n- [ ] 김민준: 조교 오피스아워에서 정제 기준 확인 질문 준비\n\n## 7. 다음 회의 안건 (2026-11-17)\n\n- 정제 결과와 제외 행 수 확인\n- 모델 비교 결과 (기본 세 변수 모델과 파생 변수 추가 모델)\n- 그림 초안 검토\n- 보고서 초안 구조 점검\n"}, {"kind": "text", "ext": "py", "data": "# hw1_solution.py\n# Homework 1: basic algorithms on lists and strings\n# Problems: (1) bubble sort, (2) palindrome check, (3) simple tests\n\ndef bubble_sort(items):\n    \"\"\"Sort a list in ascending order using bubble sort.\n\n    Returns a new sorted list; the input list is not modified.\n    \"\"\"\n    result = list(items)\n    n = len(result)\n    for i in range(n - 1):\n        swapped = False\n        # After each pass the largest remaining item sits at the end,\n        # so the inner loop can stop one step earlier each time.\n        for j in range(n - 1 - i):\n            if result[j] > result[j + 1]:\n                result[j], result[j + 1] = result[j + 1], result[j]\n                swapped = True\n        if not swapped:\n            # No swaps means the list is already sorted.\n            break\n    return result\n\n\ndef is_palindrome(text):\n    \"\"\"Return True if text reads the same forwards and backwards.\n\n    Case and non-alphanumeric characters are ignored.\n    \"\"\"\n    cleaned = [ch.lower() for ch in text if ch.isalnum()]\n    left, right = 0, len(cleaned) - 1\n    while left < right:\n        if cleaned[left] != cleaned[right]:\n            return False\n        left += 1\n        right -= 1\n    return True\n\n\ndef count_vowels(text):\n    \"\"\"Count vowels (a, e, i, o, u) in a string, ignoring case.\"\"\"\n    vowels = \"aeiou\"\n    return sum(1 for ch in text.lower() if ch in vowels)\n\n\ndef run_tests():\n    # Bubble sort checks\n    assert bubble_sort([5, 2, 9, 1, 5, 6]) == [1, 2, 5, 5, 6, 9]\n    assert bubble_sort([]) == []\n    assert bubble_sort([1]) == [1]\n    assert bubble_sort([3, 2, 1]) == [1, 2, 3]\n\n    # Palindrome checks\n    assert is_palindrome(\"racecar\")\n    assert is_palindrome(\"A man, a plan, a canal: Panama\")\n    assert not is_palindrome(\"homework\")\n    assert is_palindrome(\"\")\n\n    # Vowel count checks\n    assert count_vowels(\"Programming is fun\") == 5\n    print(\"All tests passed.\")\n\n\nif __name__ == \"__main__\":\n    numbers = [64, 34, 25, 12, 22, 11, 90]\n    print(\"Sorted:\", bubble_sort(numbers))\n    for word in [\"level\", \"python\", \"Was it a car or a cat I saw\"]:\n        print(f\"{word!r} palindrome? {is_palindrome(word)}\")\n    run_tests()\n"}, {"kind": "text", "ext": "md", "data": "# 이번 학기 주간 시간표\n\n작성일: 2026-11-21 (토)\n적용 기간: 2026학년도 2학기 12월 첫째 주 ~ 둘째 주\n\n## 고정 일정\n\n| 요일 | 시간 | 내용 | 장소 |\n|------|------|------|------|\n| 월 | 09:00-10:30 | 선형대수 | 공학관 204 |\n| 월 | 13:00-14:30 | 영어회화 중급 | 어학관 301 |\n| 월 | 19:00-21:00 | 도서관 자습 | 중앙도서관 3층 |\n| 화 | 10:30-12:00 | 일본어 기초 | 인문관 112 |\n| 화 | 18:00-19:30 | 헬스장 (상체) | 체육관 지하 1층 |\n| 수 | 09:00-10:30 | 선형대수 | 공학관 204 |\n| 수 | 14:00-15:00 | 교수님 면담 시간 | 교수연구동 508 |\n| 목 | 10:30-12:00 | 일본어 기초 | 인문관 112 |\n| 목 | 18:00-19:30 | 헬스장 (하체) | 체육관 지하 1층 |\n| 금 | 13:00-15:00 | 과 동아리 정기 모임 | 학생회관 2층 세미나실 |\n| 금 | 19:00-21:00 | 주간 복습 및 정리 | 기숙사 자습실 |\n| 토 | 10:00-15:00 | 카페 아르바이트 | 정문 앞 카페 |\n| 일 | - | 휴식, 장보기 | - |\n\n## 이번 주 할 일\n\n- [ ] 선형대수 연습문제 3~5번 풀이 (12/02 수요일 전까지)\n- [ ] 영어회화 발표 대본 초안 작성 (12/04 금요일 수업 전)\n- [ ] 일본어 단어 60개 암기 (화요일 쪽지시험 대비)\n- [ ] 카페 다음 주 근무표 확인 후 교대 여부 답하기\n- [ ] 동아리 회비 입금 (12/03까지)\n- [ ] 세탁물 맡기기 (목요일 저녁 귀가길)\n\n## 시간대별 메모\n\n### 평일 아침\n- 기상: 07:00 전후\n- 아침 식사는 학교 근처 편의점에서 간단히 해결\n- 등교 버스는 07:40 정류장 출발 기준\n\n### 평일 저녁\n- 헬스장 가는 날은 수업 끝나고 바로 이동하기 때문에 저녁 식사는 간단하게\n- 자습은 도서관 마감 시간인 21:00 전에 정리하고 귀가\n- 취침 목표는 23:30, 알람은 07:00\n\n### 주말\n- 토요일 근무는 10:00 출근 전에 김밥과 물 챙기기\n- 근무 끝나고 바로 도서관으로 가서 2시간 정도 복습\n- 일요일은 아무 일정도 잡지 않고 쉬기로 함\n\n## 월간 체크 포인트\n\n| 날짜 | 일정 | 준비물 |\n|------|------|--------|\n| 12/02 (수) | 선형대수 과제 제출 | 노트북, 필기도구 |\n| 12/04 (금) | 영어회화 발표 | 대본 출력본, 발음 연습 |\n| 12/08 (화) | 일본어 중간 평가 | 단어장 |\n| 12/12 (토) | 카페 연말 행사 근무 | 앞치마, 근무 시간표 |\n\n## 메모\n\n- 헬스장 회원권은 12월 말에 만료되니 연장 여부를 미리 결정하기\n- 아르바이트 급여는 12/10에 입금 예정, 교재비로 쓰기\n- 동아리 모임에 못 가게 되면 단톡방에 미리 알리기\n- 주중에 시간이 남으면 영어 뉴스 한 편씩 듣기\n\n## 이번 주 한 줄 목표\n\n평일 자습을 빠뜨리지 않고, 토요일 근무 후에도 복습 시간을 확보하기.\n"}], "edges": [{"a": 9, "b": 8, "s": "clean_data.py → raw_student_sleep_survey_2026.csv: 사용함", "rel": "사용함", "direct": true, "d": 1, "ev": "\"\"\"Clean the raw STAT2101 student sleep survey. Run from the project root: python src/clean_data.py Reads data/raw_student_sleep_survey_2026.csv Writes data/clean_student_sleep_survey_2026.csv Steps:
