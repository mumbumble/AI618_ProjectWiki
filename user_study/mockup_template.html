<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProjectWiki 사용자 스터디 (목업)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/standalone/umd/vis-network.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<style>
/* tokens and base styles follow the team viewer (projectwiki/srcs/view_template.html, main @ aeebcf0) */
:root{color-scheme:dark;
 --bg:#1e1e1e;--panel:#262626;--text:#dedede;--sub:#bdbdbd;--muted:#a3a3a3;--line:#363636;--line2:#4a4a4a;
 --accent:#b49af4;--accdeep:#7658b9;--accsoft:#3a3248;--ok:#7cbb9c;--oksoft:#26332c;--bad:#e98b90;--chip:#333136;--rail:#202020;
 --warn:#e0a458;--warnsoft:#33291c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif}
body{display:flex;flex-direction:column;overflow:hidden;word-break:keep-all;overflow-wrap:break-word}
p,li,h2,h3,.explain,.qtext,.callout,.suggest,.purpose,.inst,.empty-state,.fb,.brief,.summary,.sidebox,.edge-link span{text-wrap:pretty}
h2,.qtext,.suggest .q,.brief h2,.paper h2{text-wrap:balance}
.path,.file span,.card-file span,blockquote,.code,.doc code,.csv{word-break:normal;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--chip);border-radius:5px;padding:5px 10px;cursor:pointer}
button:hover{background:#403b49}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accdeep);color:#fff;border-color:#8768ca} button.primary:hover{background:#8466c7}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)} button.ghost:hover{color:var(--text);background:var(--chip)}
button:disabled{opacity:.4;cursor:default}
button.sm{font-size:12px;padding:2px 9px}
.hint{color:var(--muted);font-size:12px}
.mono,.path{font-family:ui-monospace,Consolas,monospace}

/* header */
header{display:flex;flex:none;align-items:center;height:43px;padding:0 16px;background:var(--rail);border-bottom:1px solid var(--line);gap:10px;position:relative}
header h1{font-size:14px;font-weight:600;margin:0}
.brand{color:var(--accent);font-size:22px}
#where{color:var(--muted);font-size:12px;margin-left:6px} #where b{color:var(--text);font-weight:500}
.header-note{margin-left:auto;color:var(--muted);font-size:12px}
#prog{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);transition:width .4s}
#app{flex:1;min-height:0;display:flex;flex-direction:column}

/* task strip */
.task{flex:none;display:flex;align-items:center;gap:14px;min-height:44px;padding:8px 16px;background:var(--rail);border-bottom:1px solid var(--line)}
.plbl{flex:none;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.plbl .pill{display:inline-block;padding:1px 8px;border-radius:4px;background:#38303f;color:var(--accent);font-weight:600;font-size:12px}
.purpose{flex:1;min-width:0;font-size:14.5px;color:var(--text);line-height:1.5}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:0 6px;border-radius:4px;margin-right:8px;background:var(--warnsoft);color:var(--warn);border:1px solid #6b5230;letter-spacing:0}
.inst{flex:none;font-size:12px;color:var(--muted)}

/* workspace */
.workspace{flex:1;min-height:0;display:flex;position:relative}
.ribbon{width:46px;flex:none;background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:10px}
.icon-button{border:0;background:transparent;width:32px;height:32px;padding:6px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.icon-button svg,.tab svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5}
.ribbon .active{color:var(--accent);background:#38303f}
.ribbon .bottom{margin-top:auto}
.explorer{width:255px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.workspace.folder .explorer{width:285px}
.noexp .explorer,.noinsp .inspector,.noinsp #vsplit{display:none}
.pane-title{height:43px;padding:10px 16px;border-bottom:1px solid var(--line);font-weight:500;display:flex;align-items:center;gap:8px;flex:none}
.pane-title .hint{margin-left:auto}
.search-box{margin:14px 12px 6px}
#search{width:100%;padding:6px 10px;background:var(--bg);border:1px solid var(--line);border-radius:5px}
#search::placeholder{color:var(--muted)}
.explorer-scroll{overflow:auto;padding:4px 10px 16px;flex:1}
.section-title{font-size:12px;letter-spacing:.6px;color:var(--muted);margin:20px 8px 8px;font-weight:600}
.vault-name{padding:8px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-tree details{margin-left:10px} .file-tree>details{margin-left:0}
.file-tree summary{cursor:pointer;color:#bdbdbd;padding:3px 4px;overflow-wrap:anywhere}
.file{border:0;background:transparent;display:flex;align-items:center;gap:7px;width:100%;text-align:left;padding:4px 8px;color:#bcbcbc;border-radius:4px}
.file span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-icon{display:inline-flex;align-items:center;justify-content:center;flex:none;width:20px;height:20px}
.file-icon svg{display:block;width:18px;height:18px}
.file:hover,.file.hov{background:var(--chip)}
.file.selected{background:var(--accsoft);color:#d4bfff}
#legend .item{display:flex;width:100%;gap:8px;align-items:center;text-align:left;padding:5px 8px;border:0;background:transparent;border-radius:4px}
#legend .item:hover{background:var(--chip)} #legend .item.on{background:var(--accsoft);color:#e1d3ff}
#legend .item .hint{margin-left:auto}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.wantfile .callout:not(.ready){animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #b49af400}50%{box-shadow:0 0 0 3px #b49af455}}

main{flex:1;min-width:0;display:flex;flex-direction:column}
.tabbar{height:43px;background:var(--rail);display:flex;padding:5px 8px 0;gap:4px;border-bottom:1px solid var(--line);flex:none}
.tab{display:flex;align-items:center;gap:9px;padding:6px 16px;min-width:165px;max-width:360px;border:1px solid var(--line);border-bottom:0;background:var(--bg);border-radius:7px 7px 0 0;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab svg{color:var(--accent)} .tab .file-icon svg{width:16px;height:16px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:8px 20px;border-bottom:1px solid #2b2b2b;flex:none}
.breadcrumb{color:var(--muted);font-size:13px} .breadcrumb strong{color:var(--text);font-weight:500}
.view-mode{display:inline-flex;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--rail)}
.view-mode button{border:0;background:transparent;padding:3px 10px;color:var(--muted)}
.view-mode button[aria-pressed="true"]{background:#493b65;color:#e1d3ff}
#graphwrap{flex:1;min-height:160px;position:relative}
#net{position:absolute;inset:0}
#groupgraph{position:absolute;inset:0;overflow:hidden;cursor:grab}
#groupgraph.drag{cursor:grabbing}
#net[hidden],#groupgraph[hidden]{display:none}
#groupScene{position:absolute;left:0;top:0;transform-origin:0 0}
#groupLinks{position:absolute;left:0;top:0;overflow:visible}
.graph-caption{position:absolute;left:22px;top:16px;pointer-events:none;color:var(--muted);font-size:12px}
.graph-caption strong{display:block;font-size:16px;color:#cecece;font-weight:500;margin-bottom:2px}
.tools{display:flex;align-items:center;gap:8px}
.graph-options{position:relative}
.graph-options summary{cursor:pointer;padding:5px 10px;color:var(--muted);list-style:none;border-radius:5px} .graph-options summary:hover{color:var(--text);background:var(--chip)}
.graph-options summary::-webkit-details-marker{display:none} .graph-options summary:before{content:"▸ ";font-size:11px} .graph-options[open] summary:before{content:"▾ "}
.options-panel{position:absolute;right:0;top:36px;width:200px;background:var(--panel);padding:10px 12px;border:1px solid var(--line);border-radius:7px;z-index:5;box-shadow:0 8px 24px #0006}
.options-panel label{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer}
input[type=checkbox]{accent-color:#a88be5}
.group-row{display:flex;align-items:center;gap:5px}
.group-row .item{min-width:0;flex:1}
.group-row.off .item{opacity:.55}
.visibility-switch{position:relative;flex:none;width:30px;height:18px;padding:0;border:1px solid #65616b;border-radius:12px;background:#4a474f;margin-right:4px}
.visibility-switch::after{content:"";position:absolute;width:12px;height:12px;left:2px;top:2px;border-radius:50%;background:#e6e3eb}
.visibility-switch[aria-checked="true"]{background:#8060bd;border-color:#a88be5}
.visibility-switch[aria-checked="true"]::after{left:14px;background:#fff}
.visibility-switch:hover{border-color:var(--accent)}
.feedback-section{border-top:1px solid var(--line);margin-top:24px}
.fb{font-size:13px;padding:7px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.fb .t{color:var(--muted)}
footer{height:27px;flex:none;display:flex;align-items:center;gap:16px;padding:0 14px;border-top:1px solid var(--line);background:var(--rail);color:var(--muted);font-size:12px}
#sessionStatus{margin-left:auto}
.graph-empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:var(--muted);pointer-events:none}
.graph-empty[hidden]{display:none}
.graph-controls{position:absolute;right:18px;top:16px;display:flex;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:3px}
.graph-controls button{background:transparent;border:0;font-size:18px;min-width:32px;line-height:1.2}
.graph-controls button:last-child{font-size:13px;border-left:1px solid var(--line);border-radius:0 4px 4px 0}
.group-card{position:absolute;width:270px;border:1.5px solid var(--gc);border-radius:9px;background:#26282f;box-shadow:0 4px 14px #0003;overflow:hidden}
.group-card.on,.group-card.focused{box-shadow:0 0 0 3px #b49af44d}
.group-card-header{padding:11px 13px 8px;border-bottom:1px solid #ffffff12;cursor:pointer}
.group-card-header:hover{background:#2d2f37}
.group-card-title{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.group-card-title .dot{background:var(--gc)}
.group-card-header .hint{display:block;margin:3px 0 0 16px}
.group-card-items{padding:7px;max-height:248px;overflow:auto;overscroll-behavior:contain}
.card-file{display:flex;align-items:center;gap:9px;width:100%;padding:4px 8px;border:0;background:transparent;text-align:left;font-size:13.5px;border-radius:4px}
.card-file .badge-ext{display:inline-flex;align-items:center;justify-content:center;flex:none;min-width:38px;height:22px;padding:0 5px;border:1px solid #626262;border-radius:5px;background:#303030;color:#dedede;font:700 11px/1 ui-monospace,Consolas,monospace}
.card-file span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-file.selected{background:#493b65;color:#e1d3ff}
.group-connection{cursor:pointer}
.group-connection .cl{fill:none;stroke:#80798d;opacity:.7}
.group-connection .ch{fill:none;stroke:transparent;stroke-width:18}
.group-connection:hover .cl,.group-connection.on .cl{stroke:var(--accent);opacity:1}
.group-connection rect{fill:#302c38;stroke:#665d76}
.group-connection text{fill:#e0d7eb;font:13px "Segoe UI","Malgun Gothic",sans-serif;text-anchor:middle;dominant-baseline:central}

/* folder-only viewer */
#viewer{position:absolute;inset:0;overflow:auto;padding:28px 36px var(--cardh,280px)}
#viewer h2{font-size:18px;font-weight:600;margin:0 0 4px}

/* inspector */
#vsplit{width:5px;flex:none;cursor:col-resize;background:var(--line);border-left:1px solid var(--rail)}
#vsplit:hover,#vsplit.drag{background:#5b4b7c}
.inspector{width:var(--dw,400px);flex:none;background:var(--panel);display:flex;flex-direction:column;min-height:0}
.inspector-scroll{overflow:auto;padding:20px 20px var(--cardh,240px);flex:1}
.inspector h2{font-size:18px;font-weight:600;margin:0 0 6px;overflow-wrap:anywhere}
.inspector h3{font-size:13px;font-weight:600;margin:22px 0 8px;color:var(--sub)}
.empty-state{padding:24px 0 10px}
.empty-symbol{color:var(--accent);font-size:30px;margin-bottom:16px}
.empty-state p{color:var(--muted)}
.path{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.badge{display:inline-block;font-size:12px;padding:2px 7px;border-radius:4px;background:var(--chip)}
.badge.direct{background:#483c62;color:#d9c6ff}
.badge.removed{background:#573439;color:#ffb6bd}
.badge.prop{background:var(--warnsoft);color:var(--warn)}
.badge.user{background:#304b3c;color:#a4ddbe}
.inspector-scroll>#detail{min-height:40%}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
blockquote{margin:6px 0 14px;padding:8px 12px;border-left:2px solid #77629d;background:#222;font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere;font-family:ui-monospace,Consolas,monospace;color:#cfcfcf}
.edge-link{cursor:pointer;display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:7px 0;font-size:13px;border-radius:0;overflow-wrap:anywhere}
.edge-link:hover{color:var(--accent);background:transparent}
.edge-link .file-icon{align-self:center}
.edge-link .hint{font-size:12px}
.explain{font-size:14.5px;line-height:1.7;margin:0}
.back{display:inline-block;font-size:12px;color:var(--muted);cursor:pointer;margin-bottom:12px} .back:hover{color:var(--accent)}
.propbar{margin:-20px -20px 16px;padding:10px 20px;background:var(--warnsoft);color:var(--warn);font-size:12px;font-weight:600;border-bottom:1px solid #6b5230}
.fixrow{border-top:1px solid var(--line);margin-top:22px;padding-top:4px}

/* file contents */
.doc{font-size:14px;line-height:1.75}
.doc h1{font-size:19px;margin:4px 0 12px} .doc h2{font-size:16px;margin:20px 0 8px} .doc h3{font-size:14.5px;margin:16px 0 6px;color:var(--text)}
.doc table{border-collapse:collapse;margin:8px 0;font-size:13px} .doc td,.doc th{border:1px solid var(--line);padding:4px 8px}
.doc code{font:12.5px ui-monospace,Consolas,monospace;color:#bba6db;background:#202020;padding:1px 4px;border-radius:3px}
.doc pre{background:#202020;padding:10px 12px;border-radius:5px;overflow:auto;border:1px solid var(--line)} .doc pre code{background:none;padding:0;color:inherit}
.doc blockquote{font-family:inherit;background:none}
.doc a{color:var(--accent)}
.code{margin:0;border-radius:5px;overflow:auto;font:12.5px/1.6 ui-monospace,Consolas,monospace;border:1px solid var(--line);background:#202020}
.code code{display:block;padding:10px 12px;white-space:pre;background:none!important}
.csv{border-collapse:collapse;font-size:12.5px} .csv td,.csv th{border:1px solid var(--line);padding:3px 8px} .csv th{background:#202020}
.cell{margin:10px 0} .cell .ctag{font-size:11px;color:var(--muted);margin-bottom:2px}
.pdf{width:100%;height:calc(100vh - 250px - var(--cardh,0px));min-height:300px;border:1px solid var(--line);border-radius:5px;background:#fff}
img.shot{max-width:100%;border-radius:5px;border:1px solid var(--line);background:#fff}

/* question / task bar under the graph */
#bottom{flex:none;border-top:1px solid var(--line);background:var(--panel);max-height:46%;display:flex;flex-direction:column}
.bhead{display:flex;align-items:center;gap:12px;height:36px;padding:0 20px;cursor:pointer;user-select:none;flex:none;border-bottom:1px solid var(--line);background:var(--rail)}
.bhead:hover .fold{color:var(--text)}
.bhead .lbl{font-size:13px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:8px}
.bhead .lbl:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)} .practice-b .bhead .lbl:before{background:var(--warn)}
.bhead .mini{flex:1;min-width:0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0}
#bottom.min .mini{opacity:1}
.bhead .fold{color:var(--muted);font-size:12px;margin-left:auto}
#bottom.min #sidebody{display:none} #bottom.min .bhead{border-bottom:0}
#sidebody{overflow:auto}
.sidebox,.qwrap{padding:14px 20px}
.sidebox h3{margin:0 0 4px;font-size:14px;font-weight:600}
.sidebox p{margin:0;color:var(--muted);font-size:13px}
.qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.qhead .lbl{display:none}
.qtext{font-size:16px;font-weight:500;line-height:1.5;margin-bottom:10px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{text-align:left;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);display:flex;gap:10px;align-items:center}
.opt:hover{border-color:#8062ba;background:#2a2730}
.opt.on{background:#493b65;border-color:#8062ba;color:#e1d3ff}
.opt .k{font:600 11px ui-monospace,Consolas,monospace;color:var(--muted);width:12px} .opt.on .k{color:#e1d3ff}
.callout{border:1px solid #5b4b7c;background:#2b2635;border-radius:6px;padding:10px 14px}
.callout .big{font-size:14px;font-weight:600;color:#d4bfff}
.callout .sm{font-size:12.5px;color:var(--muted);margin-top:2px}
.callout.ready{border-color:#3f6a55;background:var(--oksoft)} .callout.ready .big{color:var(--ok)}
.pickbtn{width:100%;margin-top:8px;padding:8px 14px}
.steps{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.steps li{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;color:var(--muted)}
.steps .n{flex:0 0 20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:1px solid var(--line2)}
.steps li.now{color:var(--text);border-color:#6b5230} .steps li.now .n{background:var(--warn);border-color:var(--warn);color:#1e1e1e}
.steps li.ok{color:var(--ok)} .steps li.ok .n{background:var(--oksoft);border-color:var(--ok)}
.locked{padding:0 20px 14px;color:var(--muted);font-size:13px}
.empty{padding:14px 20px;color:var(--muted);font-size:13px}
.suggest{padding:14px 20px;background:var(--warnsoft)}
.suggest .h{font-size:12px;font-weight:600;color:var(--warn)}
.suggest .q{font-size:15px;font-weight:500;margin:6px 0 2px}
.actions{display:flex;gap:8px;align-items:center}
.marks{font-size:13px;letter-spacing:4px;color:var(--muted)}
.list .row2{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:13px;cursor:pointer} .list .row2:hover{color:var(--accent)}
.sidefoot{padding:0 20px 14px}

/* briefing */
.brief{position:fixed;inset:0;z-index:50;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px}
.brief .card{max-width:640px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:28px 30px;box-shadow:0 20px 60px #0008}
.brief .k{font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.6px}
.brief h2{font-size:21px;font-weight:600;margin:4px 0 10px}
.brief p{color:var(--sub);margin:0 0 12px}
.brief ul{margin:0;padding-left:18px;color:var(--sub)} .brief li{margin:5px 0}
.brief .foot{display:flex;align-items:center;justify-content:space-between;margin-top:20px}
.legend3{display:grid;grid-template-columns:30px 1fr 30px 1fr;gap:8px 10px;align-items:center;font-size:13px;color:var(--sub);margin:6px 0 16px;padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:6px}

/* intro / survey / end pages */
.page{flex:1;overflow:auto;display:flex;justify-content:center;padding:52px 20px}
.paper{max-width:640px;width:100%}
.paper h2{font-size:22px;font-weight:600;margin:0 0 8px}
.paper>p{color:var(--muted);margin:0 0 20px}
.box{border-top:1px solid var(--line);padding:20px 0}
.box .lbl{display:block;font-size:12px;letter-spacing:.6px;color:var(--muted);font-weight:600;margin-bottom:6px}
.box ol{margin:6px 0 0;padding-left:20px;color:var(--sub)} .box li{margin:3px 0}
.check{display:flex;gap:8px;align-items:flex-start;margin:6px 0} .check input{accent-color:#a88be5;margin-top:5px}
.err{color:var(--bad);font-size:12px;min-height:18px;margin:4px 0}
.scale{display:flex;justify-content:space-between;gap:4px;margin:10px 0 4px}

.scale input{display:block;margin:0 auto 4px;accent-color:#a88be5}
textarea{width:100%;min-height:64px;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:8px 10px;resize:vertical}
.legend2{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:8px}
.legend2 i{display:inline-block;width:18px;border-top:2px dashed var(--bad);vertical-align:middle;margin-right:5px}
.minibox{height:340px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
table.sum{width:100%;border-collapse:collapse;font-size:13px} .sum td,.sum th{border-bottom:1px solid var(--line);padding:7px 4px;text-align:left} .sum th{color:var(--muted);font-weight:600}

/* question / task card floating over the graph */
#bottom{position:absolute;left:var(--cl,340px);right:16px;bottom:16px;max-height:min(58%,460px);z-index:20;
 display:flex;flex-direction:column;background:#2a2a2d;border:1px solid #444249;border-radius:12px;box-shadow:0 14px 36px #000a,0 2px 6px #0006;overflow:hidden}
#bottom.min{right:auto;max-width:calc(100% - var(--cl,340px) - 16px);border-radius:20px}
.bhead{display:flex;align-items:center;gap:12px;height:40px;padding:0 16px 0 18px;cursor:pointer;user-select:none;flex:none;border-bottom:1px solid #3a393f}
#bottom.min .bhead{border-bottom:0;height:38px}
.bhead .lbl{font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px;white-space:nowrap}
.bhead .lbl:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)} .practice-b .bhead .lbl:before{background:var(--warn)}
.bhead .mini{flex:1;min-width:0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none}
#bottom.min .mini{display:block;max-width:620px}
.bhead .fold{color:var(--muted);font-size:12px;margin-left:auto;padding:2px 10px;border:1px solid #444249;border-radius:12px;white-space:nowrap}
.bhead:hover .fold{color:var(--text);border-color:#6a6672}
#bottom.min #sidebody{display:none}
#sidebody{overflow:auto}
.sidebox,.qwrap{padding:14px 18px 16px}
.qtext{font-size:15.5px;font-weight:500;line-height:1.5;margin-bottom:12px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{text-align:left;padding:10px 12px;border:1px solid #444249;border-radius:8px;background:#232326;display:flex;gap:10px;align-items:center;min-width:0}
.opts.four{grid-template-columns:repeat(4,minmax(0,1fr))} .opts.four .opt{padding:10px}
.opt .ot{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt:hover{border-color:#8062ba;background:#2c2836}
.callout{border-radius:8px}
.pickbtn{border-radius:8px}
.steps{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.steps li{display:flex;gap:8px;align-items:center;padding:5px 12px 5px 6px;border:1px solid #444249;border-radius:16px;font-size:13px;color:var(--muted);white-space:nowrap}
.steps .n{flex:0 0 20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:1px solid var(--line2)}
.steps li.now{color:var(--text);border-color:#8a6a3a;background:#3a2f22}
.suggest{padding:14px 18px 16px;background:transparent;border-top:2px solid var(--warn)}
.suggest .q{font-size:15px;font-weight:500;margin:8px 0 2px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:nowrap}
.actions button{border-radius:8px}
.sidefoot{padding:0 18px 16px}
button{white-space:nowrap}
.list .row2 span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fixbox{margin:12px 0 4px;padding:10px 12px;border:1px solid #3d3a44;border-radius:8px;background:#2a2730}
.fixh{font-size:12px;font-weight:600;color:var(--sub)}
.donechip{display:inline-block;font-size:13px;color:var(--ok);padding:4px 12px;border:1px solid #3f6a55;border-radius:14px;background:var(--oksoft)}
.guide-text{margin-top:10px;font-size:13.5px;color:var(--text);padding-left:10px;border-left:2px solid var(--warn)}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 #e0a45800}50%{box-shadow:0 0 0 3px #e0a45899}}
.guide-group #legend{border-radius:8px;animation:glow 1.6s ease-in-out infinite}
.guide-hide .fixbox{border-color:var(--warn);animation:glow 1.6s ease-in-out infinite}
.guide-file #graphwrap,.guide-edge #graphwrap{box-shadow:inset 0 0 0 2px #e0a45866}
.qline{display:flex;align-items:flex-start;gap:12px}.qline .qtext{flex:1;min-width:0}
.pickrow{display:flex;gap:10px;align-items:stretch}.pickrow .callout{flex:1;min-width:0}
.pickrow .pickbtn{width:auto;margin-top:0;padding:0 20px;font-size:14px;max-width:45%;overflow:hidden;text-overflow:ellipsis}
</style>

<body>
<header><span class="brand" aria-hidden="true">◈</span><h1>ProjectWiki</h1><span id="where"></span><span class="header-note">사용자 스터디 목업 · 화면은 팀 뷰어(main) 기준</span><div id="prog"></div></header>
<div id="app"></div>
<script>
/*DATA*/
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const base=p=>p.split("/").pop();
const ext=p=>{const n=base(p).toLowerCase();return n.includes(".")?n.split(".").pop():""};
/* same palette, node shapes and edge colours as the team viewer */
const PALETTE=["#b49af4","#83b6c9","#c7ad77","#8bbb9a","#ce92aa","#8b9cd1","#c18e70","#a4ba77","#9c96b9","#80b8af"];
const SHAPE={py:"diamond",pdf:"square",ipynb:"triangle",png:"star",jpg:"star",jpeg:"star"};
const C={bg:"#1e1e1e",text:"#dedede",muted:"#a3a3a3",accent:"#b49af4",bad:"#e98b90",prop:"#e0a458",direct:"#66616e",inferred:"#45424b",dim:"#2c2b2f"};
const mix=(hex,to,a)=>{const p=h=>[1,3,5].map(k=>parseInt(h.slice(k,k+2),16)),x=p(hex),y=p(to);return "#"+x.map((v,k)=>Math.round(v*(1-a)+y[k]*a).toString(16).padStart(2,"0")).join("")};
function fileIcon(path){
 const name=base(path).toLowerCase(),e=ext(path);let art;
 if(e==="py")art='<path fill="#5aa9df" d="M12 2c-5 0-5 2-5 5h6v1H5c-4 0-4 8 0 8h2v-4c0-2 1-3 3-3h7V6c0-3-2-4-5-4Z"/><path fill="#ffda68" d="M12 22c5 0 5-2 5-5h-6v-1h8c4 0 4-8 0-8h-2v4c0 2-1 3-3 3H7v3c0 3 2 4 5 4Z"/><circle cx="10" cy="5" r="1" fill="#1e1e1e"/><circle cx="14" cy="19" r="1" fill="#1e1e1e"/>';
 else if(["md","markdown"].includes(e))art='<rect x="2" y="4" width="20" height="16" rx="2" stroke="#8fcfff" stroke-width="1.5"/><path d="M5 16V8l3 4 3-4v8M17 8v8m-3-3 3 3 3-3" stroke="#8fcfff" stroke-width="1.8" stroke-linejoin="round"/>';
 else if(["png","jpg","jpeg","gif","webp"].includes(e))art='<rect x="2.5" y="3.5" width="19" height="17" rx="2" stroke="#87d5a2" stroke-width="1.6"/><circle cx="8" cy="9" r="2" fill="#f5d580"/><path d="m4 18 5-6 3 3 3-5 5 8H4Z" fill="#87d5a2"/>';
 else if(e==="pdf")art='<path d="M5 2h9l5 5v15H5Z" stroke="#ef8f91" stroke-width="1.5"/><path d="M14 2v6h5M7 17c5-1 6-9 4-7-2 2 1 8 5 7 3-1-4-3-9 0Z" stroke="#ef8f91" stroke-width="1.5" stroke-linejoin="round"/>';
 else if(e==="ipynb")art='<path d="M4 9c3-7 13-7 16 0M4 15c3 7 13 7 16 0" stroke="#edaa68" stroke-width="2.8" stroke-linecap="round"/><circle cx="6" cy="3" r="1.6" fill="#b7bbc4"/><circle cx="19" cy="21" r="1.6" fill="#b7bbc4"/><path d="m9 10-3 2 3 2m6-4 3 2-3 2" stroke="#edaa68" stroke-width="1.4"/>';
 else if(e==="json")art='<path d="M9 3H7c-2 0-1 5-2 7l-2 2 2 2c1 2 0 7 2 7h2m6-18h2c2 0 1 5 2 7l2 2-2 2c-1 2 0 7-2 7h-2" stroke="#e8ce77" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="9" r="1" fill="#e8ce77"/><circle cx="12" cy="15" r="1" fill="#e8ce77"/>';
 else if(["yaml","yml","toml","ini","cfg"].includes(e))art='<path d="M4 6h16M4 12h16M4 18h16" stroke="#bf9ce7" stroke-width="1.6"/><g fill="#bf9ce7" stroke="#262626" stroke-width="1.2"><rect x="7" y="3" width="4" height="6" rx="1"/><rect x="14" y="9" width="4" height="6" rx="1"/><rect x="6" y="15" width="4" height="6" rx="1"/></g>';
 else if(["csv","tsv","xlsx"].includes(e))art='<rect x="3" y="3" width="18" height="18" rx="2" stroke="#71c9ad" stroke-width="1.5"/><path d="M3 9h18M3 15h18M9 9v12M15 9v12" stroke="#71c9ad" stroke-width="1.3"/><path d="M4 4h16v4H4Z" fill="#71c9ad"/>';
 else if(["js","ts","html","css","sh","c","h"].includes(e)){const col=e==="js"?"#e8d572":["html","sh"].includes(e)?"#ee9f78":"#83b8ed";art=`<path d="m8 6-6 6 6 6m8-12 6 6-6 6m-3-15-2 18" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`}
 else art='<path d="M5 2h9l5 5v15H5Z" stroke="#b4bac5" stroke-width="1.5"/><path d="M14 2v6h5M8 12h8M8 16h8" stroke="#b4bac5" stroke-width="1.5" stroke-linejoin="round"/>';
 return `<span class="file-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">${art}</svg></span>`;
}
const ICON={folder:'<svg viewBox="0 0 24 24"><path d="M3 5h7l2 3h9v12H3z"/></svg>',graph:'<svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="9" r="3"/><circle cx="9" cy="19" r="3"/><path d="m9 7 6 1M7 9l1 7m4 1 4-5"/></svg>',
 search:'<svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg>',insp:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>'};

const FLOW=[{id:"intro",name:"시작"},{id:"t1a",name:"과제 1 · 앞부분"},{id:"practice",name:"도구 연습"},{id:"t1b",name:"과제 1 · 뒷부분"},{id:"c1",name:"과제 1 소감"},
 {id:"t2",name:"과제 2"},{id:"c2",name:"과제 2 소감"},{id:"end",name:"끝"}];
let step=0;
const LOG={started:new Date().toISOString(),steps:{}};
function log(k,v){const s=LOG.steps[FLOW[step].id]||(LOG.steps[FLOW[step].id]={t0:Date.now(),events:[]});if(k)s.events.push([Date.now()-s.t0,k,v])}
function go(n){const s=LOG.steps[FLOW[step].id];if(s&&!s.sec)s.sec=Math.round((Date.now()-s.t0)/1000);step=n;LOG.steps[FLOW[step].id]={t0:Date.now(),events:[]};render()}
function bar(){$("where").innerHTML=`· <b>${FLOW[step].name}</b> (${step+1}/${FLOW.length})`;$("prog").style.width=(100*step/(FLOW.length-1))+"%"}
function render(){if(ro){ro.disconnect();ro=null}bar();const id=FLOW[step].id;if(id=="intro")intro();else if(id=="c1"||id=="c2")compare(id);else if(id=="end")end();else workspace(id)}

const LANG={py:"python",yaml:"yaml",yml:"yaml",json:"json",html:"xml",log:"plaintext",c:"c",h:"c",sh:"bash"};
function hl(code,lang){try{return window.hljs?hljs.highlight(code,{language:lang||"plaintext",ignoreIllegals:true}).value:esc(code)}catch(e){return esc(code)}}
function md(t){return window.marked&&window.DOMPurify?DOMPurify.sanitize(marked.parse(t)):`<pre>${esc(t)}</pre>`}
function csv(t){const rows=t.trim().split(/\r?\n/).map(r=>r.split(","));const n=rows.length-1;
 return `<div class="hint" style="margin-bottom:6px">${n}행 · ${rows[0].length}열${n>40?" · 앞 40행만 표시":""}</div><table class="csv"><tr>${rows[0].map(c=>`<th>${esc(c)}</th>`).join("")}</tr>${rows.slice(1,41).map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table>`}
function contentHtml(c){
 if(c.kind=="image")return `<img class="shot" src="${c.data}">`;
 if(c.kind=="pdf")return `<iframe class="pdf" data-pdf="1"></iframe>`;
 if(c.kind=="nb")return c.data.map(([t,s])=>t=="code"?`<div class="cell"><div class="ctag">코드 셀</div><pre class="code"><code class="hljs">${hl(s,"python")}</code></pre></div>`:`<div class="cell doc">${md(s)}</div>`).join("");
 if(c.ext=="md")return `<div class="doc">${md(c.data)}</div>`;
 if(c.ext=="csv")return csv(c.data);
 return `<pre class="code"><code class="hljs">${hl(c.data,LANG[c.ext])}</code></pre>`;
}
function mountPdf(root,c){const f=root.querySelector("iframe[data-pdf]");if(!f)return;const b=atob(c.data),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
 f.src=URL.createObjectURL(new Blob([u],{type:"application/pdf"}))}

function intro(){
 $("app").innerHTML=`<div class="page"><div class="paper"><h2>연구 폴더를 그래프로 정리하는 도구에 대한 사용자 스터디입니다</h2>
 <p>하나의 연구 폴더로 짧은 과제 두 개를 수행합니다. 약 20분이 소요됩니다.</p>
 <div class="box"><span class="lbl">진행 순서</span><ol>
  <li>과제 1 앞부분: 파일 목록만 보고 질문 2개에 답하기</li><li>도구 연습: 그래프 도구 사용법 익히기 (점수 없음)</li>
  <li>과제 1 뒷부분: 같은 폴더를 도구로 보며 질문 2개에 답하기</li><li>과제 2: 필요 없는 연결 2개를 숨기고, 시스템이 더 정리하자고 제안한 것이 맞는지 판단하기</li>
  <li>결과 파일 저장 후 구글 폼에 올리기</li></ol></div>
 <div class="box"><label class="check"><input type="checkbox" id="c1">스터디 내용을 읽었으며 참여에 동의합니다.</label>
 <label class="check"><input type="checkbox" id="c2">화면 조작 기록과 소요 시간이 저장되는 것에 동의합니다.</label><div class="err" id="err"></div>
 <button class="primary" id="go">시작하기</button></div></div></div>`;
 $("c1").onchange=$("c2").onchange=()=>$("err").textContent="";
 $("go").onclick=()=>{if(!$("c1").checked||!$("c2").checked){$("err").textContent="두 항목에 모두 동의해야 시작할 수 있습니다.";return}go(1)};
}
function compare(id){
 const p1=id=="c1",L=p1?["파일 목록만 (앞부분)","도구 (뒷부분)"]:["정리 전","정리 후"],lab=["훨씬","꽤","조금","비슷함","조금","꽤","훨씬"];
 const r=LOG.steps.t2&&LOG.steps.t2.review;
 $("app").innerHTML=`<div class="page"><div class="paper" style="${p1?"":"max-width:1100px"}"><h2>${p1?"과제 1":"과제 2"} 소감</h2>
 ${!p1&&r?`<div class="box"><span class="lbl">정리 전과 후 · 직접 숨긴 ${r.seed.length}개 + 제안 중 받아들인 ${r.items.filter(x=>x.accept).length}개</span>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px"><div><div class="hint">정리 전</div><div id="gBefore" class="minibox"></div></div>
  <div><div class="hint">정리 후</div><div id="gAfter" class="minibox"></div></div></div>
  <div class="legend2"><span><i></i>정리 전 그래프의 빨간 점선이 이번에 숨긴 연결이며, 정리 후 그래프에서는 빠져 있습니다</span><span>휠로 확대할 수 있습니다</span></div></div>`:""}
 <div class="box" style="max-width:640px"><b>${p1?"어느 쪽이 질문의 답을 찾기 더 쉬웠습니까?":"인수인계에는 어느 쪽 그래프가 더 적합합니까?"}</b>
 <div style="display:flex;justify-content:space-between;font-size:13px;margin-top:12px;color:var(--sub)"><span>← ${L[0]}</span><span>${L[1]} →</span></div>
 <div class="scale">${lab.map((l,i)=>`<label><input type="radio" name="sc" value="${i-3}">${l}</label>`).join("")}</div>
 <span class="lbl" style="margin-top:14px">그렇게 고른 이유</span><textarea id="why" placeholder="${p1?"예: 그래프에서 관련 파일을 바로 찾을 수 있었다":"예: 학습·평가에 필요한 파일만 남아 파악하기 쉽다"}"></textarea>
 <div class="err" id="err"></div><button class="primary" id="next">다음</button></div></div></div>`;
 document.querySelectorAll("input[name=sc]").forEach(r=>r.onchange=()=>$("err").textContent="");$("why").oninput=()=>$("err").textContent="";
 $("next").onclick=()=>{const v=document.querySelector("input[name=sc]:checked");if(!v){$("err").textContent="한 칸을 선택해 주십시오.";return}
  if($("why").value.trim().length<5){$("err").textContent="이유를 한 줄 이상 적어 주십시오.";return}
  LOG.steps[id].answer={scale:+v.value,why:$("why").value.trim()};go(step+1)};
 if(!p1&&r){mini($("gBefore"),new Set(),new Set([...r.seed,...r.items.filter(x=>x.accept).map(x=>x.e)]));mini($("gAfter"),new Set([...r.seed,...r.items.filter(x=>x.accept).map(x=>x.e)]))}
}
function end(){
 const S=LOG.steps,qt=k=>{const q=(S[k]||{}).quiz||[];return q.length?`${q.filter(x=>x.ok).length}/${q.length} 정답 · 문항당 평균 ${Math.round(q.reduce((a,x)=>a+(x.sec||0),0)/q.length)}초 · 연 파일 ${q.reduce((a,x)=>a+(x.opens||0),0)}개`:"-"};
 const r=(S.t2||{}).review,src=s=>{if(!r)return"-";const xs=r.items.filter(x=>x.src==s);return `받아들임 ${xs.filter(x=>x.accept).length}/${xs.length} · 정답 기준으로 맞는 제안 ${xs.filter(x=>x.gtOk).length}/${xs.length}`};
 $("app").innerHTML=`<div class="page"><div class="paper"><h2>스터디가 끝났습니다. 참여해 주셔서 감사합니다</h2><p>아래 버튼으로 결과 파일을 저장한 뒤 안내받은 구글 폼에 제출해 주십시오.</p>
 <div class="box"><table class="sum"><tr><th style="width:38%">구간</th><th>기록되는 값</th></tr>
 <tr><td>과제 1 앞 · 파일 목록만</td><td>${qt("t1a")}</td></tr><tr><td>도구 연습</td><td>${(S.practice||{}).sec??"-"}초</td></tr><tr><td>과제 1 뒤 · 도구</td><td>${qt("t1b")}</td></tr>
 <tr><td>과제 2 · 시스템 제안</td><td>${src("drift")}</td></tr><tr><td>과제 2 · 비교용 무작위 제안</td><td>${src("base")}</td></tr>
 <tr><td>소감 (−3 ~ +3)</td><td>과제 1: ${S.c1&&S.c1.answer?S.c1.answer.scale:"-"} · 과제 2: ${S.c2&&S.c2.answer?S.c2.answer.scale:"-"}</td></tr></table>

  color:{background:cc,border:hot?C.text:cc,highlight:{background:c,border:C.text},hover:{background:c,border:C.text}},borderWidth:hot?2:1,

 return {color:{color:col,highlight:C.accent,hover:C.accent},width:hot||cf?2.8:1.8,dashes:e.direct?false:[5,5],label:W.opt&&W.opt.labels?e.rel:"",

  arrows:{to:{enabled:e.d==1,scaleFactor:.5},from:{enabled:e.d==-1,scaleFactor:.5}}}}
function graph(){
 const d=W.d,dg=degree();

 edges=new vis.DataSet(d.edges.map((e,j)=>Object.assign({id:j,from:e.a,to:e.b,hidden:W.hidden.has(j)},edgeView(j))));
 if(net)net.destroy();
 net=new vis.Network($("net"),{nodes,edges},{layout:{randomSeed:7},
  interaction:{hover:true,tooltipDelay:150,selectConnectedEdges:false,hoverConnectedEdges:false},
  /* the team viewer uses gravity -6000 / spring 170; the study panel is smaller, so the layout is pulled in to keep labels readable */
  physics:{solver:"barnesHut",barnesHut:{gravitationalConstant:-2600,centralGravity:1.1,springLength:100,springConstant:.05,avoidOverlap:1},stabilization:{iterations:600}},
  nodes:{scaling:{label:{drawThreshold:3}}},

 net.once("stabilizationIterationsDone",()=>{net.setOptions({physics:false});spread();W.pos=net.getPositions();fitView()});
 net.on("beforeDrawing",ctx=>{[[W.ghov,.45],[W.gsel,1]].forEach(([g,a])=>{if(g==null||g<0||W.ghide.has(g))return;
  const m=W.d.groups[g][1],P=net.getPositions(m),lw=i=>(W.lw&&W.lw[i]||100)/2;
  const x1=Math.min(...m.map(i=>P[i].x-lw(i)))-14,x2=Math.max(...m.map(i=>P[i].x+lw(i)))+14,y1=Math.min(...m.map(i=>P[i].y))-38,y2=Math.max(...m.map(i=>P[i].y))+34;
  const c=gcol(g),rgb=[1,3,5].map(k=>parseInt(c.slice(k,k+2),16)).join(",");

/* the panel is wide and short: stretch the settled layout sideways, then push apart labels that still overlap */
function spread(){

 const q=ids.map(i=>({i,x:P[i].x*1.7,y:P[i].y*.9,w:ctx.measureText(base(W.d.files[i])).width+8}));
 for(let it=0;it<40;it++){let moved=false;
  for(let a=0;a<q.length;a++)for(let b=a+1;b<q.length;b++){const A=q[a],B=q[b],ox=(A.w+B.w)/2-Math.abs(A.x-B.x),oy=30-Math.abs(A.y-B.y);

 const d=W.d,[n,m]=d.groups[g];showInsp();W.ghov=null;setTimeout(()=>net&&net.redraw(),0);W.gsel=g;W.link=null;W.todo.group=true;log("group",g);stick(groupSet(g));legend();if(W.mode=="cards")renderCards();
 const cnt={};d.edges.forEach((e,j)=>{if(W.hidden.has(j))return;const ga=groupOf(e.a),gb=groupOf(e.b);if(ga==g&&gb!=g)cnt[gb]=(cnt[gb]||0)+1;if(gb==g&&ga!=g)cnt[ga]=(cnt[ga]||0)+1});
 $("detail").innerHTML=backHtml()+`<h2>${esc(n)}</h2><div class="row"><span class="badge" style="background:${gcol(g)};color:#fff">그룹</span><span class="badge">파일 ${m.length}개</span></div>
  <div>${esc(d.gdesc[g])}</div>
  <h3>안에 있는 파일</h3>${m.map(i=>fileLink(i,d.sum[i])).join("")}
  <h3>다른 그룹과의 연결</h3>${Object.keys(cnt).length?Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([og,c])=>`<button class="edge-link" data-g="${og}"><span class="dot" style="background:${gcol(+og)};align-self:center"></span><span>${esc(d.groups[og][0])} <span class="hint">· 연결 ${c}개</span></span></button>`).join(""):`<p class="hint">다른 그룹과 이어진 연결이 없습니다.</p>`}`;
 bind();$("iscroll").scrollTop=0;if(net)net.selectNodes(m);refresh();
}
function openLink(k){
 const d=W.d,[ga,gb]=k.split("-").map(Number);W.link=k;log("grouplink",k);renderCards();
 const es=d.edges.map((e,j)=>[e,j]).filter(([e,j])=>!W.hidden.has(j)&&((groupOf(e.a)==ga&&groupOf(e.b)==gb)||(groupOf(e.a)==gb&&groupOf(e.b)==ga)));
 $("detail").innerHTML=backHtml()+`<h2>${esc(d.groups[ga][0])} ↔ ${esc(d.groups[gb][0])}</h2><div class="row"><span class="badge">그룹 사이 연결 ${es.length}개</span></div>
  <h3>연결</h3>${es.map(([e,j])=>`<button class="edge-link" data-e="${j}"><span>${esc(e.s.split(":")[0])} <span class="hint">· ${esc(e.rel)}${e.direct?"":" (추론)"}</span></span></button>`).join("")}`;
 bind();$("iscroll").scrollTop=0;
}
function openFile(i){
 W.sel={k:"f",i};log("open",i);W.qopen++;W.todo.file=true;tree();
 const d=W.d,c=d.content[i];
 if(W.view=="folder"){$("tab").innerHTML=fileIcon(d.files[i])+esc(base(d.files[i]));
  $("viewer").innerHTML=`<h2>${esc(base(d.files[i]))}</h2><div class="path" style="margin-bottom:16px">${esc(d.files[i])}</div>`+contentHtml(c);mountPdf($("viewer"),c);$("viewer").scrollTop=0}
 else{showInsp();const es=d.edges.map((e,j)=>[e,j]).filter(([e,j])=>(e.a==i||e.b==i)&&!W.hidden.has(j));const g=groupOf(i);
  W.gsel=null;W.link=null;stick(neighbours(i));legend();if(W.mode=="cards")renderCards();
  $("detail").innerHTML=backHtml()+`<h2>${esc(base(d.files[i]))}</h2><div class="path">${esc(d.files[i])}</div>
   <div class="row"><span class="badge">${esc((ext(d.files[i])||"file").toUpperCase())}</span><span class="badge" style="background:${gcol(g)};color:#fff;cursor:pointer" data-g="${g}">${esc(d.groups[g][0])}</span></div>
   <h3>요약</h3><div>${esc(d.sum[i])}</div>
   <h3>연결 ${es.length}개</h3>${es.map(([e,j])=>{const o=e.a==i?e.b:e.a;return `<button class="edge-link" data-e="${j}"><span>${arrow(e,i)} ${esc(base(d.files[o]))} <span class="hint">· ${esc(e.rel)}${e.direct?"":" (추론)"}</span></span></button>`}).join("")||`<p class="hint">이어진 파일이 없습니다.</p>`}
   <h3>내용</h3>${contentHtml(c)}`;
  mountPdf($("detail"),c);bind();$("iscroll").scrollTop=0;net.selectNodes([i])}
 refresh();
}
function edgeHtml(j){
 const d=W.d,e=d.edges[j];
 return `<h2>${esc(e.s.split(":")[0])}</h2><div class="path">${esc(d.files[e.a])}<br>${e.d==0?"↔":"→"} ${esc(d.files[e.b])}</div>
  <div class="row"><span class="badge">${esc(e.rel)}</span><span class="badge ${e.direct?"direct":""}">${e.direct?"직접 근거":"추론"}</span>${W.hidden.has(j)?`<span class="badge removed">숨긴 연결</span>`:""}${W.conf.has(j)?`<span class="badge user">맞는 연결로 표시함</span>`:""}</div>
  ${W._act||""}<h3>관계 설명</h3><p class="explain">${esc(e.x||"설명이 없습니다.")}</p>
  <p class="hint" style="margin:6px 0 0">${e.direct?"파일 안에 상대 파일의 이름이나 경로가 직접 적혀 있습니다.":"파일에 직접 적혀 있지는 않으며, 내용으로 추론한 연결입니다."}</p>
  ${e.ev?`<h3>근거</h3><div class="path">${esc(base(e.evf))}에 적힌 부분</div><blockquote>${esc(e.ev.length>360?e.ev.slice(0,360)+" …":e.ev)}</blockquote>`:""}
  <h3>이어진 두 파일</h3>${fileLink(e.a,d.sum[e.a])}${fileLink(e.b,d.sum[e.b])}`;
}
function openEdge(j){
 if(inReview()&&W.props.some(p=>p.e==j&&p.accept==null)){W.pi=W.props.findIndex(p=>p.e==j);showReview();return}
 const e=W.d.edges[j];showInsp();W.sel={k:"e",i:j};log("edge",j);W.todo.edge=true;W.gsel=null;W.link=null;stick({hn:new Set([e.a,e.b]),he:new Set([j])});legend();
 let act="";
 const canFix=W.id=="practice"||(W.id=="t2"&&!W.props);
 if(canFix)act=`<div class="fixbox"><div class="fixh">연결 교정</div>${W.hidden.has(j)?`<p class="hint" style="margin:0">숨긴 연결입니다. 아래 ‘세션 피드백’에서 되돌릴 수 있습니다.</p>`:`<div class="row" style="margin:6px 0">
   <button data-t="edge_confirm" ${W.conf.has(j)?"disabled":""}>맞는 연결</button><button data-t="edge_wrong">잘못된 연결</button><button data-t="edge_irrelevant" class="${W.id=="t2"?"primary":""}">목적상 불필요</button></div>
   <p class="hint" style="margin:0">${W.id=="t2"?"이 과제에서는 인수인계에 필요 없는 연결을 [목적상 불필요]로 숨깁니다.":"[잘못된 연결]과 [목적상 불필요]는 연결을 숨기고, [맞는 연결]은 굵게 표시합니다."}</p>`}</div>`;
 W._act=act;$("detail").innerHTML=backHtml()+edgeHtml(j);W._act="";bind();
 $("detail").querySelectorAll("button[data-t]").forEach(b=>b.onclick=()=>fix(b.dataset.t,j));
 $("iscroll").scrollTop=0;if(net)net.selectEdges([j]);refresh();
}
const FBT={edge_confirm:"맞는 연결 (승인)",edge_wrong:"잘못된 연결 (사실 오류)",edge_irrelevant:"관련은 있지만 목적상 불필요",prop_accept:"목적상 불필요 (시스템 제안 수락)"};
function fix(t,j){
 if(t=="edge_irrelevant"){hide(j);return}
 W.fb.push({t,j});log("feedback",[t,j]);
 if(t=="edge_confirm")W.conf.add(j);else{W.hidden.add(j);W.todo.hide=true}
 applyHidden();renderFb();openEdge(j);
}
function renderFb(){
 const sec=$("fbsec");if(!sec)return;
 const ed=W.id=="practice"||W.id=="t2",n=W.fb.length,canUndo=n&&!(W.id=="t2"&&W.props);
 const nm=j=>`${base(W.d.files[W.d.edges[j].a])} – ${base(W.d.files[W.d.edges[j].b])}`;
 sec.hidden=!ed;
 sec.innerHTML=`<h3>세션 피드백 ${n?`(${n})`:""}</h3>${W.fb.map(f=>`<div class="fb"><span class="t">${FBT[f.t]}:</span> ${esc(nm(f.j))}</div>`).join("")||`<p class="hint">아직 없음</p>`}
  <div class="row"><button id="undo" ${canUndo?"":"disabled"}>되돌리기</button></div>`;
 $("undo").onclick=undo;
 $("sessionStatus").textContent=n?`피드백 ${n}개 · 기록됨`:"탐색 준비 완료";
}
function undo(){
 const f=W.fb.pop();if(!f)return;log("undo",[f.t,f.j]);
 if(f.t=="edge_confirm")W.conf.delete(f.j);else W.hidden.delete(f.j);
 if(f.t=="edge_irrelevant"&&W.id=="t2"){const k=W.seed.lastIndexOf(f.j);if(k>=0)W.seed.splice(k,1)}
 applyHidden();renderFb();if(W.sel&&W.sel.k=="e")openEdge(W.sel.i);else refresh();
}
function hide(j){
 W.hidden.add(j);W.todo.hide=true;log("hide",j);W.fb.push({t:"edge_irrelevant",j});applyHidden();renderFb();
 if(W.id=="t2"){W.seed.push(j);if(W.seed.length>=W.s.seed_hides){buildProps();showReview();return}}
 openEdge(j);
}
function side2(){
 const s=W.s,n=W.seed.length,need=s.seed_hides;
 $("btitle").textContent=W.props?"2단계 · 제안 판단":"1단계 · 연결 숨기기";
 if(!W.props){const e=W.sel&&W.sel.k=="e"?W.sel.i:null;
  $("sidebody").innerHTML=`<div class="sidebox"><h3>연결 ${need}개 숨기기 (${Math.min(n,need)}/${need})</h3><p>필요 없어 보이는 연결을 선택하고 [목적상 불필요]로 숨기십시오. ${need}개를 숨기면 2단계로 넘어갑니다. 잘못 숨긴 연결은 ‘세션 피드백’에서 되돌릴 수 있습니다.</p>
   ${e!=null&&!W.hidden.has(e)?`<div class="actions" style="margin-top:10px"><span style="flex:1;min-width:0">선택한 연결: <b style="font-weight:500">${esc(W.d.edges[e].s.split(":")[0])}</b></span><button class="primary" id="hideSide">목적상 불필요</button></div>`:""}</div>`;
  const b=$("hideSide");if(b)b.onclick=()=>hide(e);return}
 const all=W.props.every(p=>p.accept!=null);
 if(all){reviewDone();return}
 const d=W.d,p=W.props[W.pi],nm=j=>`${base(d.files[d.edges[j].a])} – ${base(d.files[d.edges[j].b])}`;
 $("sidebody").innerHTML=`<div class="suggest"><div class="h">시스템 제안 ${W.pi+1} / ${W.props.length}</div>
   <div style="font-size:13px;margin-top:2px;color:var(--sub)">${W.pi==0&&W.props.every(q=>q.accept==null)?`숨긴 연결 ‘${esc(nm(W.seed[0]))}’${W.seed.length>1?` 외 ${W.seed.length-1}개`:""}와 비슷해서, 이 연결도 인수인계에 필요 없다고 제안했습니다. 그래프의 주황 점선이 제안한 연결이며, 설명은 오른쪽 패널에 있습니다.`:"숨긴 연결과 비슷해서 제안한 연결입니다. 그래프의 주황 점선을 확인하십시오."}</div>
   <div class="q">${esc(d.edges[p.e].s.split(":")[0])}</div>
   <div class="actions" style="margin-top:10px"><button class="primary" id="acc">숨기기에 동의</button><button id="rej">그대로 두기</button>${W.pi>0?`<button class="sm ghost" id="prevP">← 이전</button>`:""}<span class="marks" style="margin-left:auto">${W.props.map(q=>q.accept==null?"○":q.accept?"✓":"✕").join("")}</span></div></div>`;
 const decide=v=>{p.accept=v;log("judge",[p.e,p.src,v]);if(v){W.hidden.add(p.e);W.fb.push({t:"prop_accept",j:p.e})}else W.hidden.delete(p.e);renderFb();
  const nx=W.props.findIndex(q=>q.accept==null);if(nx>=0){W.pi=nx;showReview()}else{applyHidden();reviewDone()}};
 $("acc").onclick=()=>decide(true);$("rej").onclick=()=>decide(false);
 const pv=$("prevP");if(pv)pv.onclick=()=>{W.pi--;showReview()};
}
/* task 2: after the seed hides, 3 suggestions from drift (similar to what was hidden) + 3 random visible links, shuffled, source not shown */
function buildProps(){
 const d=W.d,n=W.s.review/2,used=new Set(W.seed),best={};
 W.seed.forEach(j=>(d.drift[j]||[]).forEach(([k,sc])=>{if(!used.has(k)&&!W.hidden.has(k))best[k]=Math.max(best[k]||0,sc)}));
 const drift=Object.keys(best).map(Number).sort((a,b)=>best[b]-best[a]||a-b).slice(0,n);drift.forEach(k=>used.add(k));
 const rnd=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
 const base_=rnd(d.edges.map((e,j)=>j).filter(j=>!used.has(j)&&!W.hidden.has(j))).slice(0,n);
 W.props=rnd([...drift.map(e=>({e,src:"drift"})),...base_.map(e=>({e,src:"base"}))]).map(p=>Object.assign(p,{accept:null}));
 W.pi=0;log("proposals",W.props.map(p=>[p.e,p.src]));
}
function markProp(){const p=W.props[W.pi];if(p)edges.update([{id:p.e,hidden:false,color:{color:C.prop,highlight:C.prop,hover:C.prop},width:3.5,dashes:[8,5]}])}
function showReview(){
 const p=W.props[W.pi],e=W.d.edges[p.e];renderFb();if(W.mode=="cards")setMode("2d");stick({hn:new Set([e.a,e.b]),he:new Set()});
 $("detail").innerHTML=`<div class="propbar">지금 판단 중인 시스템 제안</div>`+edgeHtml(p.e);bind();
 $("iscroll").scrollTop=0;net.selectEdges([p.e]);side2();setTimeout(()=>{const A=net.getPosition(e.a),B=net.getPosition(e.b);revealPt({x:(A.x+B.x)/2,y:(A.y+B.y)/2})},30);
}
function reviewDone(){
 const acc=W.props.filter(p=>p.accept).length;stick(null);if($("detail")&&$("detail").querySelector(".propbar"))overview();
 $("sidebody").innerHTML=`<div class="sidebox"><h3>제안 판단 끝</h3><p>제안 ${W.props.length}개 중 ${acc}개를 숨겼습니다. 정리된 그래프를 확인한 뒤 다음으로 넘어가 주십시오. 아래 항목을 누르면 다시 판단할 수 있습니다.</p>
  <div class="list" style="margin-top:8px">${W.props.map((p,k)=>`<div class="row2" data-k="${k}"><span style="color:${p.accept?"var(--bad)":"var(--ok)"};width:32px">${p.accept?"숨김":"남김"}</span><span>${esc(W.d.edges[p.e].s.split(":")[0])}</span></div>`).join("")}</div></div>
  <div class="sidefoot"><button class="primary" id="done">다음</button></div>`;
 $("sidebody").querySelectorAll("[data-k]").forEach(x=>x.onclick=()=>{W.pi=+x.dataset.k;const p=W.props[W.pi];p.accept=null;W.hidden.delete(p.e);W.fb=W.fb.filter(f=>!(f.t=="prop_accept"&&f.j==p.e));renderFb();applyHidden();showReview()});
 $("done").onclick=finish2;
}
function mini(el,hidden,mark){
 const d=W.d,dg={},pos=POS||{};d.edges.forEach((e,j)=>{if(hidden.has(j))return;dg[e.a]=(dg[e.a]||0)+1;dg[e.b]=(dg[e.b]||0)+1});
 const n=new vis.DataSet(d.files.map((f,i)=>Object.assign({id:i,label:base(f)},nodeView(i,undefined,dg),pos[i]?{x:pos[i].x,y:pos[i].y}:{})));
 const e=new vis.DataSet(d.edges.map((x,j)=>Object.assign({id:j,from:x.a,to:x.b},hidden.has(j)?{hidden:true}:mark&&mark.has(j)?{color:{color:C.bad},width:2.6,dashes:[4,4],arrows:{to:{enabled:false}}}:edgeView(j))));
 const nw=new vis.Network(el,{nodes:n,edges:e},{physics:false,interaction:{dragNodes:false,zoomView:true,hover:false},edges:{smooth:{type:"continuous"}}});
 nw.once("afterDrawing",()=>nw.fit({animation:false}));
}
function finish2(){
 const st=W.d.st[W.s.pid];POS=W.pos;
 LOG.steps.t2.review={seed:W.seed.slice(),items:W.props.map(p=>({e:p.e,src:p.src,accept:p.accept,gtOk:st[p.e]==0}))};
 go(step+1);
}
LOG.steps.intro={t0:Date.now(),events:[]};render();
</script>
