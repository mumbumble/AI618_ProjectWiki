<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProjectWiki 사용자 스터디</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/standalone/umd/vis-network.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<style>
/* tokens and base styles follow the team viewer (projectwiki/srcs/view_template.html, main @ aeebcf0) */
:root{color-scheme:dark;
 --bg:#1e1e1e;--panel:#262626;--text:#dedede;--sub:#bdbdbd;--muted:#a3a3a3;--line:#363636;--line2:#4a4a4a;
 --accent:#b49af4;--accdeep:#7658b9;--accsoft:#3a3248;--ok:#7cbb9c;--oksoft:#26332c;--bad:#e98b90;--chip:#333136;--rail:#202020;
 --warn:#e0a458;--warnsoft:#33291c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif}
body{display:flex;flex-direction:column;overflow:hidden;word-break:keep-all;overflow-wrap:break-word}
p,li,h2,h3,.explain,.qtext,.callout,.suggest,.purpose,.inst,.empty-state,.fb,.brief,.summary,.sidebox,.edge-link span{text-wrap:pretty}
h2,.qtext,.suggest .q,.brief h2,.paper h2{text-wrap:balance}
.path,.file span,.card-file span,blockquote,.code,.doc code,.csv{word-break:normal;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--chip);border-radius:5px;padding:5px 10px;cursor:pointer}
button:hover{background:#403b49}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accdeep);color:#fff;border-color:#8768ca} button.primary:hover{background:#8466c7}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)} button.ghost:hover{color:var(--text);background:var(--chip)}
button:disabled{opacity:.4;cursor:default}
button.sm{font-size:12px;padding:2px 9px}
.hint{color:var(--muted);font-size:12px}
.mono,.path{font-family:ui-monospace,Consolas,monospace}

/* header */
header{display:flex;flex:none;align-items:center;height:43px;padding:0 16px;background:var(--rail);border-bottom:1px solid var(--line);gap:10px;position:relative}
header h1{font-size:14px;font-weight:600;margin:0}
.brand{color:var(--accent);font-size:22px}
#where{color:var(--muted);font-size:12px;margin-left:6px} #where b{color:var(--text);font-weight:500}
.header-note{margin-left:auto;color:var(--muted);font-size:12px}
#prog{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);transition:width .4s}
#app{flex:1;min-height:0;display:flex;flex-direction:column}

/* task strip */
.task{flex:none;display:flex;align-items:center;gap:14px;min-height:44px;padding:8px 16px;background:var(--rail);border-bottom:1px solid var(--line)}
.plbl{flex:none;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.plbl .pill{display:inline-block;padding:1px 8px;border-radius:4px;background:#38303f;color:var(--accent);font-weight:600;font-size:12px}
.purpose{flex:1;min-width:0;font-size:14.5px;color:var(--text);line-height:1.5}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:0 6px;border-radius:4px;margin-right:8px;background:var(--warnsoft);color:var(--warn);border:1px solid #6b5230;letter-spacing:0}
.inst{flex:none;font-size:12px;color:var(--muted)}

/* workspace */
.workspace{flex:1;min-height:0;display:flex;position:relative}
.ribbon{width:46px;flex:none;background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:10px}
.icon-button{border:0;background:transparent;width:32px;height:32px;padding:6px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.icon-button svg,.tab svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5}
.ribbon .active{color:var(--accent);background:#38303f}
.ribbon .bottom{margin-top:auto}
.explorer{width:255px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.workspace.folder .explorer{width:285px}
.noexp .explorer,.noinsp .inspector,.noinsp #vsplit{display:none}
.pane-title{height:43px;padding:10px 16px;border-bottom:1px solid var(--line);font-weight:500;display:flex;align-items:center;gap:8px;flex:none}
.pane-title .hint{margin-left:auto}
.search-box{margin:14px 12px 6px}
#search{width:100%;padding:6px 10px;background:var(--bg);border:1px solid var(--line);border-radius:5px}
#search::placeholder{color:var(--muted)}
.explorer-scroll{overflow:auto;padding:4px 10px 16px;flex:1}
.section-title{font-size:12px;letter-spacing:.6px;color:var(--muted);margin:20px 8px 8px;font-weight:600}
.vault-name{padding:8px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-tree details{margin-left:10px} .file-tree>details{margin-left:0}
.file-tree summary{cursor:pointer;color:#bdbdbd;padding:3px 4px;overflow-wrap:anywhere}
.file{border:0;background:transparent;display:flex;align-items:center;gap:7px;width:100%;text-align:left;padding:4px 8px;color:#bcbcbc;border-radius:4px}
.file span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-icon{display:inline-flex;align-items:center;justify-content:center;flex:none;width:20px;height:20px}
.file-icon svg{display:block;width:18px;height:18px}
.file:hover,.file.hov{background:var(--chip)}
.file.selected{background:var(--accsoft);color:#d4bfff}
#legend .item{display:flex;width:100%;gap:8px;align-items:center;text-align:left;padding:5px 8px;border:0;background:transparent;border-radius:4px}
#legend .item:hover{background:var(--chip)} #legend .item.on{background:var(--accsoft);color:#e1d3ff}
#legend .item .hint{margin-left:auto}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.wantfile .callout:not(.ready){animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #b49af400}50%{box-shadow:0 0 0 3px #b49af455}}

main{flex:1;min-width:0;display:flex;flex-direction:column}
.tabbar{height:43px;background:var(--rail);display:flex;padding:5px 8px 0;gap:4px;border-bottom:1px solid var(--line);flex:none}
.tab{display:flex;align-items:center;gap:9px;padding:6px 16px;min-width:165px;max-width:360px;border:1px solid var(--line);border-bottom:0;background:var(--bg);border-radius:7px 7px 0 0;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab svg{color:var(--accent)} .tab .file-icon svg{width:16px;height:16px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:8px 20px;border-bottom:1px solid #2b2b2b;flex:none}
.breadcrumb{color:var(--muted);font-size:13px} .breadcrumb strong{color:var(--text);font-weight:500}
.view-mode{display:inline-flex;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--rail)}
.view-mode button{border:0;background:transparent;padding:3px 10px;color:var(--muted)}
.view-mode button[aria-pressed="true"]{background:#493b65;color:#e1d3ff}
#graphwrap{flex:1;min-height:160px;position:relative}
#net{position:absolute;inset:0}
#groupgraph{position:absolute;inset:0;overflow:hidden;cursor:grab}
#groupgraph.drag{cursor:grabbing}
#net[hidden],#groupgraph[hidden]{display:none}
#groupScene{position:absolute;left:0;top:0;transform-origin:0 0}
#groupLinks{position:absolute;left:0;top:0;overflow:visible}
.graph-caption{position:absolute;left:22px;top:16px;pointer-events:none;color:var(--muted);font-size:12px}
.graph-caption strong{display:block;font-size:16px;color:#cecece;font-weight:500;margin-bottom:2px}
.tools{display:flex;align-items:center;gap:8px}
.graph-options{position:relative}
.graph-options summary{cursor:pointer;padding:5px 10px;color:var(--muted);list-style:none;border-radius:5px} .graph-options summary:hover{color:var(--text);background:var(--chip)}
.graph-options summary::-webkit-details-marker{display:none} .graph-options summary:before{content:"▸ ";font-size:11px} .graph-options[open] summary:before{content:"▾ "}
.options-panel{position:absolute;right:0;top:36px;width:200px;background:var(--panel);padding:10px 12px;border:1px solid var(--line);border-radius:7px;z-index:5;box-shadow:0 8px 24px #0006}
.options-panel label{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer}
input[type=checkbox]{accent-color:#a88be5}
.group-row{display:flex;align-items:center;gap:5px}
.group-row .item{min-width:0;flex:1}
.group-row.off .item{opacity:.55}
.visibility-switch{position:relative;flex:none;width:30px;height:18px;padding:0;border:1px solid #65616b;border-radius:12px;background:#4a474f;margin-right:4px}
.visibility-switch::after{content:"";position:absolute;width:12px;height:12px;left:2px;top:2px;border-radius:50%;background:#e6e3eb}
.visibility-switch[aria-checked="true"]{background:#8060bd;border-color:#a88be5}
.visibility-switch[aria-checked="true"]::after{left:14px;background:#fff}
.visibility-switch:hover{border-color:var(--accent)}
.feedback-section{border-top:1px solid var(--line);margin-top:24px}
.fb{font-size:13px;padding:7px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.fb .t{color:var(--muted)}
footer{height:27px;flex:none;display:flex;align-items:center;gap:16px;padding:0 14px;border-top:1px solid var(--line);background:var(--rail);color:var(--muted);font-size:12px}
#sessionStatus{margin-left:auto}
.graph-empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:var(--muted);pointer-events:none}
.graph-empty[hidden]{display:none}
.graph-controls{position:absolute;right:18px;top:16px;display:flex;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:3px}
.graph-controls button{background:transparent;border:0;font-size:18px;min-width:32px;line-height:1.2}
.graph-controls button:last-child{font-size:13px;border-left:1px solid var(--line);border-radius:0 4px 4px 0}
.group-card{position:absolute;width:270px;border:1.5px solid var(--gc);border-radius:9px;background:#26282f;box-shadow:0 4px 14px #0003;overflow:hidden}
.group-card.on,.group-card.focused{box-shadow:0 0 0 3px #b49af44d}
.group-card-header{padding:11px 13px 8px;border-bottom:1px solid #ffffff12;cursor:pointer}
.group-card-header:hover{background:#2d2f37}
.group-card-title{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.group-card-title .dot{background:var(--gc)}
.group-card-header .hint{display:block;margin:3px 0 0 16px}
.group-card-items{padding:7px;max-height:248px;overflow:auto;overscroll-behavior:contain}
.card-file{display:flex;align-items:center;gap:9px;width:100%;padding:4px 8px;border:0;background:transparent;text-align:left;font-size:13.5px;border-radius:4px}
.card-file .badge-ext{display:inline-flex;align-items:center;justify-content:center;flex:none;min-width:38px;height:22px;padding:0 5px;border:1px solid #626262;border-radius:5px;background:#303030;color:#dedede;font:700 11px/1 ui-monospace,Consolas,monospace}
.card-file span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-file.selected{background:#493b65;color:#e1d3ff}
.group-connection{cursor:pointer}
.group-connection .cl{fill:none;stroke:#80798d;opacity:.7}
.group-connection .ch{fill:none;stroke:transparent;stroke-width:18}
.group-connection:hover .cl,.group-connection.on .cl{stroke:var(--accent);opacity:1}
.group-connection rect{fill:#302c38;stroke:#665d76}
.group-connection text{fill:#e0d7eb;font:13px "Segoe UI","Malgun Gothic",sans-serif;text-anchor:middle;dominant-baseline:central}

/* folder-only viewer */
#viewer{position:absolute;inset:0;overflow:auto;padding:28px 36px var(--cardh,280px)}
#viewer h2{font-size:18px;font-weight:600;margin:0 0 4px}

/* inspector */
#vsplit{width:5px;flex:none;cursor:col-resize;background:var(--line);border-left:1px solid var(--rail)}
#vsplit:hover,#vsplit.drag{background:#5b4b7c}
.inspector{width:var(--dw,400px);flex:none;background:var(--panel);display:flex;flex-direction:column;min-height:0}
.inspector-scroll{overflow:auto;padding:20px 20px var(--cardh,240px);flex:1}
.inspector h2{font-size:18px;font-weight:600;margin:0 0 6px;overflow-wrap:anywhere}
.inspector h3{font-size:13px;font-weight:600;margin:22px 0 8px;color:var(--sub)}
.empty-state{padding:24px 0 10px}
.empty-symbol{color:var(--accent);font-size:30px;margin-bottom:16px}
.empty-state p{color:var(--muted)}
.path{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.badge{display:inline-block;font-size:12px;padding:2px 7px;border-radius:4px;background:var(--chip)}
.badge.direct{background:#483c62;color:#d9c6ff}
.badge.removed{background:#573439;color:#ffb6bd}
.badge.prop{background:var(--warnsoft);color:var(--warn)}
.badge.user{background:#304b3c;color:#a4ddbe}
.inspector-scroll>#detail{min-height:40%}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
blockquote{margin:6px 0 14px;padding:8px 12px;border-left:2px solid #77629d;background:#222;font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere;font-family:ui-monospace,Consolas,monospace;color:#cfcfcf}
.edge-link{cursor:pointer;display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:7px 0;font-size:13px;border-radius:0;overflow-wrap:anywhere}
.edge-link:hover{color:var(--accent);background:transparent}
.edge-link .file-icon{align-self:center}
.edge-link .hint{font-size:12px}
.explain{font-size:14.5px;line-height:1.7;margin:0}
.back{display:inline-block;font-size:12px;color:var(--muted);cursor:pointer;margin-bottom:12px} .back:hover{color:var(--accent)}
.propbar{margin:-20px -20px 16px;padding:10px 20px;background:var(--warnsoft);color:var(--warn);font-size:12px;font-weight:600;border-bottom:1px solid #6b5230}
.fixrow{border-top:1px solid var(--line);margin-top:22px;padding-top:4px}

/* file contents */
.doc{font-size:14px;line-height:1.75}
.doc h1{font-size:19px;margin:4px 0 12px} .doc h2{font-size:16px;margin:20px 0 8px} .doc h3{font-size:14.5px;margin:16px 0 6px;color:var(--text)}
.doc table{border-collapse:collapse;margin:8px 0;font-size:13px} .doc td,.doc th{border:1px solid var(--line);padding:4px 8px}
.doc code{font:12.5px ui-monospace,Consolas,monospace;color:#bba6db;background:#202020;padding:1px 4px;border-radius:3px}
.doc pre{background:#202020;padding:10px 12px;border-radius:5px;overflow:auto;border:1px solid var(--line)} .doc pre code{background:none;padding:0;color:inherit}
.doc blockquote{font-family:inherit;background:none}
.doc a{color:var(--accent)}
.code{margin:0;border-radius:5px;overflow:auto;font:12.5px/1.6 ui-monospace,Consolas,monospace;border:1px solid var(--line);background:#202020}
.code code{display:block;padding:10px 12px;white-space:pre;background:none!important}
.csv{border-collapse:collapse;font-size:12.5px} .csv td,.csv th{border:1px solid var(--line);padding:3px 8px} .csv th{background:#202020}
.cell{margin:10px 0} .cell .ctag{font-size:11px;color:var(--muted);margin-bottom:2px}
.pdf{width:100%;height:calc(100vh - 250px - var(--cardh,0px));min-height:300px;border:1px solid var(--line);border-radius:5px;background:#fff}
img.shot{max-width:100%;border-radius:5px;border:1px solid var(--line);background:#fff}

/* question / task bar under the graph */
#bottom{flex:none;border-top:1px solid var(--line);background:var(--panel);max-height:46%;display:flex;flex-direction:column}
.bhead{display:flex;align-items:center;gap:12px;height:36px;padding:0 20px;cursor:pointer;user-select:none;flex:none;border-bottom:1px solid var(--line);background:var(--rail)}
.bhead:hover .fold{color:var(--text)}
.bhead .lbl{font-size:13px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:8px}
.bhead .lbl:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)} .practice-b .bhead .lbl:before{background:var(--warn)}
.bhead .mini{flex:1;min-width:0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0}
#bottom.min .mini{opacity:1}
.bhead .fold{color:var(--muted);font-size:12px;margin-left:auto}
#bottom.min #sidebody{display:none} #bottom.min .bhead{border-bottom:0}
#sidebody{overflow:auto}
.sidebox,.qwrap{padding:14px 20px}
.sidebox h3{margin:0 0 4px;font-size:14px;font-weight:600}
.sidebox p{margin:0;color:var(--muted);font-size:13px}
.qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.qhead .lbl{display:none}
.qtext{font-size:16px;font-weight:500;line-height:1.5;margin-bottom:10px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{text-align:left;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);display:flex;gap:10px;align-items:center}
.opt:hover{border-color:#8062ba;background:#2a2730}
.opt.on{background:#493b65;border-color:#8062ba;color:#e1d3ff}
.opt .k{font:600 11px ui-monospace,Consolas,monospace;color:var(--muted);width:12px} .opt.on .k{color:#e1d3ff}
.callout{border:1px solid #5b4b7c;background:#2b2635;border-radius:6px;padding:10px 14px}
.callout .big{font-size:14px;font-weight:600;color:#d4bfff}
.callout .sm{font-size:12.5px;color:var(--muted);margin-top:2px}
.callout.ready{border-color:#3f6a55;background:var(--oksoft)} .callout.ready .big{color:var(--ok)}
.pickbtn{width:100%;margin-top:8px;padding:8px 14px}
.steps{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.steps li{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;color:var(--muted)}
.steps .n{flex:0 0 20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:1px solid var(--line2)}
.steps li.now{color:var(--text);border-color:#6b5230} .steps li.now .n{background:var(--warn);border-color:var(--warn);color:#1e1e1e}
.steps li.ok{color:var(--ok)} .steps li.ok .n{background:var(--oksoft);border-color:var(--ok)}
.locked{padding:0 20px 14px;color:var(--muted);font-size:13px}
.empty{padding:14px 20px;color:var(--muted);font-size:13px}
.suggest{padding:14px 20px;background:var(--warnsoft)}
.suggest .h{font-size:12px;font-weight:600;color:var(--warn)}
.suggest .q{font-size:15px;font-weight:500;margin:6px 0 2px}
.actions{display:flex;gap:8px;align-items:center}
.marks{font-size:13px;letter-spacing:4px;color:var(--muted)}
.list .row2{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:13px;cursor:pointer} .list .row2:hover{color:var(--accent)}
.sidefoot{padding:0 20px 14px}

/* briefing */
.brief{position:fixed;inset:0;z-index:50;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px}
.brief .card{max-width:640px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:28px 30px;box-shadow:0 20px 60px #0008}
.brief .k{font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.6px}
.brief h2{font-size:21px;font-weight:600;margin:4px 0 10px}
.brief p{color:var(--sub);margin:0 0 12px}
.brief ul{margin:0;padding-left:18px;color:var(--sub)} .brief li{margin:5px 0}
.brief .foot{display:flex;align-items:center;justify-content:space-between;margin-top:20px}
.legend3{display:grid;grid-template-columns:30px 1fr 30px 1fr;gap:8px 10px;align-items:center;font-size:13px;color:var(--sub);margin:6px 0 16px;padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:6px}

/* intro / survey / end pages */
.page{flex:1;overflow:auto;display:flex;justify-content:center;padding:52px 20px}
.paper{max-width:640px;width:100%}
.paper h2{font-size:22px;font-weight:600;margin:0 0 8px}
.paper>p{color:var(--muted);margin:0 0 20px}
.box{border-top:1px solid var(--line);padding:20px 0}
.box .lbl{display:block;font-size:12px;letter-spacing:.6px;color:var(--muted);font-weight:600;margin-bottom:6px}
.box ol{margin:6px 0 0;padding-left:20px;color:var(--sub)} .box li{margin:3px 0}
.check{display:flex;gap:8px;align-items:flex-start;margin:6px 0} .check input{accent-color:#a88be5;margin-top:5px}

function qHtml(x,n){
 const body=x.t=="scale"?`<div class="scale">${[1,2,3,4,5,6,7].map(i=>`<label><input type="radio" name="${x.k}" value="${i}">${i}</label>`).join("")}</div>
   <div class="scale-ends"><span>전혀 그렇지 않다</span><span>매우 그렇다</span></div>`
  :x.t=="text"?`<textarea id="s_${x.k}" placeholder="${x.ph}"></textarea>`
  :`<div class="opts">${x.o.map(o=>`<label><input type="${x.t=="check"?"checkbox":"radio"}" name="${x.k}" value="${o}">${o}</label>`).join("")}</div>`;
 return `<div class="q"><b>${n}. ${x.q}</b>${body}</div>`;
}
function qRead(list,start){const A={};
 for(const [i,x] of list.entries()){
  if(x.t=="text"){A[x.k]=$("s_"+x.k).value.trim();continue}
  const v=[...document.querySelectorAll(`input[name=${x.k}]:checked`)].map(e=>e.value);
  if(!v.length)return {err:`${start+i}번 문항에 답해 주세요.`};
  A[x.k]=x.t=="check"?v:x.t=="scale"?+v[0]:v[0]}
 return {A};
}

/* task 2: after the seed hides, 3 suggestions from drift (similar to what was hidden) + 3 random visible links, shuffled, source not shown */
function buildProps(){
 const d=W.d,n=W.s.review/2,used=new Set(W.seed),best={};
 W.seed.forEach(j=>(d.drift[j]||[]).forEach(([k,sc])=>{if(!used.has(k)&&!W.hidden.has(k))best[k]=Math.max(best[k]||0,sc)}));
 const drift=Object.keys(best).map(Number).sort((a,b)=>best[b]-best[a]||a-b).slice(0,n);drift.forEach(k=>used.add(k));
 const rnd=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
 const base_=rnd(d.edges.map((e,j)=>j).filter(j=>!used.has(j)&&!W.hidden.has(j))).slice(0,n);
 W.props=rnd([...drift.map(e=>({e,src:"drift"})),...base_.map(e=>({e,src:"base"}))]).map(p=>Object.assign(p,{accept:null}));
 W.pi=0;log("proposals",W.props.map(p=>[p.e,p.src]));
}

function reviewDone(){
 const acc=W.props.filter(p=>p.accept).length;stick(null);if($("detail")&&$("detail").querySelector(".propbar"))overview();
 $("sidebody").innerHTML=`<div class="sidebox"><h3>제안을 모두 판단했습니다</h3><p>제안 ${W.props.length}개 중 ${acc}개를 숨겼습니다. 정리된 그래프를 한번 둘러본 뒤 [다음]을 눌러 주세요. 판단을 바꾸려면 아래 항목을 누르면 됩니다.</p>
  <div class="list" style="margin-top:8px">${W.props.map((p,k)=>`<div class="row2" data-k="${k}"><span style="color:${p.accept?"var(--bad)":"var(--ok)"};width:32px">${p.accept?"숨김":"남김"}</span><span>${esc(W.d.edges[p.e].s.split(":")[0])}</span></div>`).join("")}</div></div>
  <div class="sidefoot"><button class="primary" id="done">다음</button></div>`;
 $("sidebody").querySelectorAll("[data-k]").forEach(x=>x.onclick=()=>{W.pi=+x.dataset.k;const p=W.props[W.pi];p.accept=null;W.hidden.delete(p.e);W.fb=W.fb.filter(f=>!(f.t=="prop_accept"&&f.j==p.e));renderFb();applyHidden();showReview()});
 $("done").onclick=finish2;
}
function mini(el,hidden,mark){
 const d=W.d,dg={},pos=POS||{};d.edges.forEach((e,j)=>{if(hidden.has(j))return;dg[e.a]=(dg[e.a]||0)+1;dg[e.b]=(dg[e.b]||0)+1});
 const lone=i=>hidden.size&&!dg[i]&&d.edges.some(e=>e.a==i||e.b==i),dg0={},touch=new Set();
 d.edges.forEach((e,j)=>{dg0[e.a]=(dg0[e.a]||0)+1;dg0[e.b]=(dg0[e.b]||0)+1;if(hidden.has(j)||mark&&mark.has(j)){touch.add(e.a);touch.add(e.b)}});
 const n=new vis.DataSet(d.files.map((f,i)=>Object.assign({id:i,label:dg0[i]>=4||touch.has(i)?base(f):""},nodeView(i,lone(i)?false:undefined,dg),{font:{size:15,color:lone(i)?"#5c5c5c":C.text,strokeWidth:4,strokeColor:C.bg}},pos[i]?{x:pos[i].x,y:pos[i].y}:{})));
 const e=new vis.DataSet(d.edges.map((x,j)=>Object.assign({id:j,from:x.a,to:x.b},hidden.has(j)?{hidden:true}:mark&&mark.has(j)?{color:{color:"#ff5c6c"},width:4.5,dashes:[8,5],arrows:{to:{enabled:false},from:{enabled:false}}}:Object.assign(edgeView(j),{color:{color:"#57525e"}}))));
 const nw=new vis.Network(el,{nodes:n,edges:e},{physics:false,interaction:{dragNodes:false,zoomView:true,hover:false},edges:{smooth:{type:"continuous"}}});
 nw.once("afterDrawing",()=>nw.fit({animation:false}));
}
function finish2(){
 const st=W.d.st[W.s.pid];POS=W.pos;
 LOG.steps.t2.review={seed:W.seed.slice(),items:W.props.map(p=>({e:p.e,src:p.src,accept:p.accept,gtOk:st[p.e]==0}))};
 go(step+1);
}
LOG.steps.intro={t0:Date.now(),events:[]};render();
