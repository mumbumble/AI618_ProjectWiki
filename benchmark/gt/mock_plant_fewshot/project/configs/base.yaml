# LeafProto base configuration
# Default hyperparameters for episodic training on leafdoc_fs.
# Experiment configs inherit from this file and override only what they change.
# Owner: Park Hyunwoo (training code). Last edited 2026-10-02.

seed: 42

data:
  root: data/leafdoc_fs          # dataset folder with photos and metadata
  image_size: 84                 # leaf photos resized to 84x84
  num_workers: 4
  splits:
    train_classes: 30            # base classes used for meta-training
    val_classes: 12              # used for model selection during training
    test_classes: 12             # novel classes, only used in evaluation

episode:
  n_way: 5
  k_shot: 1
  n_query: 15
  batch_episodes: 1              # one episode per optimizer step

model:
  name: LeafProtoNet
  encoder: resnet12
  channels: [64, 160, 320, 640]
  embed_dim: 640                 # after global average pooling

head:
  type: cosine_prototype
  scale_init: 10.0               # learnable scale s, initialised here

freqmix:
  enabled: true
  beta: 0.1                      # centered square band covering 10% of the shorter side
  lam_min: 0.3                   # lam ~ Uniform(lam_min, lam_max)
  lam_max: 0.7
  p: 0.5                         # apply probability per image
  apply_to: [support, query]
  apply_phase: train_only        # FreqMix is off at evaluation time

loss:
  ce: true
  lambda_cons: 0.5               # weight of KL consistency term

optim:
  name: adam
  lr: 0.001
  weight_decay: 0.0005
  scheduler: cosine

train:
  episodes: 40000
  eval_every: 500                # steps between validation runs
  save_best: true
  best_metric: val_acc
  checkpoint_dir: checkpoints
  log_dir: logs                  # log file name is built from the run date

eval:
  test_episodes: 600
  n_way: 5
  n_query: 15
  confidence: 0.95               # reported as ci95 over episodes
  results_dir: results
