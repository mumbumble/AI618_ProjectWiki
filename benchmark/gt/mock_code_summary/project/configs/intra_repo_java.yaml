# RepoSum main experiment: Java, intra-repository split
# Usage:
#   python src/train.py --config configs/intra_repo_java.yaml
#   python src/evaluate.py --config configs/intra_repo_java.yaml --ckpt checkpoints/best.pt
#
# Everything not listed here is inherited from configs/base.yaml.

inherits: base.yaml

experiment:
  name: reposum_intra_repo_java
  method: RepoSum
  version: 0.3.1
  notes: "Main setting for Table 1 and Figure 2 of the paper (intra_repo split)."

data:
  dataset: repojava_sum
  split: intra_repo          # chronological 80/10/10 per repository
  max_source_len: 400        # tokens of the function body
  max_summary_len: 48        # tokens of the target summary
  vocab_size: 32000          # BPE

retrieval:
  k: 4                       # number of sibling functions kept per query
  scope: repo                # repo-scoped index (not global)
  temperature: 0.07          # tau in softmax over cos(e_q, e_i)
  exclude_self: true         # drop the query function from the index
  commit_time_filter: true   # drop functions from commits later than the query

fusion:
  type: gated                # h = h_q + g * c, with g = sigmoid(W [h_q ; c])

loss:
  lambda_ret: 0.3            # L = L_ce + lambda * L_ret
  ret_temperature: 0.07      # InfoNCE temperature
  ret_positives: call_graph  # share a call-graph neighbor with the query

train:
  epochs: 20
  batch_size: 32
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 1000
  dropout: 0.1
  seed: 13
  log_file_pattern: "logs/train_{date}.log"

eval:
  beam_size: 5
  metric: bleu4
  bootstrap_samples: 1000
  ci_level: 0.95
